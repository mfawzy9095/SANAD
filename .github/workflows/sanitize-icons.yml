name: Sanitize SANAD PNG Resources

on:
  push:
    branches: [source-v27]
    paths:
      - '.github/workflows/sanitize-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v27
          fetch-depth: 0

      - name: Repair and re-encode launcher PNGs safely
        shell: bash
        run: |
          set -euo pipefail
          file app/src/main/res/drawable-nodpi/*.png || true
          for f in app/src/main/res/drawable-nodpi/*.png; do echo "HEADER $f"; xxd -l 48 "$f"; done
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, re, io
          files=[
            Path('app/src/main/res/drawable-nodpi/sanad_launcher_full.png'),
            Path('app/src/main/res/drawable-nodpi/sanad_launcher_foreground.png'),
          ]
          for p in files:
              raw=p.read_bytes()
              if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                  try:
                      text=raw.decode('ascii').strip()
                      if text.startswith('data:image'):
                          text=text.split(',',1)[1]
                      text=re.sub(r'\s+','',text)
                      decoded=base64.b64decode(text,validate=False)
                      if not decoded.startswith(b'\x89PNG\r\n\x1a\n'):
                          raise ValueError('decoded data is not PNG')
                      p.write_bytes(decoded)
                      print('decoded base64 wrapper:',p,len(raw),'->',len(decoded))
                  except Exception as e:
                      raise SystemExit(f'{p}: not a valid PNG and base64 repair failed: {e}')
              with Image.open(p) as im:
                  im.load()
                  print('opened',p,im.format,im.mode,im.size)
                  clean=im.convert('RGBA') if im.mode not in ('RGB','RGBA') else im.copy()
              tmp=p.with_suffix('.clean.png')
              clean.save(tmp,format='PNG',optimize=False,compress_level=6)
              tmp.replace(p)
              with Image.open(p) as check:
                  check.verify()
              assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              print('verified clean PNG:',p,p.stat().st_size)
          PY
          file app/src/main/res/drawable-nodpi/*.png
          for f in app/src/main/res/drawable-nodpi/*.png; do xxd -l 16 "$f"; done

      - name: Commit sanitized resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SANAD Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/sanad_launcher_full.png app/src/main/res/drawable-nodpi/sanad_launcher_foreground.png
          git diff --cached --quiet && exit 0
          git commit -m "Re-encode launcher PNGs for reliable AAPT2 compilation"
          git push origin source-v27
