name: Build SANAD V3.4 Voice Test APK

on:
  push:
    branches: [source-v34]
    paths:
      - '.github/workflows/build-v34-voice-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v34

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android native tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;35.0.0"

      - name: Add whisper.cpp and model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch v1.7.6 https://github.com/ggerganov/whisper.cpp.git app/src/main/cpp/whisper.cpp
          rm -rf app/src/main/cpp/whisper.cpp/.git
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 5             -o app/src/main/assets/models/ggml-base-q5_1.bin             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true"

      - name: Convert to isolated voice-test package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="    androidResources { noCompress 'bin' }"
          block="""    buildTypes {
              debug {
                  applicationIdSuffix '.voicetest'
                  versionNameSuffix '-voicetest'
              }
          }
          """
          s=s.replace(marker,block+marker)
          p.write_text(s)
          m=Path("app/src/main/AndroidManifest.xml")
          x=m.read_text()
          x=x.replace('android:label="SANAD"','android:label="SANAD Voice Test"')
          m.write_text(x)
          PY

      - name: Run voice regressions
        shell: bash
        run: |
          set -euo pipefail
          node qa/test-v31-ready-race.js
          node --check app/src/main/assets/v31_voice.js
          grep -q "isClientSilenced" app/src/main/java/com/sanad/full/WhisperVoiceEngine.java
          grep -q "openAndStartRecorder" app/src/main/java/com/sanad/full/WhisperVoiceEngine.java
          grep -q "isSameDeviceSession" app/src/main/java/com/sanad/full/OfflineVoiceEngine.java
          ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml

      - name: Build installable test APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify test APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" SANAD-V3.4-VOICE-TEST.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging SANAD-V3.4-VOICE-TEST.apk | tee test-badging.txt
          "$AAPT" dump permissions SANAD-V3.4-VOICE-TEST.apk | tee test-permissions.txt
          grep -q "package: name='com.sanad.full.voicetest'" test-badging.txt
          grep -q "application-label:'SANAD Voice Test'" test-badging.txt
          grep -q "android.permission.RECORD_AUDIO" test-permissions.txt
          ! grep -q "android.permission.INTERNET" test-permissions.txt
          unzip -l SANAD-V3.4-VOICE-TEST.apk | grep -q "assets/models/ggml-base-q5_1.bin"
          unzip -l SANAD-V3.4-VOICE-TEST.apk | grep -q "lib/arm64-v8a/libsanad_whisper.so"
          sha256sum SANAD-V3.4-VOICE-TEST.apk > voice-test-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SANAD-V3.4-VOICE-TEST
          path: |
            SANAD-V3.4-VOICE-TEST.apk
            test-badging.txt
            test-permissions.txt
            voice-test-sha256.txt
          retention-days: 7
          if-no-files-found: error
