name: Build SANAD V3.5 Whisper-Only Voice Test + Full Backup

on:
  push:
    branches: [source-v35]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-v35

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android native tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;35.0.0"

      - name: Add pinned whisper.cpp and multilingual model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch v1.7.6 https://github.com/ggerganov/whisper.cpp.git app/src/main/cpp/whisper.cpp
          rm -rf app/src/main/cpp/whisper.cpp/.git
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 5             -o app/src/main/assets/models/ggml-base-q5_1.bin             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true"
          test "$(stat -c%s app/src/main/assets/models/ggml-base-q5_1.bin)" -gt 50000000
          test -f app/src/main/cpp/whisper.cpp/include/whisper.h

      - name: Run V3.5 voice regression
        shell: bash
        run: |
          set -euo pipefail
          node qa/test-v35-whisper-only.js
          node --check app/src/main/assets/v35_voice.js
          grep -q "versionCode 35" app/build.gradle
          grep -q "versionName '3.5-whisper-only'" app/build.gradle
          grep -q "engine=whisper_only" app/src/main/java/com/sanad/full/OfflineVoiceEngine.java
          ! grep -q "SpeechRecognizer" app/src/main/java/com/sanad/full/OfflineVoiceEngine.java
          grep -q "MediaRecorder.AudioSource.MIC" app/src/main/java/com/sanad/full/WhisperVoiceEngine.java
          grep -q "MediaRecorder.AudioSource.VOICE_RECOGNITION" app/src/main/java/com/sanad/full/WhisperVoiceEngine.java
          grep -q "isClientSilenced" app/src/main/java/com/sanad/full/WhisperVoiceEngine.java
          grep -q "modelLoading" app/src/main/java/com/sanad/full/WhisperVoiceEngine.java
          grep -q "injectAssetJs(\"v35_voice.js\")" app/src/main/java/com/sanad/full/MainActivity.java
          ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml

      - name: Package complete V3.5 project backup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git .gradle app/build
          zip -qr SANAD-V3.5-FULL-PROJECT-BACKUP.zip .             -x 'SANAD-V3.5-FULL-PROJECT-BACKUP.zip'
          sha256sum SANAD-V3.5-FULL-PROJECT-BACKUP.zip > full-project-sha256.txt

      - name: Restore clean source for APK build
        uses: actions/checkout@v4
        with:
          ref: source-v35
          clean: true

      - name: Re-add whisper.cpp and model for APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch v1.7.6 https://github.com/ggerganov/whisper.cpp.git app/src/main/cpp/whisper.cpp
          rm -rf app/src/main/cpp/whisper.cpp/.git
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 5             -o app/src/main/assets/models/ggml-base-q5_1.bin             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true"

      - name: Convert debug build to isolated Voice Test app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="    androidResources { noCompress 'bin' }"
          block="""    buildTypes {
              debug {
                  applicationIdSuffix '.voicetest35'
                  versionNameSuffix '-voicetest'
              }
          }
          """
          if block not in s:
              s=s.replace(marker,block+marker)
          p.write_text(s)

          m=Path("app/src/main/AndroidManifest.xml")
          x=m.read_text()
          x=x.replace('android:label="SANAD"','android:label="SANAD Voice Test 3.5"')
          m.write_text(x)
          PY

      - name: Build isolated installable Voice Test APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify Voice Test APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" SANAD-V3.5-WHISPER-VOICE-TEST.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging SANAD-V3.5-WHISPER-VOICE-TEST.apk | tee voice-test-badging.txt
          "$AAPT" dump permissions SANAD-V3.5-WHISPER-VOICE-TEST.apk | tee voice-test-permissions.txt
          grep -q "package: name='com.sanad.full.voicetest35'" voice-test-badging.txt
          grep -q "application-label:'SANAD Voice Test 3.5'" voice-test-badging.txt
          grep -q "android.permission.RECORD_AUDIO" voice-test-permissions.txt
          ! grep -q "android.permission.INTERNET" voice-test-permissions.txt
          unzip -l SANAD-V3.5-WHISPER-VOICE-TEST.apk | tee voice-test-files.txt
          grep -q "assets/models/ggml-base-q5_1.bin" voice-test-files.txt
          grep -q "assets/v35_voice.js" voice-test-files.txt
          grep -q "lib/arm64-v8a/libsanad_whisper.so" voice-test-files.txt
          sha256sum SANAD-V3.5-WHISPER-VOICE-TEST.apk > voice-test-sha256.txt

      - name: Upload V3.5 Voice Test APK
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V3.5-WHISPER-VOICE-TEST
          path: |
            SANAD-V3.5-WHISPER-VOICE-TEST.apk
            voice-test-badging.txt
            voice-test-permissions.txt
            voice-test-sha256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload complete V3.5 project backup
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V3.5-FULL-PROJECT-BACKUP
          path: |
            SANAD-V3.5-FULL-PROJECT-BACKUP.zip
            full-project-sha256.txt
          retention-days: 7
          if-no-files-found: error
