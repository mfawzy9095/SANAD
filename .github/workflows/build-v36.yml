name: Build SANAD V3.6 Critical Stabilization

on:
  push:
    branches: [source-v36, voice-hybrid-groq-trial]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android native tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;35.0.0"

      - name: Pin whisper.cpp and multilingual model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch v1.7.6 https://github.com/ggerganov/whisper.cpp.git app/src/main/cpp/whisper.cpp
          rm -rf app/src/main/cpp/whisper.cpp/.git
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 5 \
            -o app/src/main/assets/models/ggml-base-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true"
          test "$(stat -c%s app/src/main/assets/models/ggml-base-q5_1.bin)" -gt 50000000
          test -f app/src/main/cpp/whisper.cpp/include/whisper.h

      - name: Run V3.6 critical regression
        shell: bash
        run: |
          set -euo pipefail
          node qa/test-v36-critical.js
          node --check app/src/main/assets/v36_voice.js
          node qa/v27_parser_test.js
          mkdir -p /tmp/sanad-banktest
          javac -d /tmp/sanad-banktest app/src/main/java/com/sanad/full/BankSmsParser.java qa/TestBankSmsParser.java
          java -cp /tmp/sanad-banktest TestBankSmsParser
          javac -d /tmp/sanad-banktest app/src/main/java/com/sanad/full/VoiceWav.java qa/TestVoiceWav.java
          java -cp /tmp/sanad-banktest TestVoiceWav
          grep -q "versionCode 36" app/build.gradle
          grep -q "versionName '3.6-critical-stabilization'" app/build.gradle
          grep -q 'injectAssetJs("v36_voice.js")' app/src/main/java/com/sanad/full/MainActivity.java
          ! grep -R -qE 'SpeechRecognition|webkitSpeechRecognition|sampleVoice' app/src/main/assets/index.html app/src/main/assets/v36_voice.js
          grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml
          grep -q "android.permission.ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml

      - name: Convert Debug APK to isolated V3.6 device test app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="    androidResources { noCompress 'bin' }"
          block="""    buildTypes {
              debug {
                  applicationIdSuffix '.voicetest36'
                  versionNameSuffix '-device-test'
              }
          }
          """
          if block not in s:
              s=s.replace(marker,block+marker)
          p.write_text(s)

          m=Path("app/src/main/AndroidManifest.xml")
          x=m.read_text().replace('android:label="SANAD"','android:label="SANAD V3.6 Device Test"')
          m.write_text(x)
          PY

      - name: Build isolated device-test APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify actual native ggml compile flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,shlex,sys,pathlib
          dbs=glob.glob('app/.cxx/**/compile_commands.json',recursive=True)
          if not dbs:
              raise SystemExit('compile_commands.json not found')
          rows=[]
          for db in dbs:
              try:data=json.load(open(db))
              except Exception:continue
              for e in data:
                  f=str(e.get('file','')).replace('\\','/')
                  if '/whisper.cpp/ggml/' not in f or not f.endswith('.c'):
                      continue
                  cmd=e.get('command')
                  if cmd:
                      args=shlex.split(cmd)
                  else:
                      args=list(e.get('arguments') or [])
                  rows.append((f,args,db))
          if not rows:
              raise SystemExit('No ggml C compile commands found')
          bad_o0=[f for f,args,_ in rows if '-O0' in args]
          missing_o3=[f for f,args,_ in rows if '-O3' not in args]
          if bad_o0:
              print('ERROR -O0 found in:',*bad_o0[:20],sep='\n');sys.exit(1)
          if missing_o3:
              print('ERROR -O3 missing in:',*missing_o3[:20],sep='\n');sys.exit(1)
          caches=glob.glob('app/.cxx/**/CMakeCache.txt',recursive=True)
          if not any('CMAKE_BUILD_TYPE:STRING=Release' in pathlib.Path(x).read_text(errors='ignore') for x in caches):
              raise SystemExit('Native CMake build is not Release')
          print(f'PASS verified {len(rows)} ggml C compile commands: Release, -O3, no -O0')
          PY

      - name: Verify device-test APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" SANAD-V3.6-CRITICAL-DEVICE-TEST.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging SANAD-V3.6-CRITICAL-DEVICE-TEST.apk | tee device-test-badging.txt
          "$AAPT" dump permissions SANAD-V3.6-CRITICAL-DEVICE-TEST.apk | tee device-test-permissions.txt
          grep -q "package: name='com.sanad.full.voicetest36'" device-test-badging.txt
          grep -q "versionName='3.6-critical-stabilization-device-test'" device-test-badging.txt
          grep -q "application-label:'SANAD V3.6 Device Test'" device-test-badging.txt
          grep -q "android.permission.RECORD_AUDIO" device-test-permissions.txt
          grep -q "android.permission.INTERNET" device-test-permissions.txt
          unzip -l SANAD-V3.6-CRITICAL-DEVICE-TEST.apk | tee device-test-files.txt
          grep -q "assets/models/ggml-base-q5_1.bin" device-test-files.txt
          grep -q "assets/v36_voice.js" device-test-files.txt
          grep -q "lib/arm64-v8a/libsanad_whisper.so" device-test-files.txt
          sha256sum SANAD-V3.6-CRITICAL-DEVICE-TEST.apk > device-test-sha256.txt

      - name: Restore source after isolated device-test mutation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/build.gradle app/src/main/AndroidManifest.xml

      - name: Package complete V3.6 source backup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gradle app/build app/.cxx
          zip -qr SANAD-V3.6-FULL-PROJECT-BACKUP.zip . \
            -x '.git/*' \
               'SANAD-V3.6-FULL-PROJECT-BACKUP.zip' \
               'SANAD-V3.6-CRITICAL-DEVICE-TEST.apk' \
               'device-test-*'
          sha256sum SANAD-V3.6-FULL-PROJECT-BACKUP.zip > SANAD-V3.6-FULL-PROJECT-BACKUP.sha256

      - name: Upload V3.6 device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V3.6-CRITICAL-DEVICE-TEST
          path: |
            SANAD-V3.6-CRITICAL-DEVICE-TEST.apk
            device-test-badging.txt
            device-test-permissions.txt
            device-test-sha256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload complete V3.6 project backup
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V3.6-FULL-PROJECT-BACKUP
          path: |
            SANAD-V3.6-FULL-PROJECT-BACKUP.zip
            SANAD-V3.6-FULL-PROJECT-BACKUP.sha256
          retention-days: 14
          if-no-files-found: error
