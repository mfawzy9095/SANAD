name: SANAD Android Device Test Build

on:
  push:
    branches:
      - android-v9-device-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify embedded web source
        run: echo "c7291d64c960ea2dde35d0c5428f1235719028c83665522b2de2cedbc1b88141  app/src/main/assets/index.html" | sha256sum -c -

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "SANAD-V9.0.2-DEVICE-TEST-2.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "package: name='com.sanad.v9test'" apk-badging.txt
          grep -q "versionCode='90202'" apk-badging.txt
          grep -q "versionName='9.0.2-device-test-2'" apk-badging.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          ! grep -q "android.permission.READ_SMS" apk-permissions.txt
          ! grep -q "android.permission.RECORD_AUDIO" apk-permissions.txt
          ! grep -q "android.permission.CAMERA" apk-permissions.txt
          ! grep -q "android.permission.READ_EXTERNAL_STORAGE" apk-permissions.txt
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" apk-permissions.txt
          EMBEDDED_SHA="$(unzip -p "$APK" assets/index.html | sha256sum | awk '{print $1}')"
          test "$EMBEDDED_SHA" = "c7291d64c960ea2dde35d0c5428f1235719028c83665522b2de2cedbc1b88141"
          sha256sum "SANAD-V9.0.2-DEVICE-TEST-2.apk" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V9.0.2-DEVICE-TEST-2
          path: |
            SANAD-V9.0.2-DEVICE-TEST-2.apk
            apk-sha256.txt
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
          retention-days: 30
