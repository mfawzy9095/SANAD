name: Build SANAD V9.0.2 Device Test 2 APK

on:
  push:
    branches: [android-v9-device-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated V9 test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify source gate before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, xml.etree.ElementTree as ET
          root=pathlib.Path('.')
          info=json.loads((root/'DEVICE_GATE_INTEGRITY.json').read_text())
          web=root/'app/src/main/assets/index.html'
          sha=hashlib.sha256(web.read_bytes()).hexdigest()
          assert sha==info['web_sha256'], (sha,info['web_sha256'])
          manifest=root/'app/src/main/AndroidManifest.xml'
          ET.parse(manifest)
          text=manifest.read_text()
          perms=re.findall(r'<uses-permission android:name="([^"]+)"',text)
          assert perms==['android.permission.INTERNET'], perms
          banned=['READ_SMS','RECORD_AUDIO','CAMERA','READ_EXTERNAL_STORAGE','WRITE_EXTERNAL_STORAGE','MANAGE_EXTERNAL_STORAGE']
          for p in banned: assert p not in text, p
          print('source gate OK:', sha)
          PY

      - name: Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK identity, permissions and embedded web build
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" SANAD-V9.0.2-DEVICE-TEST-2.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "package: name='com.sanad.v9test' versionCode='90202' versionName='9.0.2-device-test-2'" apk-badging.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          ! grep -q "android.permission.READ_SMS" apk-permissions.txt
          ! grep -q "android.permission.RECORD_AUDIO" apk-permissions.txt
          ! grep -q "android.permission.CAMERA" apk-permissions.txt
          ! grep -q "android.permission.READ_EXTERNAL_STORAGE" apk-permissions.txt
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" apk-permissions.txt
          python3 - <<'PY'
          import hashlib,json,zipfile
