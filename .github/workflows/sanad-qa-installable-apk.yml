# Local first CI QA APK; never uses the private stable signing certificate.
name: SANAD Installable QA Candidate
on:
  push:
    branches:
      - feature-v9.2-ui-features
    paths:
      - '.github/workflows/sanad-qa-installable-apk.yml'
      - '.github/workflows/build-v9-device-test.yml'
      - 'app/**'
      - 'tools/e2e/**'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanad-qa-candidate
  cancel-in-progress: true
jobs:
  gate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in app/src/test/js/*.test.js; do node "$test"; done
      - name: Set up browser integration
        run: |
          npm ci --prefix tools/e2e
          cd tools/e2e
          npx playwright install --with-deps chromium
      - name: Exercise complete browser flows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory app/src/main/assets >/tmp/sanad-qa-http.log 2>&1 &
          SANAD_QA_OUTPUT="$RUNNER_TEMP/sanad-browser-qa" node tools/e2e/browser-smoke.js
      - name: Build and lint isolated QA variant
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleForensicQaCi
      - name: Verify output and hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-apk
          cp app/build/outputs/apk/forensicQaCi/*.apk qa-apk/SANAD-FINANCIAL-QA-DEVICE-UNVERIFIED.apk
          sha256sum qa-apk/*.apk > qa-apk/SHA256SUMS.txt
          cat > qa-apk/READ-ME-FIRST.txt <<'EOF'
          SANAD CI FINANCIAL QA ONLY — NOT A PRODUCTION RELEASE.
          Debug-signed, separate package ID; cannot overwrite stable app.
          Do not import irreplaceable real financial data.
          Android device, biometrics, notifications, and signing continuity
          have NOT been tested by this pipeline.
          No private signing key or real SMS is used or uploaded here.
          EOF
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-QA-BROWSER-DIAGNOSTICS
          path: |
            /tmp/sanad-qa-http.log
            ${{ runner.temp }}/sanad-browser-qa
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload QA APK only on success
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V9.2.14-ISOLATED-QA-APK
          path: qa-apk/
          if-no-files-found: error
          retention-days: 14

  native-device-gate:
    needs: gate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact gated QA APK
        uses: actions/download-artifact@v4
        with:
          name: SANAD-V9.2.14-ISOLATED-QA-APK
          path: device-apk
      - name: Enable KVM emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android 35 SMS, WebView and storage integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install device-apk/SANAD-FINANCIAL-QA-DEVICE-UNVERIFIED.apk
            SANAD_QA_PACKAGE=com.sanad.v9test.forensicqa.ci SANAD_QA_OUTPUT="$RUNNER_TEMP/sanad-android-qa" node tools/e2e/android-smoke.js
      - name: Retain native test evidence, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-QA-ANDROID-35-EVIDENCE
          path: ${{ runner.temp }}/sanad-android-qa
          if-no-files-found: ignore
          retention-days: 14
