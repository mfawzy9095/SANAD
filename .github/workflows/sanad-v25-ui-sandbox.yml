# V25.2 UI integration foundation; separate disposable Android app, no financial data migration.
name: SANAD V25.2 UI Integration Sandbox
on:
  push:
    branches:
      - ui/v25.2-android-integration
      - ui/v25-prototype-rebuild
    paths:
      - '.github/workflows/sanad-v25-ui-sandbox.yml'
      - '.github/workflows/build-v9-device-test.yml'
      - 'app/**'
      - 'tools/e2e/**'
      - 'ui-integration/v25.2/**'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanad-v25-ui-sandbox-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  gate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check sandbox workflow references before expensive jobs
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'SANAD-V9[.]2[.]14-ISOLATED-QA-APK|SANAD-FINANCIAL-QA-DEVICE-UNVERIFIED[.]apk' .github/workflows/sanad-v25-ui-sandbox.yml
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in app/src/test/js/*.test.js; do node "$test"; done
      - name: Set up browser integration
        run: |
          npm ci --prefix tools/e2e
          cd tools/e2e
          npx playwright install --with-deps chromium
      - name: Exercise complete browser flows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory app/src/main/assets >/tmp/sanad-qa-http.log 2>&1 &
          SANAD_QA_OUTPUT="$RUNNER_TEMP/sanad-browser-qa" node tools/e2e/browser-smoke.js
      - name: Build and lint isolated QA variant
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleV25UiPreview
      - name: Verify output and hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-apk
          cp app/build/outputs/apk/v25UiPreview/*.apk qa-apk/SANAD-V25-2-UI-BASELINE-UNPORTED.apk
          SDK_AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$SDK_AAPT" dump badging qa-apk/SANAD-V25-2-UI-BASELINE-UNPORTED.apk | tee qa-apk/APK-BADGING.txt
          grep -q "package: name='com.sanad.v9test.v25uipreview'" qa-apk/APK-BADGING.txt
          grep -q "versionCode='92014'" qa-apk/APK-BADGING.txt
          sha256sum qa-apk/*.apk > qa-apk/SHA256SUMS.txt
          cat > qa-apk/READ-ME-FIRST.txt <<'EOF'
          SANAD V25.2 UI SANDBOX — FUNCTIONAL BASELINE ONLY, V25.2 SCREENS NOT YET PORTED.
          Debug-signed com.sanad.v9test.v25uipreview; separate private app data. Cannot overwrite stable SANAD.
          Do NOT import irreplaceable data; preview signing key may rotate between CI builds.
          Android device, biometrics, notifications, and signing continuity
          have NOT been tested by this pipeline.
          No private signing key or real SMS is used or uploaded here.
          EOF
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V25-2-BROWSER-DIAGNOSTICS
          path: |
            /tmp/sanad-qa-http.log
            ${{ runner.temp }}/sanad-browser-qa
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload isolated baseline APK only on success
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V25-2-UI-INTEGRATION-BASELINE-APK
          path: qa-apk/
          if-no-files-found: error
          retention-days: 14

  native-device-gate:
    needs: gate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact gated QA APK
        uses: actions/download-artifact@v4
        with:
          name: SANAD-V25-2-UI-INTEGRATION-BASELINE-APK
          path: device-apk
      - name: Enable KVM emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android 35 SMS, WebView and storage integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install device-apk/SANAD-V25-2-UI-BASELINE-UNPORTED.apk
            SANAD_QA_PACKAGE=com.sanad.v9test.v25uipreview SANAD_QA_OUTPUT="$RUNNER_TEMP/sanad-android-qa" node tools/e2e/android-smoke.js
      - name: Retain native test evidence, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-V25-2-ANDROID-35-EVIDENCE
          path: ${{ runner.temp }}/sanad-android-qa
          if-no-files-found: ignore
          retention-days: 14
