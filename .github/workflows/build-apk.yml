name: Build SANAD 1.1 Test APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble recovered SANAD master
        run: |
          cat full-master-parts/part_* > base.tar.xz
          xz -t base.tar.xz
          rm -rf work
          mkdir work
          tar -xJf base.tar.xz -C work
          test -f work/SANAD_ANDROID_FULL_MASTER/MASTER_SOURCE.html

      - name: Apply SANAD 1.1 approved upgrade
        run: |
          cat             patches/v11_patch_00             patches/v11_patch_01             patches/v11_patch_02_0             patches/v11_patch_02_1             patches/v11_patch_02_2             patches/v11_patch_02_3             patches/v11_patch_02_4             patches/v11_patch_02_5             patches/v11_patch_03 > /tmp/v11.patch.b64
          test "$(wc -c < /tmp/v11.patch.b64)" -eq 55044
          base64 -d /tmp/v11.patch.b64 | gzip -d > /tmp/v11.patch
          cd work/SANAD_ANDROID_FULL_MASTER
          patch -p1 --batch < /tmp/v11.patch
          grep -q "1.1.0-test" app/build.gradle
          grep -q "SQLite مشفرة" MASTER_SOURCE.html
          test -f app/src/main/java/com/sanad/full/SanadDatabase.java
          test -f app/src/main/java/com/sanad/full/CryptoStore.java
          test -f app/src/main/java/com/sanad/full/SplashActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Privacy checks
        working-directory: work/SANAD_ANDROID_FULL_MASTER
        run: |
          ! grep -R "android.permission.INTERNET" -n app/src/main/AndroidManifest.xml
          grep -q "android.permission.READ_SMS" app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: work/SANAD_ANDROID_FULL_MASTER
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: work/SANAD_ANDROID_FULL_MASTER
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.sanad.full'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q "android.permission.INTERNET"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-1.1-TEST-APK
          path: work/SANAD_ANDROID_FULL_MASTER/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-1.1-FULL-PROJECT
          path: work/SANAD_ANDROID_FULL_MASTER
