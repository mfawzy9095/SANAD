name: Build SANAD Full Master APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble full SANAD project snapshot
        run: |
          cat full-master-parts/part_* > SANAD_ANDROID_FULL_BUILD.tar.xz
          xz -t SANAD_ANDROID_FULL_BUILD.tar.xz
          rm -rf full-master
          mkdir full-master
          tar -xJf SANAD_ANDROID_FULL_BUILD.tar.xz -C full-master
          test -f full-master/SANAD_ANDROID_FULL_MASTER/app/src/main/AndroidManifest.xml
          test -f full-master/SANAD_ANDROID_FULL_MASTER/app/src/main/assets/parts.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify privacy contract
        working-directory: full-master/SANAD_ANDROID_FULL_MASTER
        run: |
          ! grep -R "android.permission.INTERNET" -n app/src/main/AndroidManifest.xml
          grep -q "com.sanad.full" app/build.gradle

      - name: Build installable APK
        working-directory: full-master/SANAD_ANDROID_FULL_MASTER
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: full-master/SANAD_ANDROID_FULL_MASTER
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SANAD APK
        uses: actions/upload-artifact@v4
        with:
          name: SANAD-FULL-MASTER-APK
          path: full-master/SANAD_ANDROID_FULL_MASTER/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
