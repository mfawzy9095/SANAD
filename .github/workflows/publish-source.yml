name: Publish SANAD Source Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V2.6 source
        shell: bash
        run: |
          set -euo pipefail
          cat release-v22-parts/part_00 release-v22-parts/part_01 release-v22-parts/part_01_full release-v22-parts/part_02 release-v22-parts/part_03 release-v22-parts/part_04 release-v22-parts/part_05 release-v22-parts/part_06 release-v22-parts/part_07 release-v22-parts/part_08 release-v22-parts/part_09_full release-v22-parts/part_10 release-v22-parts/part_11 > /tmp/sanad_v22.b64
          base64 -d /tmp/sanad_v22.b64 > /tmp/v22.tar.xz
          mkdir -p work
          tar -xJf /tmp/v22.tar.xz -C work

          cat patches/v23_patch_00 patches/v23_patch_01 patches/v23_patch_02 > /tmp/v23.b64
          base64 -d /tmp/v23.b64 | gzip -d > /tmp/v23.patch
          cd work/SANAD_FINAL_LOCAL_REVIEW_V22
          patch -p1 < /tmp/v23.patch
          cd ../..

          cat patches/v24_patch_00 patches/v24_patch_01 patches/v24_patch_02 patches/v24_patch_03 patches/v24_patch_04 > /tmp/v24.b64
          base64 -d /tmp/v24.b64 | gzip -d > /tmp/v24.patch
          cd work/SANAD_FINAL_LOCAL_REVIEW_V22
          patch -p1 < /tmp/v24.patch
          cd ../..
          mv work/SANAD_FINAL_LOCAL_REVIEW_V22 work/V24

          cp -a work/V24 work/V25
          base64 -d patches/v25_patch.b64 | gzip -d > /tmp/v25.patch
          sed 's#SANAD_FINAL_LOCAL_REVIEW_V24/#V25/#g' /tmp/v25.patch > /tmp/v25_apply.patch
          cd work
          patch -p0 < /tmp/v25_apply.patch
          cd ..
          mkdir -p work/V25/app/src/main/res/drawable-nodpi
          cp assets/v25_sanad_icon_full.png work/V25/app/src/main/res/drawable-nodpi/sanad_launcher_full.png
          cp assets/v25_sanad_icon_foreground.png work/V25/app/src/main/res/drawable-nodpi/sanad_launcher_foreground.png

          cp -a work/V25 work/V26
          cat patches/v26_patch_00 patches/v26_patch_01 patches/v26_patch_02 patches/v26_patch_03 patches/v26_patch_04 > /tmp/v26.b64
          base64 -d /tmp/v26.b64 | gzip -d > /tmp/v26.patch
          cd work/V26
          patch -p1 < /tmp/v26.patch
          cd ../..
          sed -i 's/android:exported="true">/android:exported="false">/' work/V26/app/src/main/AndroidManifest.xml

      - name: Publish clean source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source
          cp -a work/V26 /tmp/source
          rm -rf /tmp/source/app/src/main/assets/models
          rm -rf /tmp/source/app/src/main/cpp/whisper.cpp
          rm -f /tmp/source/keystore.properties
          rm -rf /tmp/source/signing
          printf '%s\n' 'keystore.properties' 'signing/' '*.jks' '*.keystore' >> /tmp/source/.gitignore
          git config user.name "SANAD Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan source-v27
          git rm -rf . || true
          cp -a /tmp/source/. .
          git add .
          git commit -m "Publish clean SANAD source for V2.7 work"
          git push --force origin source-v27
