async function saveAccount(id){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const name = (document.getElementById('wName').value || '').trim();
  const typeEl = document.getElementById('wType');
  let type = typeEl.value;
  const curEl = document.getElementById('wCur');
  const cur = curEl.disabled ? (Finance.getAccount(id) || {}).currency : curEl.value;
  const country = document.getElementById('wCountry').value || S.activeCountry;
  const i = document.getElementById('wIco').value || '🏦';
  const c = document.getElementById('wCol').value || '#00695C';
  const bankRefs = parseBankRefsInput((document.getElementById('wBankRefs') || {}).value || '');
  const requestedBank=UaeBankRegistryCore.get((document.getElementById('wBankRegistry')||{}).value||'');
  if(requestedBank&&(['UAE','EGY'].includes(country))&&(requestedBank.country||'UAE')!==country){toast('بلد إصدار البنك لا يطابق بلد الحساب');return;}
  if (!name){ toast('أدخل اسم الحساب'); return; }
  if (type === 'credit'){ toast('بطاقات الائتمان تُنشأ من قسم البطاقات'); return; }
  if (id && hasLinkedDebitCards(id)){
    type = 'bank';
  }
  const typeDef = accountTypeInfo(type);
  const isLiab = !typeDef.asset;
  const isDebt = type === 'debt';
  let openingBalance = 0, openingDebt = 0, creditor = '', dueDate = null;
  let cashFundingMode='existing', cashFundingSourceId=null;
  const openingKnown=!!document.getElementById('wOpeningKnown')?.checked;
  const balEl = document.getElementById('wBalance');
  if (balEl && !balEl.disabled) openingBalance = parseFloat(balEl.value) || 0;
  if(!id && type==='cash'){
    const fm=document.getElementById('cashFundingMode'), fs=document.getElementById('cashFundingSource');
    cashFundingMode=fm?fm.value:'existing'; cashFundingSourceId=fs?(fs.value||null):null;
    if(cashFundingMode==='transfer'){
      const src=Finance.getAccount(cashFundingSourceId);
      if(!src||src.archived||isLiabilityAccount(src)){toast('اختر حساب تمويل صالح');return;}
      if(src.currency!==cur){toast('تمويل الكاش الأول يجب أن يكون من حساب بنفس العملة');return;}
      if(openingBalance<=0){toast('أدخل مبلغ الكاش');return;}
      if(Finance.accountBalance(src.id)===null||Finance.accountBalance(src.id)+0.001<openingBalance){toast('رصيد حساب التمويل غير كافٍ');return;}
    }
  }
  const debtEl = document.getElementById('wDebt');
  if (debtEl && !debtEl.disabled) openingDebt = parseFloat(debtEl.value) || 0;
  /* V8.8.4.11: negative opening balance is only forbidden for prepaid (stored-value).
     Bank/cash/ewallet/other keep their existing overdraft-free policy.
     Debt opening value must still be non-negative. */
  if (type === 'prepaid' && openingBalance < -0.01){
    toast('الرصيد الافتتاحي للمدفوع مقدمًا لا يمكن أن يكون سالبًا');
    return;
  }
  if (isDebt && openingDebt < -0.01){
    toast('قيمة الدين لا يمكن أن تكون سالبة');
    return;
  }
  const credEl = document.getElementById('wCreditor');
  if (credEl) creditor = (credEl.value || '').trim();
  const dueEl = document.getElementById('wDueDate');
  if (dueEl) dueDate = dueEl.value || null;
  const shouldBeDefault = !!S.form._accountDefaultToggle;
  const shouldBePrimary = !!S.form._accountPrimaryToggle;
  if (id){
    const a = Finance.getAccount(id);
    if (!a) return;
    const hasTx = hasAccountHistory(id);
    const hasDebit = hasLinkedDebitCards(id);
    if (hasTx && cur !== a.currency){ toast('لا يمكن تغيير العملة — بالحساب معاملات'); return; }
    if (hasTx && country !== a.country){ toast('لا يمكن تغيير البلد — بالحساب معاملات'); return; }
    if (hasTx && isLiabilityAccount(a) !== isLiab){ toast('لا يمكن تغيير نوع الحساب'); return; }
    if (hasDebit && type !== 'bank'){ toast('لا يمكن تغيير النوع — بالحساب بطاقة ديبت مرتبطة'); return; }
  }
  let savedId = id;
  const accountNeedsRecalc = !!(id && hasAccountHistory(id));
  if(accountNeedsRecalc){
    showFinancialRecalcOverlay('جاري تحديث الحساب وإعادة الحساب');
    await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,20)));
  }
  const result = await commitCriticalMutation(async () => {
    let institutionId = null;
    const instEl = document.getElementById('wInst');
    institutionId = instEl ? (instEl.value || null) : null;
    const officialEl = document.getElementById('wBankRegistry');
    const officialBankId = officialEl && ['UAE','EGY'].includes(country) && type !== 'ewallet' ? (officialEl.value || null) : null;
    const providerEl = document.getElementById('wProviderRegistry');
    const officialProviderId = providerEl && country === 'UAE' && type === 'ewallet' ? (providerEl.value || null) : null;
    const newInstName = ((document.getElementById('wInstName') || {}).value || '').trim();
    if (officialProviderId) institutionId = Finance.ensureRegisteredProvider(officialProviderId, country);
    else if (officialBankId) institutionId = Finance.ensureRegisteredBank(officialBankId, country);
    else if (newInstName) institutionId = Finance.ensureInstitution(newInstName, country, type === 'ewallet' ? 'wallet_provider' : 'bank');
    if (institutionId){
      const inst = Finance.getInstitution(institutionId);
      if (inst && inst.country !== country){ institutionId = null; }
    }
    if (id){
      const a = Finance.getAccount(id);
      const hasTx = hasAccountHistory(id);
      a.name = name; a.type = type;
      a.currency = hasTx ? a.currency : cur;
      a.country = country;
      const relinkInstitution=BankIngestionCore.rebindAccountInstitution(S,id,institutionId);
      if(!relinkInstitution.ok)return false;
      a.bankRefs = bankRefs.slice();
      if (bankRefs.length === 1) a.bankRef = bankRefs[0]; else delete a.bankRef;
      a.icon = i; a.color = c;
      if(openingKnown){if(!FinanceCore.setOpeningBalance(a,openingBalance))return false;}else a.openingBalanceKnown=false;
      if (isLiab){a.openingDebt=openingDebt;a.openingDebtKnown=openingKnown;}
      if (isDebt){ a.creditor = creditor; a.dueDate = dueDate; }
    } else {
      savedId = uid('a');
      S.accounts.push({
        id: savedId, institutionId, country, name, type, currency: cur,
        openingBalance: (type==='cash'&&cashFundingMode==='transfer') ? 0 : openingBalance, openingBalanceKnown:openingKnown||(type==='cash'&&cashFundingMode==='transfer'), openingDebt, openingDebtKnown:openingKnown, creditLimit: 0,
        defaultRepaymentAccountId: null,
        bankRefs: bankRefs.slice(),
        icon: i, color: c, archived: false,
        creditor: isDebt ? creditor : '',
        dueDate: isDebt ? dueDate : null,
        created: isoToday()
      });
      if(type==='cash'&&cashFundingMode==='transfer'&&cashFundingSourceId&&openingBalance>0){
        const src=Finance.getAccount(cashFundingSourceId);
        S.transactions.push({id:uid('t'),type:'transfer',fromAccountId:src.id,fromAmount:openingBalance,fromCurrency:src.currency,fromCountry:src.country,toAccountId:savedId,toAmount:openingBalance,toCurrency:cur,toCountry:country,fxRate:1,fee:0,note:'',tags:[],date:isoToday(),created:Date.now()});
      }
    }
    /* V8.8.4.3 FIX 12: Default and Primary managed independently */
    if (typeDef.asset && !isLiab){
      if (shouldBeDefault){
        S.settings.defaultAccountByCountry[country] = savedId;
      } else if (S.settings.defaultAccountByCountry[country] === savedId){
        delete S.settings.defaultAccountByCountry[country];
      }
      if (shouldBePrimary){
        S.settings.primaryAccountByCountry[country] = savedId;
      } else if (S.settings.primaryAccountByCountry[country] === savedId){
        delete S.settings.primaryAccountByCountry[country];
      }
    }
    Finance.ensureAllPrimaries();
    return true;
  });
  hideFinancialRecalcOverlay();
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast(accountNeedsRecalc ? 'تم التعديل وإعادة الحساب' : (id ? 'تم التعديل' : 'تمت الإضافة'));
}
async function archiveAccount(id){
  if (!canWrite()){ return; }
  const a = Finance.getAccount(id);
  if (!a) return;

  /* V8.8.4.9 FIX 2a: prepaid-owned accounts must be archived via their instrument */
  if (a.ownedByInstrumentId){
    const ownerInst = Finance.getInstrument(a.ownedByInstrumentId);
    await dialog({
      emoji:'ℹ️',
      title:'هذا الحساب مرتبط ببطاقة مدفوعة مقدمًا',
      msg: ownerInst
        ? 'لا يمكن أرشفته مباشرة. أرشِف البطاقة "' + ownerInst.name + '" من قسم البطاقات.'
        : 'لا يمكن أرشفته مباشرة. أرشِف البطاقة المرتبطة به.',
      okText:'حسناً', primary:true, hideCancel:true
    });
    return;
  }

  /* V8.8.4.10 FIX 4: guard against malformed/legacy liability states too. */
  const rawBal = Finance.accountBalance(a.id);
  if(rawBal===null){toast('الرصيد غير مؤكد؛ راجعه قبل الحذف أو الأرشفة');return;}
  if (isLiabilityAccount(a)){
    if (rawBal < -0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة الحساب',
        msg:'عليه مديونية ' + amtFull(-rawBal, a.currency) + '. سدّدها أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
    if (rawBal > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة الحساب',
        msg:'عليه رصيد موجب ' + amtFull(rawBal, a.currency) + '. سوِّ الحساب أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  } else {
    if (Math.abs(rawBal) > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة الحساب',
        msg:'باقي فيه ' + amtFull(Math.abs(rawBal), a.currency) + '. الأرشفة ستخفي هذا المبلغ من الحسابات النشطة.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }

  const ok = await dialog({emoji:'📦', title:'أرشفة الحساب', msg:'سيختفي من الإدخال الجديد، لكن معاملاته تبقى.', okText:'أرشفة', primary:true});
  if (!ok) return;
  const result = await commitCriticalMutation(async () => {
    a.archived = true;
    if (S.settings.defaultAccountByCountry[a.country] === id){
      delete S.settings.defaultAccountByCountry[a.country];
      const fallback = S.accounts.find(x => x.country === a.country && !x.archived && isAssetAccount(x) && !x.ownedByInstrumentId && x.id !== id);
      if (fallback) S.settings.defaultAccountByCountry[a.country] = fallback.id;
    }
    if (S.settings.primaryAccountByCountry[a.country] === id){
      const fallback = S.accounts.find(x => x.country === a.country && !x.archived && isAssetAccount(x) && !x.ownedByInstrumentId && x.id !== id);
      if (fallback) S.settings.primaryAccountByCountry[a.country] = fallback.id;
      else delete S.settings.primaryAccountByCountry[a.country];
    }
    S.paymentInstruments.forEach(inst => {
      if (inst.accountId !== id) return;
      if (inst.type === 'credit_card' || inst.type === 'prepaid_card'){
        inst.archived = true;
      }
      if (S.settings.defaultInstrumentByCountry[a.country] === inst.id){
        delete S.settings.defaultInstrumentByCountry[a.country];
      }
    });
    /* V8.8.4.9 FIX 3: pause recurring rules tied to this account OR any of its instruments */
    const linkedInstIds = S.paymentInstruments
      .filter(i => i.accountId === id)
      .map(i => i.id);
    S.recurring.forEach(r => {
      if (r.accountId === id){ r.active = false; return; }
      if (r.instrumentId && linkedInstIds.indexOf(r.instrumentId) !== -1){ r.active = false; }
    });
    if (S.repAccountId === id) S.repAccountId = null;
    Finance.ensureAllPrimaries();
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الأرشفة');
}
async function unarchiveAccount(id){

  const a = Finance.getAccount(id);

    a.archived = false;

      if (inst.type === 'credit_card' || inst.type === 'prepaid_card'){
        inst.archived = false;

      } else {
        delete S.settings.defaultAccountByCountry[a.country];
      }
    }
    if (S.settings.primaryAccountByCountry[a.country] === id){

      if (fallback) S.settings.primaryAccountByCountry[a.country] = fallback.id;
      else delete S.settings.primaryAccountByCountry[a.country];
    }
    if (S.repAccountId === id) S.repAccountId = null;

async function savePayLiability(){

  const targetCur = target.currency;
  const sameCur = fromCur === targetCur;

    if (!sameCur) Finance.rememberRate(fromCur, targetCur, rate);

      id: newTransferId, type:'transfer',

      toAccountId: target.id, toAmount, toCurrency: targetCur, toCountry: target.country,
      fxRate: rate, fxRateSource:'user-entry', fee: 0,

      tags: ['سداد'], date: S.form.date||today, transactionTime:S.form.transactionTime||null, timeSource:'manual', created: Date.now()
    };
    if(!await confirmManualImportCandidate(payment))return false;
    S.transactions.push(payment);
    syncLinkedRepaymentFee(newTransferId, fee, fromW, today);
    /* V8.8.4.9 FIX 4: prepaid source must not go negative. */
    if (fromW && fromW.type === 'prepaid'){
      try {
        const newBal = Finance.accountBalance(fromW.id);
        if (newBal < -0.01){
          _lastMutationError = 'prepaid-insufficient';
          return false;
        }
      } catch(_){

        return false;
      }
    }
    return true;
  });

    render();
    if (_lastMutationError === 'prepaid-insufficient'){

    toast(result.reason === 'write-failed' || result.reason === 'verify-failed' ? 'فشل الحفظ — تم التراجع' : 'تعذر الحفظ');

  const newCtx = budgetContextForTransaction({type: 'transfer', fromAccountId: fromW.id, date: today});

async function categorySortStep(button){
  const row=button.closest('[data-cat-sort-item]'),list=row&&row.parentElement;
  if(!row||!list)return;

  const i=rows.indexOf(row),next=i+Number(button.dataset.catStep);

  const ids=Array.from(list.querySelectorAll('[data-cat-sort-item]')).map(el=>el.dataset.catSortItem);

let categoryDragState=null;
document.addEventListener('pointerdown',ev=>{
  const handle=ev.target.closest('[data-cat-drag],[data-bene-drag]');
  if(!handle||!canWrite()||ev.button!==0)return;
  const people=handle.hasAttribute('data-bene-drag');
  const row=handle.closest(people?'[data-bene-sort-item]':'[data-cat-sort-item]'),list=row&&row.parentElement;
  if(!row||!list)return;
  categoryDragState={pointerId:ev.pointerId,row,list,people,type:people?'beneficiaries':list.dataset.catSortList,startY:ev.clientY,moved:false};
  try{handle.setPointerCapture(ev.pointerId);}catch(_){}
  row.classList.add('dragging');ev.preventDefault();
},true);
document.addEventListener('pointermove',ev=>{
  const d=categoryDragState;
  if(!d||d.pointerId!==ev.pointerId)return;
  if(Math.abs(ev.clientY-d.startY)>6)d.moved=true;
  if(!d.moved)return;
  const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(d.people?'[data-bene-sort-item]':'[data-cat-sort-item]');
  if(!hit||hit===d.row||hit.parentElement!==d.list)return;
  const middle=hit.getBoundingClientRect().top+hit.getBoundingClientRect().height/2;
  if(ev.clientY<middle)hit.before(d.row);else hit.after(d.row);
  ev.preventDefault();
},true);

function sameCardSourceForMerge(a,b){
  if(!a||!b)return false;
  const aa=Finance.getAccount(a.accountId),ba=Finance.getAccount(b.accountId);
  const ai=(a.institutionId||(aa&&aa.institutionId))?Finance.getInstitution(a.institutionId||(aa&&aa.institutionId)):null;
  const bi=(b.institutionId||(ba&&ba.institutionId))?Finance.getInstitution(b.institutionId||(ba&&ba.institutionId)):null;
  if(!ai||!bi)return false;
  if(ai.id===bi.id)return true;
  const ab=Finance.registeredBankId(ai),bb=Finance.registeredBankId(bi);
  if(ab&&bb)return ab===bb;
  const ap=Finance.registeredProviderId(ai),bp=Finance.registeredProviderId(bi);
  if(ap&&bp)return ap===bp;
  return false;
}
function cardIdentityOverlapForMerge(a,b){
  return !!(BankIngestionCore.cardIdentityCompatible&&BankIngestionCore.cardIdentityCompatible(a,b));
}
function duplicateCardMergeCandidates(sourceId){
  const source=Finance.getInstrument(sourceId);
  if(!source||source.archived)return [];
  const sourceAcc=Finance.getAccount(source.accountId);
  if(!sourceAcc)return [];
  return S.paymentInstruments.filter(target=>{
    if(!target||target.id===source.id||target.archived||target.type!==source.type||target.country!==source.country)return false;
    const targetAcc=Finance.getAccount(target.accountId);
    if(!targetAcc||targetAcc.archived||targetAcc.currency!==sourceAcc.currency)return false;
    if(['debit_card','wallet_card'].includes(source.type)&&targetAcc.id!==sourceAcc.id)return false;
    if(!sameCardSourceForMerge(source,target))return false;
    if(!cardIdentityOverlapForMerge(source,target))return false;
    if(source.network&&target.network&&source.network!=='other'&&target.network!=='other'&&source.network!==target.network)return false;
    return true;
  });
}

async function confirmDuplicateCardMerge(sourceId){
  if(!canWrite()){toast('وضع القراءة فقط');return;}
  const targetEl=document.getElementById('cardMergeTarget');
  const targetId=targetEl?targetEl.value:'';
  if(!targetId){toast('اختر البطاقة الصحيحة التي ستبقى');return;}
  if(!duplicateCardMergeCandidates(sourceId).some(x=>x.id===targetId)){toast('الدمج غير آمن أو لم يعد متاحًا');return;}
  const source=Finance.getInstrument(sourceId),target=Finance.getInstrument(targetId);
  if(!source||!target)return;
  const ok=await dialog({
    emoji:'🧩',
    title:'تأكيد دمج البطاقة',
    msg:'سيتم دمج '+(maskedCardNumber(source)||source.name)+' داخل '+(maskedCardNumber(target)||target.name)+' ونقل التاريخ المالي المرتبط بها. البطاقة الحالية المكررة ستُحذف.',
    okText:'دمج'
  });
  if(!ok)return;
  showFinancialRecalcOverlay('جاري دمج البطاقة وإعادة الحساب');
  await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,20)));
  const result=await commitCriticalMutation(async()=>{
    const merged=BankIngestionCore.mergeDuplicateInstrument(S,sourceId,targetId);
    if(!merged.ok)return false;
    Finance.ensureAllPrimaries();
    return true;
  });
  hideFinancialRecalcOverlay();
  if(!result.ok){render();toast('تعذر الدمج — لم يتم تغيير البيانات');return;}
  closeSheet();render();toast('تم دمج البطاقة المكررة وإعادة الحساب');
}

async function archiveInstrument(id){
  if (!canWrite()){ return; }
  const inst = Finance.getInstrument(id);
  if (!inst) return;
  const acc = inst.accountId ? Finance.getAccount(inst.accountId) : null;
  if (inst.type === 'credit_card' && acc){
    /* V8.8.4.11: only block when this is the LAST active card AND the account
       carries a non-zero raw balance. Sibling active cards keep the account
       accessible → archiving this one is allowed. */
    const siblingsActive = S.paymentInstruments.filter(i =>
      i && i.accountId === acc.id && i.type === 'credit_card' && !i.archived && i.id !== inst.id
    );
    const isLastActive = siblingsActive.length === 0;
    const rawBal = Finance.accountBalance(acc.id);
    if(isLastActive&&rawBal===null){toast('المديونية غير مؤكدة؛ لا يمكن إخفاء آخر بطاقة');return;}
    if (isLastActive && Math.abs(rawBal) > 0.01){
      const debt = rawBal < 0 ? -rawBal : 0;
      const credit = rawBal > 0 ? rawBal : 0;
      const msg = debt > 0
        ? 'هذه آخر بطاقة نشطة على الحساب وعليه مديونية ' + amtFull(debt, acc.currency) + '. سدّدها أولاً.'
        : 'هذه آخر بطاقة نشطة على الحساب وبه رصيد موجب ' + amtFull(credit, acc.currency) + '. سوِّ الحساب أولاً.';
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة البطاقة', msg, okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }
  if (inst.type === 'prepaid_card' && acc){
    const rawPrepaid=Finance.accountBalance(acc.id);
    if(rawPrepaid===null){toast('رصيد البطاقة غير مؤكد');return;}
    const bal = Math.abs(rawPrepaid);
    if (bal > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة البطاقة',
        msg:'البطاقة فيها رصيد ' + amtFull(bal, acc.currency) + '. حوّل أو استخدم الرصيد أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }
  const ok = await dialog({emoji:'📦', title:'أرشفة البطاقة', msg:'ستختفي من الإدخال الجديد.', okText:'أرشفة', primary:true});
  if (!ok) return;
  const result = await commitCriticalMutation(async () => {
    inst.archived = true;
    if (acc && inst.type === 'prepaid_card' && acc.ownedByInstrumentId === inst.id){
      acc.archived = true;
    }
    if (acc && inst.type === 'credit_card'){
  /* V8.8.4.8 invariant preserved: account archived only if ALL linked
     credit cards are archived. Siblings are NOT touched. */
  const linked = S.paymentInstruments.filter(i => i.accountId === acc.id && i.type === 'credit_card');
  const anyActive = linked.some(i => !i.archived);
  /* V8.8.4.10 FIX 4: do NOT archive the backing account if it still
     holds a non-zero raw balance (legacy/malformed state safety net). */
  const rawBal = Finance.accountBalance(acc.id);
  if (!anyActive && rawBal!==null&&Math.abs(rawBal) <= 0.01){
    acc.archived = true;
  } else {
    acc.archived = false;
  }
}
    if (acc){
      if (S.settings.defaultInstrumentByCountry[acc.country] === id){
        delete S.settings.defaultInstrumentByCountry[acc.country];
      }
      if (S.settings.defaultAccountByCountry[acc.country] === acc.id){
        delete S.settings.defaultAccountByCountry[acc.country];
      }
    }
    /* V8.8.4.9 FIX 3: pause recurring tied to THIS instrument unconditionally */
    S.recurring.forEach(r => {
      if (r.instrumentId === id){ r.active = false; }
    });
    /* If the backing account also became archived, pause account-based recurring too.
       On shared imported credit accounts with sibling active cards, acc stays active
       and account-based recurring rules are intentionally NOT paused. */
    if (acc && acc.archived){
      S.recurring.forEach(r => {
        if (r.accountId === acc.id){ r.active = false; }
      });
    }
    Finance.ensureAllPrimaries();
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الأرشفة');
}
async function unarchiveInstrument(id){
  if (!canWrite()){ return; }
  const inst = Finance.getInstrument(id);
  if (!inst) return;
  const acc = inst.accountId ? Finance.getAccount(inst.accountId) : null;
  const result = await commitCriticalMutation(async () => {
    inst.archived = false;
    if (acc && inst.type === 'prepaid_card' && acc.ownedByInstrumentId === inst.id){
      acc.archived = false;
    }
    if (acc && inst.type === 'credit_card'){
      /* V8.8.4.8: activating any credit card activates its backing account. */
      acc.archived = false;
    }
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الاسترجاع');
}

async function retryStorage(){return withExclusiveDataOperation(()=>retryStorageImpl());}
async function retryStorageImpl(){
  toast('جاري إعادة المحاولة...');
  Storage.resetConnection();
  const initResult = await Storage.init();
  if (initResult.mode === 'memory'){
    S.previewMode = true; S.storageStatus = 'ok'; S.storageError = null;
    if (!S.accounts.length){
      const def = DEFAULT_STATE(); def.settings.onboarded = true; def.settings.defaultCountry = 'UAE';
      loadStateInto(def);
      await Storage.writeState(snapshotState());
    }
    render(); toast('وضع تجربة'); return;
  }
  if (initResult.mode === 'error'){
    S.storageStatus = 'unavailable'; S.storageError = initResult.error; S.previewMode = false;
    render(); toast('ما زال التخزين غير متاح'); return;
  }
  const result = await Storage.readState();
  if (!result.ok){
    S.storageStatus = result.reason || 'corrupted';
    S.storageError = result.error;
    render(); toast('ما زال التخزين غير متاح');
    return;
  }

  /* V8.8.4.6 P0: the durable fallback is the RAW durable state read from
     IDB — NEVER snapshotState() in Recovery mode (it may be empty/stale). */
  const durableBefore = result.state ? deepClone(result.state) : null;

  if (durableBefore){
    /* V8.8.4.7 P0: readable durable state about to be replaced →
       safety snapshot is REQUIRED. */
    const snapRes = await writeRotatedPreCritSnapshot(durableBefore);
    if (!snapRes.ok){
      S.storageStatus = 'corrupted';
      S.storageError = new Error('retry: safety snapshot failed: ' + (snapRes.reason || 'unknown'));
      render();
      toast('تعذر إنشاء نسخة أمان — لا يزال وضع الحماية');
      return;
    }
    let migrated = null;
    try { migrated = Schema.migrate(durableBefore); }
    catch(e){
      S.storageStatus = 'corrupted';
      S.storageError = e;
      render();
      toast('فشل ترقية البيانات — لا يزال وضع الحماية');
      return;
    }
    if (!migrated){
      S.storageStatus = 'corrupted';
      S.storageError = new Error('migration returned null');
      render();
      toast('فشل ترقية البيانات — لا يزال وضع الحماية');
      return;
    }
    loadStateInto(migrated);
  } else {
    /* No durable state — fresh candidate, no rollback target, no snapshot to make. */
    loadStateInto(DEFAULT_STATE());
  }
  Finance.ensureAllPrimaries();
  const candidate = snapshotState();

  const vres = await verifiedWriteState(candidate, durableBefore);
  if (vres.ok){
    S.storageStatus = 'ok'; S.storageError = null; S.previewMode = false;
    await loadSnapshots();
    await recomputePendingRecurring();
    syncNativeNotifications();
    applyTheme(); render();
    toast('تم استرجاع التخزين');
    return;
  }
  /* Failure — do NOT announce success, do NOT write UI state.
     If rollback succeeded, durable storage still holds durableBefore (raw). */
  if (durableBefore){
    try { loadStateInto(durableBefore); } catch(_){}
  }
  /* vres.restored===false already entered Recovery via helper. */
  S.storageStatus = 'corrupted';
  if (!S.storageError) S.storageError = new Error(vres.reason || 'retry failed');
  render();
  toast('فشل التحقق من التخزين — لا يزال وضع الحماية');
}

      /* Recovery: raw durable read is the only trustworthy source. */
      let raw = { ok:false };
      try { raw = await Storage.readState(); } catch(_){ raw = { ok:false }; }
      if (raw.ok && raw.state){
        durableBackup = deepClone(raw.state);
        /* V8.8.4.7 P0: readable durable → safety snapshot REQUIRED. */
        const snapRes = await writeRotatedPreCritSnapshot(durableBackup);
        if (!snapRes.ok){
          render();
          toast('تعذر إنشاء نسخة أمان — لم يتم الاستيراد');
          return;
        }
        /* V8.8.4.8: user-visible restore point too. */
        const userSnapRes = await writeRotatedUserSnapshot(durableBackup);
        if (!userSnapRes.ok){
          render();
          toast('تعذر إنشاء نسخة استرجاع — لم يتم الاستيراد');
          return;
        }
      } else {
        /* Unreadable/corrupted durable → no readable state to preserve.
           Proceed with no fallback; verified-write failure stays Recovery. */
        durableBackup = null;
      }
    }

    let migrated = null;
    try {
      migrated = BackupCore.prepareFinanceRestore(parsed,{
        migrate:state=>Schema.migrate(state),
        validateStateStrict:state=>Schema.validateStateStrict(state)
      });
    } catch(e){
      if (e && e.message === 'migration-failed'){
        const cause = e.cause;
        toast(cause ? 'فشل ترقية البيانات: ' + (cause.message || cause) : 'فشل ترقية البيانات');
        return;
      }
      if (e && e.message === 'schema-invalid'){
        const strictErrors = Array.isArray(e.validationErrors) ? e.validationErrors : [];
        await dialog({emoji:'❌', title:'النسخة تحتوي بيانات مالية غير صالحة', msg: strictErrors.slice(0,8).join('\n'), okText:'حسناً', primary:true, hideCancel:true});
        return;
      }
      throw e;
    }

    loadStateInto(migrated);
    Finance.ensureAllPrimaries();
    const candidate = snapshotState();

    const vres = await verifiedWriteState(candidate, durableBackup);
    if (vres.ok){
      if (!S.previewMode){ S.storageStatus = 'ok'; S.storageError = null; }
      await loadSnapshots();
      await recomputePendingRecurring();
      syncNativeNotifications();
      applyTheme(); render();
      toast('تم الاستيراد');
      return;
    }
    /* Failure — no extra unverified writes. */
    if (durableBackup) loadStateInto(durableBackup);
    render();
    if (vres.restored) toast('فشل الاستيراد — تم استرجاع الحالة السابقة');
    else toast('فشل الاستيراد — وضع الحماية');
  });
  r.readAsText(file);
}

async function restoreSnapshot(name){return withExclusiveDataOperation(()=>restoreSnapshotImpl(name));}
async function restoreSnapshotImpl(name){
  if (!canWrite()){ return; }
  const snap = await Storage.readSnapshot(name);
  if (!snap){ toast('النسخة غير متوفرة'); return; }
  const ok = await dialog({emoji:'💾', title:'استرجاع نسخة', msg:'سيتم استبدال البيانات الحالية بالنسخة المختارة.', okText:'استرجاع', primary:true});
  if (!ok) return;

  /* V8.8.4.5: ONE before, ONE candidate, ONE verified commit */
  const before = snapshotState();

  if (!S.previewMode){
    const snapRes = await writeRotatedPreCritSnapshot(before);
    if (!snapRes.ok){
      render();
      toast('تعذر إنشاء نسخة أمان — لم يتم الاسترجاع');
      return;
    }
    /* V8.8.4.8: verified user-visible restore point before restore. */
    const userSnapRes = await writeRotatedUserSnapshot(before);
    if (!userSnapRes.ok){
      render();
      toast('تعذر إنشاء نسخة استرجاع — لم يتم الاسترجاع');
      return;
    }
  } else {
    try { await Storage.rotateSnapshot(before); } catch(_){}
  }

  const migrated = Schema.migrate(snap);
  if (!migrated){ toast('النسخة غير صالحة'); return; }
  const strictErrors = Schema.validateStateStrict(migrated);
  if (strictErrors.length){
    await dialog({emoji:'❌', title:'النسخة غير صالحة', msg: strictErrors.slice(0,8).join('\n'), okText:'حسناً', primary:true, hideCancel:true});
    return;
  }

  loadStateInto(migrated);
  Finance.ensureAllPrimaries();
  const candidate = snapshotState();

  const vres = await verifiedWriteState(candidate, before);
  if (vres.ok){
    await loadSnapshots();
    await recomputePendingRecurring();
    syncNativeNotifications();
    applyTheme(); render();
    toast('تم الاسترجاع');
    return;
  }
  if (vres.restored){
    loadStateInto(before);
    render();
    toast('فشل الاسترجاع — تم استرجاع الحالة السابقة');
  } else {
    loadStateInto(before);
    render();
    toast('فشل الاسترجاع — وضع الحماية');
  }
}
async function loadSnapshots(){
  const all = await Storage.listSnapshots();
  /* V8.8.4.8: hide only recovery internals (pre-crit-N). Keep user snapshots 1/2/3. */
  S.snapshots = (all || []).filter(s => s && s.name && !String(s.name).startsWith('pre-crit'));
}

function go(tab){

  const dlg=document.getElementById('dlg');
  if(dlg&&dlg.classList.contains('on')){
    const cancel=document.getElementById('dlgCancel');
    if(cancel&&cancel.style.display!=='none') cancel.click();
    else if(dlg) dlg.click();
    return true;
  }
  const sheet=document.getElementById('sheet');
  if(sheet&&sheet.classList.contains('on')){ if(typeof closeSheet==='function') closeSheet(); return true; }
  if(SANAD_NAV_STACK.length){
    const prev=SANAD_NAV_STACK.pop(); SANAD_NAV_BACK=true; try{go(prev);}finally{SANAD_NAV_BACK=false;} return true;

/* V8.8.4.8: single source of truth for transfer destination currency */
function resolveTransferDestCurrency(f){
  if (!f) return null;
  if (f._destType === 'external'){
    const b = f.beneficiaryId ? Finance.getBeneficiary(f.beneficiaryId) : null;
    return b ? b.defaultCurrency : null;
  }
  const toAcc = f.toAccountId ? Finance.getAccount(f.toAccountId) : null;
  return toAcc ? toAcc.currency : null;
}
function recomputeTransferFx(f){
  if (!f) return;
  const fromAcc = f.fromAccountId ? Finance.getAccount(f.fromAccountId) : null;
  const fromCur = fromAcc ? fromAcc.currency : null;
  const destCur = resolveTransferDestCurrency(f);
  if (!fromCur || !destCur){ f.fxRate = 0; return; }
  f.fxRate = Finance.suggestRate(fromCur, destCur);
}

document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('[data-rep-account]')){
    S.repAccountId = e.target.value || null;
    if (S.repAccountId){
      const acc = Finance.getAccount(S.repAccountId);
      if (acc && acc.currency) S.repCurrency = acc.currency;
    }
    render();
    return;
  }
  if (e.target.id === 'otherDate' && S.form) setTxDate(e.target.value);
  if (S.form && S.form._sheet === 'recurring'){
    if (e.target.id === 'recCur') S.form.currency = e.target.value;
    else if (e.target.id === 'recCat') S.form.category = e.target.value;
    else if (e.target.id === 'recFreq'){
      S.form.frequency = e.target.value;
      const monthField = document.getElementById('recMonthField');
      if (monthField) monthField.style.display = e.target.value === 'yearly' ? '' : 'none';
    }
    else if (e.target.id === 'recMonth') S.form.month = parseInt(e.target.value) || 0;
  }
  if (e.target.id === 'recFreq' && (!S.form || S.form._sheet !== 'recurring')){
    const monthField = document.getElementById('recMonthField');
    if (monthField) monthField.style.display = e.target.value === 'yearly' ? '' : 'none';
  }
  if (e.target.id === 'wType'){
    const newType = e.target.value;
    if (newType === 'credit'){ toast('بطاقات الائتمان تُنشأ من قسم البطاقات'); return; }
    const preserved = captureAccountSheetValues();
    const saveBtn = document.querySelector('[data-act="save-account"]');
    const wid = saveBtn ? (saveBtn.dataset.id || null) : null;
    closeSheet();
    setTimeout(() => openAccountSheet(wid, newType, preserved), 100);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'searchIn'){
    S.filter.q = e.target.value;
    const tl = document.getElementById('txList');
    if (tl) tl.innerHTML = txListHtml();
  } else if (e.target.id === 'amountIn'){
    if (S.form && S.form._sheet === 'tx'){
      const raw=normalizeAmountInput(e.target.value);
      S.form.amount = raw;
      if (e.target.value !== raw) e.target.value = raw;
      if (S.form.source){
        const acc = Finance.getAccount(S.form.source.accountId);
        const accCur = acc ? acc.currency : 'EGP';
        if (S.form.currency !== accCur){
          const fxRes = document.querySelectorAll('.fx-box .fx-result');
          if (fxRes.length >= 2){
            const rate = Number(S.form.fxRate) || 0;
            const amtNum = parseFloat(raw) || 0;
            fxRes[1].innerHTML = fmt(amtNum) + ' ' + Finance.curSymbol(S.form.currency) + ' = <b>' + fmt(amtNum * rate) + ' ' + Finance.curSymbol(accCur) + '</b>';
          }
        }
      }
    }
  } else if (e.target.id === 'merchantIn'){ if (S.form) S.form.merchantName = e.target.value; }
  else if (e.target.id === 'noteIn'){ if (S.form) S.form.note = e.target.value; }
  else if (e.target.id === 'fxRateIn'){
    if (S.form && S.form.source){
      S.form.fxRate = parseFloat(e.target.value) || 0;
      const acc = Finance.getAccount(S.form.source.accountId);
      const accCur = acc ? acc.currency : 'EGP';
      const amtNum = parseFloat(S.form.amount) || 0;
      const fxRes = document.querySelectorAll('.fx-box .fx-result');
      if (fxRes.length >= 2){
        fxRes[0].innerHTML = '1 ' + Finance.curSymbol(S.form.currency) + ' = <b>' + fmt(S.form.fxRate) + ' ' + Finance.curSymbol(accCur) + '</b>';
        fxRes[1].innerHTML = fmt(amtNum) + ' ' + Finance.curSymbol(S.form.currency) + ' = <b>' + fmt(amtNum * S.form.fxRate) + ' ' + Finance.curSymbol(accCur) + '</b>';
      }
    }
  } else if (e.target.id === 'fromAmtIn'){ if (S.form) S.form.fromAmount = e.target.value; }
  else if (e.target.id === 'toAmtIn'){ if (S.form) S.form.toAmount = e.target.value; }
  else if (e.target.id === 'rateIn'){ if (S.form) S.form.fxRate = parseFloat(e.target.value) || 0; }
  else if (e.target.id === 'feeIn'){ if (S.form && S.form._sheet === 'transfer') S.form.fee = e.target.value; }
  else if (e.target.id === 'payAmount'){
    if (S.form && S.form._sheet === 'repayment') S.form.principal = e.target.value;
    else if (S.form && S.form._pay) S.form._pay.sourceAmount = e.target.value;
  }
  else if (e.target.id === 'payRate'){
    if (S.form && S.form._sheet === 'repayment') S.form.rate = parseFloat(e.target.value) || 0;
    else if (S.form && S.form._pay) S.form._pay.rate = parseFloat(e.target.value) || 0;
  }
  else if (e.target.id === 'payFee'){
    if (S.form && S.form._sheet === 'repayment') S.form.fee = e.target.value;
    else if (S.form && S.form._pay) S.form._pay.fee = e.target.value;
  }
  else if (e.target.id === 'payNote'){
    if (S.form && S.form._sheet === 'repayment') S.form.note = e.target.value;
    else if (S.form && S.form._pay) S.form._pay.note = e.target.value;
  }
  if (S.form && S.form._sheet === 'recurring'){
    if (e.target.id === 'recName') S.form.name = e.target.value;
    else if (e.target.id === 'recAmount') S.form.amount = e.target.value;
    else if (e.target.id === 'recDay') S.form.day = Math.min(28, Math.max(1, parseInt(e.target.value) || 1));
    else if (e.target.id === 'recRem'){
      const v = parseInt(e.target.value);
      S.form.reminderDays = isFinite(v) ? Math.max(0, Math.min(30, v)) : 3;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'amountIn' && e.key === 'Enter'){

});

const SWIPE = {el:null,wrap:null,startX:0,startY:0,dx:0,locked:false,longTimer:null,moved:false};
function bindTxTouch(){
  const view = document.getElementById('view');
  if (!view) return;
  view.addEventListener('touchstart', onTouchStart, {passive:true});
  view.addEventListener('touchmove', onTouchMove, {passive:false});
  view.addEventListener('touchend', onTouchEnd);
  view.addEventListener('touchcancel', onTouchEnd);
}
function onTouchStart(e){
  const item = e.target.closest('.tx-item');
  if (!item) return;
  const wrap = item.closest('.tx-item-wrap');
  if (!wrap) return;
  const txId = item.dataset.txid;
  const tx = S.transactions.find(x => x.id === txId);
  if (!tx || tx.type === 'adjustment') return;
  SWIPE.el = item; SWIPE.wrap = wrap;
  SWIPE.startX = e.touches[0].clientX;
  SWIPE.startY = e.touches[0].clientY;
  SWIPE.dx = 0; SWIPE.locked = false; SWIPE.moved = false;
  clearTimeout(SWIPE.longTimer);

async function handleMenuAction(act, txId){
  if (act === 'edit') setTimeout(() => openEditTx(txId), 50);
  else if (act === 'delete') setTimeout(() => delTxConfirm(txId), 50);
  else if (act === 'duplicate'){
    if (!canWrite()){ return; }
    const t = S.transactions.find(x => x.id === txId);
    if (!t) return;
    /* V8.8.4.10: do not duplicate adjustment rows or linked repayment fee rows. */
    if (t.type === 'adjustment'){ toast('لا يمكن نسخ التسويات'); return; }
    if (t.linkedTransferId){ toast('لا يمكن نسخ رسوم مرتبطة بسداد'); return; }
    /* V8.8.4.10: validate source validity for each transaction kind. */
    const invalid = 'لا يمكن نسخ المعاملة — وسيلة الدفع لم تعد متاحة';
    if (t.type === 'expense' || t.type === 'income'){
      const acc = Finance.getAccount(t.accountId);
      if (!acc || acc.archived){ toast(invalid); return; }
      if (t.instrumentId){
        const inst = Finance.getInstrument(t.instrumentId);
        if (!inst || inst.archived || inst.accountId !== t.accountId){ toast(invalid); return; }
      }
    } else if (t.type === 'transfer'){
      const fa = Finance.getAccount(t.fromAccountId);
      const ta = Finance.getAccount(t.toAccountId);
      if (!fa || fa.archived){ toast(invalid); return; }
      if (!ta || ta.archived){ toast(invalid); return; }
      /* Repayment transfers must be edited via repayment editor, not duplicated. */
      if (isLiabilityAccount(ta)){ toast('لا يمكن نسخ السداد — عدّله من السداد'); return; }
    } else if (t.type === 'external_transfer'){
      const fa = Finance.getAccount(t.fromAccountId);
      if (!fa || fa.archived){ toast(invalid); return; }
      if (t.beneficiaryId){
        const b = Finance.getBeneficiary(t.beneficiaryId);
        if (!b || b.archived){ toast(invalid); return; }
      }
    } else {
      toast(invalid); return;
    }
    const copy = Object.assign({}, deepClone(t), {id: uid('t'), created: Date.now(), date: isoToday(), rec: null});
    const result = await commitCriticalMutation(async () => {
      S.transactions.push(copy);
      return true;
    });
    if (!result.ok){
      render();
      if (result.reason === 'prepaid-insufficient' || _lastMutationError === 'prepaid-insufficient'){
        _lastMutationError = null;
        toast('الرصيد غير كافٍ في البطاقة/الحساب المدفوع مقدمًا');
        return;
      }
      toast('تعذر الحفظ');
      return;
    }
    /* V8.8.4.11: reevaluate budget context for every budget-relevant duplicate. */
    const dupCtx = budgetContextForTransaction(copy);
    if (dupCtx){
      const a = await runBudgetAlerts(dupCtx.country, dupCtx.month);
      if (a && a.length) S.activeBudgetAlerts = a;
    }
    render(); toast('تم النسخ');
    setTimeout(showBudgetAlertsIfAny, 400);
  }
}

/* V8.8.4.3 FIX 4 (correction): verify migration with full-content fingerprint */
async function boot(){
  applyTheme();
  setupPWA();
  const initResult = await Storage.init();
  if (initResult.mode === 'memory'){
    S.previewMode = true; S.storageStatus = 'ok'; S.storageError = null;
    const def = DEFAULT_STATE();
    def.settings.onboarded = true;
    def.settings.defaultCountry = 'UAE';
    loadStateInto(def);
    await Storage.writeState(snapshotState());
    await loadSnapshots();
    await recomputePendingRecurring();
    S.ready = true;
    startApp();
    return;
  }
  if (initResult.mode === 'error'){
    S.storageStatus = 'unavailable'; S.storageError = initResult.error;
    S.previewMode = false; S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  const result = await Storage.readState();
  if (!result.ok){
    S.storageStatus = result.reason || 'corrupted';
    S.storageError = result.error || null;
    S.previewMode = false; S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  if (!result.state){
    const def = DEFAULT_STATE();
    def.settings.defaultCountry = 'UAE';
    loadStateInto(def);
    const candidate = snapshotState();
    /* No prior state exists → no rollback target. Success = durable readback matches. */
    const vres = await verifiedWriteState(candidate, null);
    if (!vres.ok){
      S.storageStatus = 'unavailable';
      S.storageError = new Error('initial verified write failed: ' + (vres.reason || 'unknown'));
      S.ready = true;
      startApp();
      return;
    }
    S.ready = true;
    if (!S.settings.onboarded){ showOnboarding(); return; }
    startApp();
    return;
  }
  /* V8.8.4.6 P0: ONE atomic verified candidate for migration.
     rawBefore is the raw durable bytes; it is the ONLY valid rollback target. */
  const rawBefore = result.state;

  let migrated = null;
  try { migrated = Schema.migrate(rawBefore); }
  catch(e){
    S.storageStatus = 'corrupted';
    S.storageError = e;
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  if (!migrated){
    S.storageStatus = 'corrupted';
    S.storageError = new Error('migration returned null');
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  const strictErrors = Schema.validateStateStrict(migrated);
  if (strictErrors.length){
    S.storageStatus = 'corrupted';
    S.storageError = new Error('financial integrity check failed: ' + strictErrors.slice(0,5).join(' | '));
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }

  loadStateInto(migrated);
  Finance.ensureAllPrimaries();
  const candidate = snapshotState();

  /* V8.8.4.8: no-op launch optimization — if migration + finalization
     produced the exact same content, do NOT rotate snapshots or rewrite IDB.
     This prevents an unnecessary snapshot/write failure from pushing an
     unchanged healthy DB into Recovery. */
  const rawFp = stateFingerprint(rawBefore);
  const candFp = stateFingerprint(candidate);
  if (rawFp === candFp){
    /* No change to persist. Keep in-memory candidate and continue. */
    await loadSnapshots();
    await recomputePendingRecurring();
    S.ready = true;
    if (!S.settings.onboarded){ showOnboarding(); return; }
    startApp();
    return;
  }

  /* Real change → required safety snapshot + verified write. */
  const snapRes = await writeRotatedPreCritSnapshot(rawBefore);
  if (!snapRes.ok){
    S.storageStatus = 'corrupted';
    S.storageError = new Error('pre-migration safety snapshot failed: ' + (snapRes.reason || 'unknown'));
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }

  const vres = await verifiedWriteState(candidate, rawBefore);
  if (vres.ok){
    /* continue */
  } else if (vres.restored){
    try { loadStateInto(rawBefore); } catch(_){}
    S.storageStatus = 'corrupted';
    S.storageError = new Error('migration commit failed; raw state restored');
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  } else {
    try { loadStateInto(rawBefore); } catch(_){}
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }

  await loadSnapshots();
  await recomputePendingRecurring();
  S.ready = true;
  if (!S.settings.onboarded){ showOnboarding(); return; }
  startApp();
}

      if(!this.originalAttrs.has(el)||/[\u0600-\u06FF]/.test(cur.placeholder+cur.aria+cur.title)) this.originalAttrs.set(el,cur);
      const orig=this.originalAttrs.get(el)||prev;
      if('placeholder' in el) el.placeholder=this.lang==='en'?this.text(orig.placeholder||''):(orig.placeholder||'');
      if(el.hasAttribute('aria-label')||orig.aria) el.setAttribute('aria-label',this.lang==='en'?this.text(orig.aria||''):(orig.aria||''));

        }

      }finally{
        this._observer.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
      }
    });

  }
});

  applyReconciliation(parsed,plan,state=S){
    if(!plan)return {warning:false};
    const tx=plan.transaction||{};
    const ts=Number(parsed.postedAt)||Date.now();
    let accountId=plan.observationAccountId||tx.accountId||tx.fromAccountId||(plan.observations||[]).find(o=>o.field==='observedBalance')?.accountId||null;
    const account=accountId?FinanceCore.getAccount(state,accountId):null;
    let warning=false;
    if(account&&isFiniteNumberLike(parsed.availableBalance)&&(!parsed.availableBalanceCurrency||parsed.availableBalanceCurrency===account.currency)){
      const observedMoney=SanadMoneyCore.decimal(parsed.availableBalance,account.currency);
      if(!observedMoney.ok)return {warning:true};
      const observed=observedMoney.value;
      const balanceAt=parsed.balanceType==='ledger_balance'?FinanceCore.accountBalanceAt(state,account.id,ts):null;
      const calculated=balanceAt;
      const difference=calculated==null?null:SanadMoneyCore.sum([observed,-calculated],account.currency).value??null;
      const existingObservedAt=Number(account.observedBalanceAt)||0;
      if(existingObservedAt<=0||ts>=existingObservedAt){
        account.observedBalance=observed;
        account.observedBalanceAt=ts;
        account.bankReconciliation={kind:'balance',observed,calculated,difference,at:ts,status:difference==null?'observed-only':(difference===0?'matched':'mismatch')};
        warning=difference!=null&&difference!==0;
      }
    }
    const creditAccount=parsed.kind==='card_repayment'?FinanceCore.getAccount(state,tx.toAccountId):account;
    if(creditAccount&&creditAccount.type==='credit'&&isFiniteNumberLike(parsed.availableCredit)&&(!parsed.availableCreditCurrency||parsed.availableCreditCurrency===creditAccount.currency)){
      const observedMoney=SanadMoneyCore.decimal(parsed.availableCredit,creditAccount.currency);
      if(!observedMoney.ok)return {warning:true};
      const observed=observedMoney.value;
      const calculated=FinanceCore.creditAvailableCalculated(state,creditAccount.id);
      const existingCreditAt=Number(creditAccount.observedAvailableCreditAt)||0;
      if(existingCreditAt<=0||ts>=existingCreditAt){
        creditAccount.observedAvailableCredit=observed;
        creditAccount.observedAvailableCreditAt=ts;
        if(calculated==null){
          creditAccount.creditReconciliation={kind:'available-credit',observed,calculated:null,difference:null,at:ts,status:'observed-only'};
        }else{
          const c=calculated;
          const difference=SanadMoneyCore.sum([observed,-c],creditAccount.currency).value??null;
          creditAccount.creditReconciliation={kind:'available-credit',observed,calculated:c,difference,at:ts,status:difference==null?'observed-only':(difference===0?'matched':'mismatch')};
          warning=warning||difference==null||difference!==0;
        }
      }
    }
    return {warning};
  },

      if(plan.transaction&&!plan.replacesTransactionId)S.settings.bankAutoImportCount=(Number(S.settings.bankAutoImportCount)||0)+1;

  _syncPromise:null,
  async sync(options){

    // foreground scan's stale summary or weaker auto-import policy.

    const task=this.syncImpl(options);
    this._syncPromise=task;
    try{return await task;}
    finally{if(this._syncPromise===task)this._syncPromise=null;}

  async syncImpl(options){
    if(_dataReplacementInFlight)return {ok:false,status:'data-replacement-busy'};
    const opts=options||{};
    const clock=()=>typeof performance==='undefined'?Date.now():performance.now();
    if(!this.supported()){this.items=[];return this.lastSummary;}
    this.syncing=true;
    const summary={parsed:0,added:0,observed:0,duplicates:0,ignored:0,review:0,discovered:0,reconcileWarnings:0,activeRescanAdded:0,at:Date.now()};
    const ackIds=[],reviews=[],decisions=[],terminal=[];
    try{
      if(opts.userInitiated){
        let rescanned=await this.rescanActive();
        if(rescanned<0){
          await this.yieldUi(450);
          rescanned=await this.rescanActive();
        }
        summary.activeRescanAdded=Math.max(0,Number(rescanned)||0);
      }
      const excludeIds=opts.excludeIds instanceof Set?opts.excludeIds:null;
      const floor=opts.minPostedAt!=null?Number(opts.minPostedAt):opts.viewReview?0:this.configuredSmsStart();
      const ceiling=Number(opts.maxPostedAt)||Infinity;
      const native=BankIngestionCore.sortNotifications(opts.events||this.readNative(true)).filter(n=>(!excludeIds||!excludeIds.has(String(n.id)))&&Number(n.postedAt)>=floor&&Number(n.postedAt)<=ceiling);
      const allowAuto=!opts.viewReview&&canWrite()&&(opts.force===true||this.autoEnabled());
      const staged=!!(opts.historical&&Array.isArray(opts.events)&&allowAuto);
      const workingState=staged?snapshotState():S;
      const initialFingerprint=staged?stateFingerprint(workingState):null;
      summary.timings={parsePlanMs:0,saveMs:0};
      let processedRows=0;
      summary.reviewIds=[];
      for(const n of native){
        processedRows++;
        const prior=BankIngestionCore.eventDecision(workingState,String(n.id));
        if(prior){ackIds.push(n.id);if(prior.action==='dismissed'||prior.action==='ignored')summary.ignored++;else summary.duplicates++;continue;}
        const parseStarted=clock();
        const parsed=BankMessageCore.parse(n)||{recognized:false,reason:'unrecognized'};
        const evidence={id:n.id,sender:n.title,postedAt:n.postedAt,text:n.text,source:n.importProvenance||n.packageName,at:Date.now(),stage:'posting'};
        const record=(action,reason,tx)=>decisions.push(Object.assign({},evidence,{action,reason,transactionId:tx&&tx.id||null,parsed:{recognized:!!parsed.recognized,kind:parsed.kind||null,amount:parsed.amount,currency:parsed.currency,bankId:parsed.bankId,providerId:parsed.providerId,transactionRef:parsed.transactionRef}}));
        if(parsed&&parsed.ignored&&!BankIngestionCore.reviewHold(workingState,n.id)){summary.timings.parsePlanMs+=clock()-parseStarted;record('ignored',parsed.reason);terminal.push({id:String(n.id),action:'ignored'});ackIds.push(n.id);summary.ignored++;continue;}
        if(!parsed||!parsed.recognized){
          summary.timings.parsePlanMs+=clock()-parseStarted;
          reviews.push({native:n,parsed:parsed||{recognized:false,reason:'unrecognized'},route:null,plan:{action:'review',reason:(parsed&&parsed.reason)||'unrecognized'}});
          record('review',parsed&&parsed.reason||'unrecognized');summary.review++;summary.reviewIds.push(String(n.id));
          if(opts.cooperative&&processedRows%4===0)await this.yieldUi(0);
          continue;
        }
        summary.parsed++;
        let plan=BankIngestionCore.plan(parsed,workingState,{uid});
        // User-selected SMS XML is not an authenticated bank notification.
        if(n.importProvenance==='untrusted-sms-xml'&&plan.action!=='duplicate')plan={action:'review',reason:'file-import-human-confirmation-required'};
        summary.timings.parsePlanMs+=clock()-parseStarted;
        if(plan.action==='duplicate'){
          record('duplicate',plan.reason,{id:plan.existingTransactionId});terminal.push({id:String(n.id),action:'duplicate',transactionId:plan.existingTransactionId});ackIds.push(n.id);summary.duplicates++;continue;
        }
        if(['auto-save','observe'].includes(plan.action)&&allowAuto){
          let saved;
          if(staged){
            const applied=BankIngestionCore.applyPlan(workingState,plan);
            if(applied){
              BankIngestionCore.rememberEventDecision(workingState,String(parsed.eventId),plan.transaction?'saved':'observed',Date.now(),plan.transaction&&plan.transaction.id);
              workingState.settings.bankAutoImportLastAt=Date.now();
              if(plan.transaction&&!plan.replacesTransactionId)workingState.settings.bankAutoImportCount=(Number(workingState.settings.bankAutoImportCount)||0)+1;
            }
            saved={ok:applied,reconciliation:applied?this.applyReconciliation(parsed,plan,workingState):null};
          }else saved=await this.commitPlan(parsed,plan);
          if(saved.ok){
            record(plan.transaction?'saved':'observed',plan.reason,plan.transaction);ackIds.push(n.id);if(plan.replacesTransactionId)summary.updated=(summary.updated||0)+1;else if(plan.transaction)summary.added++;else summary.observed++;
            if(plan.discovered)summary.discovered++;
            if(saved.reconciliation&&saved.reconciliation.warning)summary.reconcileWarnings++;
            if(opts.cooperative&&processedRows%4===0)await this.yieldUi(0);
            continue;
          }
          plan={action:'review',reason:saved.reason||'save-failed'};
        }
        record('review',plan.reason||'auto-disabled');const route=BankMessageCore.resolveRoute(parsed,workingState);
        reviews.push({native:n,parsed,route,plan});
        summary.review++;summary.reviewIds.push(String(n.id));
        if(opts.cooperative&&processedRows%4===0)await this.yieldUi(0);
      }
      if(opts.events){
        const map=new Map(this.smsReviewEvents.map(n=>[String(n.id),n]));
        reviews.forEach(r=>map.set(String(r.native.id),r.native));
        const next=Array.from(map.values());
        if(next.length>10000)throw Error('review-capacity');
        if(await SanadExtStorage.set('bankSmsReviewEvents',next)===false)throw new Error('review-write-failed');
        this.smsReviewEvents=next;
      }
      if(staged){
        const saveStarted=clock();
        const committed=await commitCriticalMutation(()=>{
          if(stateFingerprint(snapshotState())!==initialFingerprint)throw Error('batch-state-changed');
          for(const row of terminal)BankIngestionCore.rememberEventDecision(workingState,row.id,row.action,Date.now(),row.transactionId);
          loadStateInto(workingState);Finance.ensureAllPrimaries();return true;
        });
        summary.timings.saveMs=clock()-saveStarted;
        if(!committed.ok)throw Error('batch-write-failed');
      }
      await this.recordAudit(decisions);
      if(!staged&&terminal.length){
        const remembered=await commitCriticalMutation(async()=>{for(const row of terminal)BankIngestionCore.rememberEventDecision(S,row.id,row.action,Date.now(),row.transactionId);return true;});
        if(!remembered.ok)throw Error('event-decision-write-failed');
      }
      if(ackIds.length)await this.ack(ackIds);
      this.items=reviews;
      this.lastSummary=summary;
      if(opts.userInitiated){
        const diag=this.diagnostics();
        let msg='';
        if(summary.added||summary.updated||summary.review||summary.duplicates||summary.ignored){
          msg='المزامنة تمت';
          if(summary.added)msg+=' · أضيف '+summary.added;
          if(summary.updated)msg+=' · تسوية لنفس الشراء '+summary.updated;
          if(summary.discovered)msg+=' · اكتُشف '+summary.discovered+' مصدر جديد';
          if(summary.review)msg+=' · مراجعة '+summary.review;
          if(summary.reconcileWarnings)msg+=' · تنبيه رصيد '+summary.reconcileWarnings;
        }else if(!diag.accessEnabled){
          msg='فعّل الوصول لإشعارات البنوك والمحافظ أولًا';
        }else if(!diag.listenerConnected){
          msg='الوصول مفعّل لكن خدمة الالتقاط غير متصلة بعد · أعد فتح SANAD بعد لحظات';
        }else{
          msg='لا توجد إشعارات مالية جديدة · سجل SMS القديم لا يُقرأ من هذا الزر';
        }
        toast(msg,4200);
      }
      return summary;
    }catch(_){
      summary.ok=false;summary.status='processing-failed';
      if(opts.userInitiated)toast('تعذر معالجة الرسائل؛ لم يتم حذف المعلق. أعد المحاولة.',5000);
      return summary;
    }finally{this.syncing=false;}
  },

          const row={id:'xml-pending',title:sender,sender,packageName:'sms:'+sender,postedAt:timestamp,text:body,importProvenance:'untrusted-sms-xml'};
          const parsed=BankMessageCore.parse(row);
          const known=!!(UaeBankRegistryCore.detect(sender)||UaeBankRegistryCore.detectProvider?.(sender));
          if((parsed?.recognized&&!parsed.ignored)||(known&&financeCue.test(body)&&!parsed?.ignored)){
            candidates++;
            row.id='smsxml:'+fingerprint(sender+'|'+timestamp+'|'+body);
            if(map.has(row.id)||BankIngestionCore.eventDecision(S,row.id))existing++;
            else{map.set(row.id,row);added++;if(map.size>10000)throw Error('review-queue-full');}
          }
        }
        if(scanned%200===0){progress();await this.yieldUi(0);}
      }
      progress();
      const merged=Array.from(map.values());
      if(added&&await SanadExtStorage.set('bankSmsReviewEvents',merged)===false)throw Error('storage-failed');
      if(added)this.smsReviewEvents=merged;
      const status=document.getElementById('bankXmlState');
      if(status)status.textContent='اكتمل فحص '+total+' SMS · '+candidates+' مرشح مالي · '+added+' للمراجعة · '+existing+' موجود · صفر عمليات أضيفت للدفتر المالي';
      document.querySelector('#sheet .sheet-body')?.insertAdjacentHTML('beforeend','<button type="button" class="btn primary" data-sanad-act="bank-inbox">فتح المراجعة</button>');
      return {ok:true,total,candidates,added,existing};
    }catch(error){
      const reason=String(error?.message||'import-failed');
      const status=document.getElementById('bankXmlState');
      if(status)status.textContent='تعذر الاستيراد الآمن: '+reason+' · لم تُسجّل معاملات مالية';
      return {ok:false,reason};
    }
  },

  async refreshRecentSms(){
    if(this.historicalImporting){this.cancelHistoricalImport('user');return null;}
    if(this._recentStarting)return null;
    closeSheet();
    this._recentStarting=true;
    try{
      if(!await this.ensureSmsStart()){toast('تعذر حفظ بداية السحب؛ لم يبدأ الفحص');return null;}
      const previous=await SanadExtStorage.get('bankImportLastRecent',null);
      const floor=this.configuredSmsStart();
      const compatible=BankIngestionCore.compatibleScanCheckpoint(previous,floor);
      const now=Date.now();
      // Quick scans cover a bounded week; explicit historical scans remain available.
      // A paused scan resumes from its durable checkpoint rather than this quick window.
      const fromDate=Math.max(now-7*86400000,BankIngestionCore.recentScanStart(compatible,now,floor));
      return await this.importHistoricalSms(0,{mode:'recent',fromDate,configuredStartAt:floor});
    }finally{this._recentStarting=false;}
  },
  async importHistoricalSms(days=0,options={}){
    if(this.historicalImporting){
      this.cancelHistoricalImport('user');
      toast('سيتم إيقاف استيراد SMS بعد الدفعة الحالية');
      return null;
    }
    if(!this.historicalSupported()){toast('استيراد SMS القديمة غير متاح على هذه النسخة');return null;}
    if(!this.historicalPermission()){
      const ok=confirm('سيقرأ SANAD رسائل SMS الموجودة على جهازك محليًا لاستخراج المعاملات المالية فقط. لا يتم إرسال الرسائل إلى أي خادم. هل تريد المتابعة؟');
      if(!ok)return null;
      this._historicalPending=true;
      this._historicalPendingDays=Number(days)||0;
      this._historicalPendingOptions=Object.assign({},options);
      try{AndroidBridge.requestHistoricalSmsPermission();}
      catch(_){this._historicalPending=false;toast('تعذر طلب صلاحية قراءة الرسائل');}
      return null;
    }
    if(!canWrite()){toast('وضع القراءة فقط');return null;}

    this.historicalImporting=true;
    this.historicalCancelRequested=false;
    this.historicalCancelReason='';
    this._historicalReviewIds=new Set();
    const checkpoint=options.resume?await SanadExtStorage.get('bankImportActive',null):null;
    if(options.resume&&(!checkpoint||checkpoint.status==='complete'||checkpoint.status==='cancelled')){this.historicalImporting=false;toast('لا يوجد فحص محفوظ للاستكمال');return null;}
    if(checkpoint)options=Object.assign({},options,{fromDate:checkpoint.fromDate,mode:checkpoint.mode,configuredStartAt:checkpoint.configuredStartAt});
    const startedAt=checkpoint?checkpoint.throughDate:Date.now();
    const rangeStart=Math.max(0,options.fromDate!=null?Number(options.fromDate):Number(days)>0?startedAt-Number(days)*86400000:0);
    let afterDate=Math.max(0,rangeStart-1),afterId=0,pages=0;
    const total={scanned:0,matchingRows:0,financialCandidates:0,parsed:0,added:0,observed:0,review:0,duplicates:0,ignored:0,discovered:0};
    if(checkpoint){afterDate=checkpoint.nextAfterDate;afterId=checkpoint.nextAfterId;pages=checkpoint.pages||0;Object.assign(total,checkpoint.total||{});}
    const clock=()=>typeof performance==='undefined'?Date.now():performance.now();
    const runStart=clock(),initialScanned=total.scanned,initialPages=pages;
    let totalCount=null,foreground=false;
    const timings={readMs:0,parsePlanMs:0,saveMs:0,renderMs:0};
    const publishProgress=()=>{
      const elapsed=clock()-runStart,processed=total.scanned-initialScanned;
      this.historicalProgress=Object.assign({pages,fromDate:rangeStart,throughDate:startedAt,reachedAt:afterDate,totalCount,foreground},total);
      if(totalCount!==null&&processed>=40&&pages-initialPages>=2&&elapsed>=2000)this.historicalProgress.etaSeconds=Math.max(0,(totalCount-total.scanned)*elapsed/processed/1000);
      const before=clock();this.updateImportProgress();timings.renderMs+=clock()-before;
      try{if(typeof AndroidBridge!=='undefined'&&AndroidBridge.updateSmsImportForeground)AndroidBridge.updateSmsImportForeground(total.scanned,total.added,total.review,totalCount===null?-1:totalCount);}catch(_){}
    };
    const pageLimit=pages+2000; // Bound each run without making a durable cursor impossible to resume.
    const scanCheckpoint=status=>({status,fromDate:rangeStart,throughDate:startedAt,mode:options.mode||'historical',configuredStartAt:options.configuredStartAt||null,nextAfterDate:afterDate,nextAfterId:afterId,pages,totalCount,timings:Object.assign({},timings),total:Object.assign({},total)});
    let status='complete';
    this.historicalProgress=Object.assign({pages,fromDate:rangeStart,throughDate:startedAt,reachedAt:afterDate},total);
    if(S.tab==='settings'||S.tab==='home')render();

    try{
      if(!checkpoint&&await SanadExtStorage.set('bankImportActive',scanCheckpoint('running'))===false){status='checkpoint-failed';throw new Error('checkpoint-failed');}
      try{if(typeof AndroidBridge!=='undefined'&&AndroidBridge.beginSmsImportForeground)foreground=AndroidBridge.beginSmsImportForeground()===true;}catch(_){}
      publishProgress();
      while(pages<pageLimit){
        if(this.historicalCancelRequested){status=this.historicalCancelReason==='pause'?'paused':'cancelled';break;}
        await this.yieldUi(24);
        if(this.historicalCancelRequested){status=this.historicalCancelReason==='pause'?'paused':'cancelled';break;}

        pages++;
        let page=null;const readStarted=clock();
        try{
          page=await this.requestHistoricalPage(0,afterDate,afterId,20,startedAt);
        }catch(_){
          page={ok:false,status:'query-failed'};
        }
        if(!page.ok){
          status=page.status||'query-failed';
          if(status==='cancelled'&&this.historicalCancelReason==='pause')status='paused';
          break;
        }

        timings.readMs+=Number.isFinite(page.readMs)?page.readMs:clock()-readStarted;
        if(Number.isFinite(page.remainingCount)&&page.remainingCount>=0)totalCount=total.scanned+page.remainingCount;
        total.scanned+=Number(page.scanned||0);
        if(totalCount!==null&&total.scanned>totalCount)totalCount=null;
        total.matchingRows=Math.max(total.matchingRows,Number(page.matchingRows||0));
        total.financialCandidates+=Number(page.financialCandidates||0);

        let directEvents=null;
        if(Array.isArray(page.messages)){
          const filterStarted=clock();
          directEvents=page.messages.filter(n=>n.candidate||(BankMessageCore.parse(n)||{}).recognized);
          timings.parsePlanMs+=clock()-filterStarted;
          await this.recordAudit(directEvents.map(n=>({id:n.id,sender:n.title,text:n.text,postedAt:n.postedAt,stage:'provider',action:'candidate',reason:n.candidate?'native-candidate':'parser-candidate',at:Date.now()})));
        }
        const batch=await this.sync({
          force:true,
          userInitiated:false,
          cooperative:true,
          historical:true,events:directEvents,minPostedAt:rangeStart,maxPostedAt:startedAt,
          excludeIds:this._historicalReviewIds
        });
        if(!batch||batch.ok===false)throw new Error('bank-batch-failed');
        for(const key of ['parsePlanMs','saveMs'])timings[key]+=Number(batch.timings&&batch.timings[key]||0);
        for(const id of (batch.reviewIds||[]))this._historicalReviewIds.add(String(id));
        total.parsed+=Number(batch.parsed||0);
        total.added+=Number(batch.added||0);
        total.updated=Number(total.updated||0)+Number(batch.updated||0);
        total.observed+=Number(batch.observed||0);
        total.review+=Number(batch.review||0);
        total.duplicates+=Number(batch.duplicates||0);
        total.ignored+=Number(batch.ignored||0);
        total.discovered+=Number(batch.discovered||0);


        if(page.done){
          if(this.historicalCancelRequested)status=this.historicalCancelReason==='pause'?'paused':'cancelled';
          if(page.nextAfterDate){afterDate=Number(page.nextAfterDate);afterId=Number(page.nextAfterId)||0;}
          if(await SanadExtStorage.set('bankImportActive',scanCheckpoint(status))===false)status='checkpoint-failed';
          else publishProgress();
          break;
        }
        if(page.capacityReached&&Number(batch.added||0)+Number(batch.updated||0)+Number(batch.observed||0)+Number(batch.duplicates||0)+Number(batch.ignored||0)===0){status='review-capacity';break;}
        const nextDate=Number(page.nextAfterDate||0),nextId=Number(page.nextAfterId||0);
        if(!Number.isFinite(nextDate)||!Number.isFinite(nextId)||nextDate<afterDate||(nextDate===afterDate&&nextId<=afterId)){status='cursor-stalled';break;}
        afterDate=nextDate;afterId=nextId;
        if(await SanadExtStorage.set('bankImportActive',scanCheckpoint('running'))===false){status='checkpoint-failed';break;}
        publishProgress();
        await this.yieldUi(24);
      }
      if(pages>=pageLimit&&status==='complete')status='page-limit';
    }catch(_){
      if(status!=='checkpoint-failed')status='processing-failed';
    }finally{
      this.historicalImporting=false;
      this.historicalCancelRequested=false;
      this.historicalProgress=null;
      this.updateImportProgress();
      try{if(typeof AndroidBridge!=='undefined'&&AndroidBridge.endSmsImportForeground)AndroidBridge.endSmsImportForeground();}catch(_){}
    }

    if(status==='cancelled'||status==='paused')await SanadExtStorage.set('bankImportActive',scanCheckpoint(status));
    this.lastHistoricalImport={at:Date.now(),startedAt,status,mode:options.mode||'historical',configuredStartAt:options.configuredStartAt||null,fromDate:rangeStart,throughDate:startedAt,days:Number(days)||0,pages,total,totalCount,timings,nextAfterDate:afterDate,nextAfterId:afterId};
    const summarySaved=await SanadExtStorage.set('bankImportLastHistorical',this.lastHistoricalImport);
    if(summarySaved===false){status='checkpoint-failed';this.lastHistoricalImport.status=status;}
    if(options.mode==='recent'){
      const previous=await SanadExtStorage.get('bankImportLastRecent',null);
      const compatible=BankIngestionCore.compatibleScanCheckpoint(previous,options.configuredStartAt);
      const priorThrough=Number(compatible&&compatible.scannedThrough)||0;
      this.lastRecentImport=Object.assign({},this.lastHistoricalImport,{scannedThrough:status==='complete'?startedAt:priorThrough});
      if(await SanadExtStorage.set('bankImportLastRecent',this.lastRecentImport)===false){
        status='checkpoint-failed';this.lastHistoricalImport.status=status;
        this.lastRecentImport.status=status;this.lastRecentImport.scannedThrough=priorThrough;
      }
    }
    // Historical imports have independent coverage and must not advance recent scans.
    if(S.tab==='settings'||S.tab==='home')render();

    if(status==='cancelled')toast('تم إيقاف استيراد SMS · فُحص '+total.scanned+' رسالة',4200);
    else if(status==='complete'&&total.scanned===0)toast('Android لم يُرجع أي SMS من صندوق الرسائل',5000);
    else if(status==='review-capacity')toast('توقف الفحص لحفظ الرسائل: صندوق المراجعة ممتلئ. راجع الرسائل المعلقة ثم أعد الفحص؛ الرسائل الأصلية لم تُحذف.',8000);
    else if(status==='complete')toast('تم فحص '+total.scanned+' SMS · مالية '+total.financialCandidates+' · parsed '+total.parsed+' · أضيف '+total.added+' · مراجعة '+total.review+' · مكرر '+total.duplicates,6500);
    else if(status==='permission-restricted')toast('Android منع صلاحية قراءة SMS لهذه النسخة أو طريقة التثبيت',5000);
    else if(status==='query-failed')toast('تعذر قراءة صندوق SMS من Android',5000);
    else if(status==='processing-failed')toast('توقف الفحص لتعذر معالجة دفعة؛ أعد السحب لاستكمالها بدون حذف الرسائل',6500);
    else if(status==='checkpoint-failed')toast('لم تُحفظ نقطة الاستكمال؛ أعد السحب. العمليات المحفوظة لن تُضاف مرة ثانية.',6500);
    else if(status==='timeout')toast('قراءة SMS استغرقت وقتًا طويلًا وتم إيقافها بدون تجميد التطبيق',5200);
    else if(status==='worker-unavailable')toast('خدمة قراءة SMS غير متاحة الآن · أعد فتح التطبيق',5200);
    else toast('توقف استيراد SMS قبل الاكتمال · فُحص '+total.scanned+' رسالة',5000);
    return this.lastHistoricalImport;
  },
  async onHistoricalPermissionResult(granted){
    if(!this._historicalPending)return;
    const pendingDays=Number(this._historicalPendingDays)||0;
    const pendingOptions=this._historicalPendingOptions||{};
    this._historicalPending=false;
    this._historicalPendingDays=null;
    this._historicalPendingOptions=null;
    if(!granted){toast('لم يتم منح صلاحية قراءة رسائل SMS');render();return;}
    await this.yieldUi(250);
    await this.importHistoricalSms(pendingDays,pendingOptions);
  },
  canManualApprove(item){
    if(item?.native?.importProvenance==='untrusted-sms-xml')return false;
    if(!item||!item.parsed||!item.parsed.recognized)return false;
    if(item.plan&&['possible-own-transfer','possible-manual-duplicate','possible-duplicate','incoming-origin-unconfirmed','repair-destination-unconfirmed','repair-evidence-match-review'].includes(item.plan.reason))return false;
    if(item.plan&&item.plan.action==='auto-save')return true;
    const r=BankMessageCore.resolveRoute(item.parsed,S);
    if(!r||r.status!=='routed')return false;
    return !!BankMessageCore.buildTransaction(item.parsed,r,{uid:()=> 'probe'}).ok;
  },
  correctionSourceOptions(parsed,selected){
    const cardMessage=!!parsed.cardLast4&&['purchase','bill_payment','mobile_recharge','refund'].includes(parsed.kind);
    const option=(value,label)=>'<option value="'+esc(value)+'"'+(selected===value?' selected':'')+'>'+esc(label)+'</option>';
    const groups=S.accounts.filter(a=>a&&!a.archived).map(acc=>{
      const cards=S.paymentInstruments.filter(i=>i&&!i.archived&&i.accountId===acc.id);
      const institution=(S.institutions||[]).find(i=>i.id===acc.institutionId);
      const bank=institution&&institution.bankRegistryId?UaeBankRegistryCore.get(institution.bankRegistryId):null;
      const provider=institution&&institution.providerRegistryId&&UaeBankRegistryCore.getProvider?UaeBankRegistryCore.getProvider(institution.providerRegistryId):null;
      const short=bank?bankUiShort(bank):(provider?providerUiShort(provider):(institution?.name||acc.name||'حساب'));
      const accountKind=({bank:'حساب بنكي',credit:'حساب سداد بطاقة',ewallet:'حساب محفظة'}[acc.type]||'حساب');
      // Issuer is immutable evidence on authenticated SMS, never inferred from matching digits alone.
      const egyptIssuerCorrection=parsed.reviewReason==='issuer-jurisdiction-unconfirmed'&&parsed.bankId==='emirates-nbd'&&bank?.id==='emirates-nbd-egypt';
      const issuerOk=(!parsed.bankId||!!bank&&(bank.id===parsed.bankId||egyptIssuerCorrection))&&(!parsed.providerId||!!provider&&provider.id===parsed.providerId);
      if(!issuerOk)return '';
      if(parsed.kind==='card_repayment'&&acc.type==='credit')return '';
      let rows=cardMessage?'':option('account:'+acc.id,short+' · '+accountKind+' ('+acc.currency+')');
      rows+=cards.filter(i=>parsed.kind!=='card_repayment'||i.type==='debit_card').map(i=>option('instrument:'+i.id,short+' · '+({'debit_card':'بطاقة خصم','credit_card':'بطاقة ائتمان','wallet_card':'بطاقة محفظة','prepaid_card':'بطاقة مسبقة الدفع'}[i.type]||'بطاقة')+' ••••'+(i.last4||'غير معلوم')+' ('+acc.currency+')')).join('');
      return rows?'<optgroup label="'+esc(short+' · '+(countryInfo(acc.country).name||acc.country)+' · '+acc.currency)+'">'+rows+'</optgroup>':'';
    });
