  if (!f || f._sheet !== 'transfer') return;
  const fromAmt = parseFloat(f.fromAmount);
  if (!fromAmt || fromAmt <= 0){ toast('أدخل مبلغاً صحيحاً'); return; }
  if (!f.fromAccountId){ toast('اختر حساباً'); return; }
  const fromAcc = Finance.getAccount(f.fromAccountId);
  if (!fromAcc){ toast('اختر حساباً'); return; }
  const fromCur = fromAcc.currency;
  const isExternal = f._destType === 'external';
  let toCur, toAmount, targetAcc, bene;
  if (isExternal){
    bene = Finance.getBeneficiary(f.beneficiaryId);
    if (!bene){ toast('اختر شخصاً'); return; }
    toCur = bene.defaultCurrency;
  } else {
    targetAcc = Finance.getAccount(f.toAccountId);
    if (!targetAcc){ toast('اختر حساباً'); return; }
    toCur = targetAcc.currency;
  }
  const sameCur = fromCur === toCur;
  let fxRate = 1;
  toAmount = fromAmt;
  if (!sameCur){
    const mode = f._transferMode || 'received';
    if (mode === 'received'){
      const toAmtEl = document.getElementById('toAmtIn');
      toAmount = parseFloat(toAmtEl ? toAmtEl.value : '');
      if (!toAmount || toAmount <= 0){ toast('أدخل المبلغ الواصل'); return; }
      fxRate = Math.round((toAmount / fromAmt) * 1000000) / 1000000;
    } else {
      const rateEl = document.getElementById('rateIn');
      fxRate = parseFloat(rateEl ? rateEl.value : '');
      if (!fxRate || fxRate <= 0){ toast('أدخل سعر تحويل صحيح'); return; }
      toAmount = Math.round(fromAmt * fxRate * 100) / 100;
    }
    // FX memory is persisted inside the critical mutation.
  }
  const isRepayment = !isExternal && targetAcc && isLiabilityAccount(targetAcc);
  if (isRepayment){
    const debt = Finance.accountDebt(targetAcc.id);
    const existingTransfer = f.id ? S.transactions.find(x => x.id === f.id) : null;
    const existingToAmount = existingTransfer && existingTransfer.toAccountId === targetAcc.id
      ? (Number(existingTransfer.toAmount) || 0) : 0;
    const debtBefore = debt + existingToAmount;
    if (toAmount > debtBefore + 0.01){
      await dialog({emoji:'⚠️', title:'المبلغ أكبر من المديونية',
        msg:'أقصى مبلغ للسداد هو ' + amtFull(debtBefore, toCur) + '.',

      return;
    }
  }
  const feeEl = document.getElementById('feeIn');
  let fee = feeEl ? Math.max(0, parseFloat(feeEl.value) || 0) : 0;
  const feeForTransfer = isRepayment ? 0 : fee;
  const feeForExpense = isRepayment ? fee : 0;
  const wasEdit = !!f.id;

  let oldTxSnapshot = null;
  if (wasEdit && f.id){
    const existing = S.transactions.find(x => x.id === f.id);
    if (existing) oldTxSnapshot = deepClone(existing);
  }
  const newId = wasEdit ? f.id : uid('t');
  const origCreated = f._originalCreated || Date.now();
  const result = await commitCriticalMutation(async () => {
    if (!sameCur) Finance.rememberRate(fromCur, toCur, fxRate);
    if (isExternal){
      const data = {
        id: newId, type: 'external_transfer',
        fromAccountId: fromAcc.id, fromAmount: fromAmt, fromCurrency: fromCur,
        fromCountry: fromAcc.country,
        beneficiaryId: bene.id, receivedAmount: toAmount, receivedCurrency: toCur, receivedAmountKnown:true,
        fxRate, fee: feeForTransfer, instrumentId: null,
        note: (f.note || '').trim() || ('تحويل إلى ' + bene.name),
        tags: (f.tags || []).slice(), date: f.date,
        created: origCreated
      };
      if (wasEdit){
        const idx = S.transactions.findIndex(x => x.id === f.id);
        if (idx < 0) return false;
        S.transactions[idx] = data;
      } else {
        S.transactions.push(data);
      }
      removeLinkedRepaymentFees(newId);
    } else {
      const data = {
        id: newId, type: 'transfer',
        fromAccountId: fromAcc.id, fromAmount: fromAmt, fromCurrency: fromCur,
        fromCountry: fromAcc.country,
        toAccountId: targetAcc.id, toAmount, toCurrency: toCur, toCountry: targetAcc.country,
        fxRate, fee: feeForTransfer,
        note: (f.note || '').trim() || (isRepayment ? ('سداد ' + (targetAcc.type === 'credit' ? 'بطاقة' : 'دين')) : ''),
        tags: (f.tags || []).slice(), date: f.date,
        created: origCreated
      };
      if (wasEdit){
        const idx = S.transactions.findIndex(x => x.id === f.id);
        if (idx < 0) return false;
        S.transactions[idx] = data;
      } else {
        S.transactions.push(data);
      }
      if (isRepayment){
        syncLinkedRepaymentFee(newId, feeForExpense, fromAcc, f.date);
      } else {
        removeLinkedRepaymentFees(newId);
      }
    }
    /* V8.8.4.9 FIX 4: prepaid source must not go negative AFTER principal + fee. */
    if (fromAcc && fromAcc.type === 'prepaid'){
      try {
        const newBal = Finance.accountBalance(fromAcc.id);
        if (newBal < -0.01){
          _lastMutationError = 'prepaid-insufficient';
          return false;
        }
      } catch(_){
        _lastMutationError = 'prepaid-insufficient';
        return false;
      }
    }
    return true;
  });
  if (!result.ok){
    render();
    if (_lastMutationError === 'prepaid-insufficient'){
      _lastMutationError = null;
      toast('الرصيد غير كافٍ في البطاقة/الحساب المدفوع مقدمًا');
      return;
    }
    toast(result.reason === 'write-failed' || result.reason === 'verify-failed' ? 'فشل الحفظ — تم التراجع' : 'تعذر الحفظ');
    return;
  }
  /* V8.8.4.11: ALWAYS reevaluate source country/month (own transfer fee is spending too).

  const ctxSet = new Set();
  if (oldTxSnapshot){
    const oldCtx = budgetContextForTransaction(oldTxSnapshot);
    if (oldCtx) ctxSet.add(oldCtx.country + '|' + oldCtx.month);
  }
  const newCtx = budgetContextForTransaction({type: 'transfer', fromAccountId: fromAcc.id, date: f.date});

  return true;
}

function setRepaymentSource(id){
  if (!S.form || S.form._sheet !== 'repayment') return;
  const fromW = Finance.getAccount(id);
  if (!fromW) return;
  const oldFromW = S.form.fromId ? Finance.getAccount(S.form.fromId) : null;
  const oldCur = oldFromW ? oldFromW.currency : null;
  const newCur = fromW.currency;
  const target = Finance.getAccount(S.form.targetId);
  const targetCur = target ? target.currency : null;

  /* V8.8.4.8: preserve TARGET debt amount across source-currency change */
  if (oldCur && newCur && oldCur !== newCur && targetCur){
    const oldPrincipal = parseFloat(S.form.principal) || 0;
    const oldRate = Number(S.form.rate) || Finance.suggestRate(oldCur, targetCur);
    const targetValue = oldPrincipal * oldRate;
    const newRate = Finance.suggestRate(newCur, targetCur);
    if (newRate > 0 && isFinite(targetValue) && targetValue > 0){
      S.form.fromId = id;
      S.form.rate = newRate;
      S.form.principal = String(Math.round((targetValue / newRate) * 100) / 100);
      /* Fee is denominated in source currency — cannot reinterpret; clear it. */
      S.form.fee = '';
    } else {
      /* Safe preservation not possible → clear and require re-entry. */
      S.form.fromId = id;
      S.form.rate = newRate || 0;
      S.form.principal = '';
      S.form.fee = '';
    }
  } else {
    S.form.fromId = id;
    if (target && fromW.currency !== target.currency){
      S.form.rate = Finance.suggestRate(fromW.currency, target.currency);
    } else S.form.rate = 1;
  }
  renderRepaymentEditor();
}

      S.form = {_sheet:'repayment', id:t.id};
      await delRepayment();
      return;
    }
  }
  if (t.type === 'adjustment'){
    const ok = await dialog({emoji:'⚠️', title:'حذف تسوية', msg:'التسوية تؤثر على رصيد الحساب.', okText:'حذف التسوية'});
    if (!ok) return;
  } else {
    const ok = await dialog({emoji:'🗑', title:'حذف المعاملة', msg:'سيتم حذفها نهائياً', okText:'حذف'});
    if (!ok) return;
  }
  const result = await commitCriticalMutation(async () => {
    removeLinkedRepaymentFees(id);
    S.transactions = S.transactions.filter(x => x.id !== id);
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  /* V9.0.1: remove V9 attachments and family-share references only AFTER the financial delete is durable. */
  try {
    const rec = await SanadExtStorage.getReceipt(id);
    if (rec){ await SanadExtStorage.delReceipt(id); await SanadCloud.markReceiptDirty(id,true); }
    if (SanadFamily && SanadFamily.isShared(id)) await SanadFamily.setShared(id,false);
  } catch(e){ console.warn('V9 post-delete cleanup',e); }
  /* V8.8.4.3 FIX 13: recompute budget alerts after deletion */
  try {
    if (t.type === 'expense'){
      const acc = Finance.getAccount(t.accountId);
      if (acc) await runBudgetAlerts(acc.country, (t.date || isoToday()).slice(0,7));
    } else if (t.type === 'external_transfer'){
      const acc = Finance.getAccount(t.fromAccountId);
      if (acc) await runBudgetAlerts(acc.country, (t.date || isoToday()).slice(0,7));
    } else if (t.type === 'transfer'){
      const fromAcc = t.fromAccountId ? Finance.getAccount(t.fromAccountId) : null;
      const toAcc = t.toAccountId ? Finance.getAccount(t.toAccountId) : null;
      const targetCountry = fromAcc ? fromAcc.country : (toAcc ? toAcc.country : null);
      if (targetCountry) await runBudgetAlerts(targetCountry, (t.date || isoToday()).slice(0,7));
    }
  } catch(_){}
  closeSheet(); render();
  toast('تم الحذف');
}

    const isCross = fromAcc && toAcc && fromAcc.country !== toAcc.country;

    rows.push(['من', fromAcc ? fromAcc.name : '—']);
    if (fromAcc) rows.push(['من بلد', countryInfo(fromAcc.country).flag + ' ' + countryInfo(fromAcc.country).name]);
    rows.push(['إلى', toAcc ? toAcc.name : '—']);

    rows.push(moneyRow('المبلغ المرسل', t.fromAmount, t.fromCurrency));
    if (t.fromCurrency !== t.toCurrency){
      rows.push(moneyRow('المبلغ الواصل', t.toAmount, t.toCurrency));

    if (linkedFee) rows.push(moneyRow('فوائد / رسوم', linkedFee.amount, linkedFee.currency));
    else if (Number(t.fee) > 0) rows.push(moneyRow('الرسوم', t.fee, t.fromCurrency));
    rows.push(['التاريخ', t.date]);
    if (t.note) rows.push(['ملاحظة', t.note]);
  } else if (t.type === 'external_transfer'){
    const fromAcc = Finance.getAccount(t.fromAccountId);
    const b = Finance.getBeneficiary(t.beneficiaryId);
    rows.push(['النوع','تحويل لشخص']);
    rows.push(['إلى', b ? b.name : '—']);
    if (b) rows.push(['البلد', countryInfo(b.country).flag + ' ' + countryInfo(b.country).name]);
    rows.push(['من', fromAcc ? fromAcc.name : '—']);
    rows.push(moneyRow('أرسلت', t.fromAmount, t.fromCurrency));
    if(t.receivedAmountKnown===false)rows.push(['مبلغ الوصول','غير مذكور في رسالة الخصم']);
    else if (t.fromCurrency !== t.receivedCurrency){
      rows.push(moneyRow('وصل', t.receivedAmount, t.receivedCurrency));
      rows.push(['السعر', hide ? '•••' : ('1 ' + Finance.curSymbol(t.fromCurrency) + ' = ' + fmt(t.fxRate) + ' ' + Finance.curSymbol(t.receivedCurrency))]);
    }
    if (Number(t.fee) > 0) rows.push(moneyRow('الرسوم', t.fee, t.fromCurrency));
    rows.push(['التاريخ', t.date]);
    if (t.note) rows.push(['ملاحظة', t.note]);
  } else {
    const c = Finance.getCat(t.type, t.cat);
    const acc = Finance.getAccount(t.accountId);
    const inst = t.instrumentId ? Finance.getInstrument(t.instrumentId) : null;
    rows.push(['النوع', t.type === 'income' ? 'دخل' : (t.linkedTransferId ? 'فوائد سداد' : 'مصروف')]);
    rows.push(moneyRow('المبلغ', t.amount, t.currency));
    rows.push(['الفئة', c.i + ' ' + c.n]);
    rows.push(['الحساب', acc ? acc.name : '—']);
    if (acc) rows.push(['البلد', countryInfo(acc.country).flag + ' ' + countryInfo(acc.country).name]);
    if (inst) rows.push(['البطاقة', inst.name + (inst.last4 ? ' ••' + inst.last4 : '')]);
    if (t.merchantName) rows.push(['التاجر', t.merchantName]);
    rows.push(['التاريخ', t.date]);
    if (t.rec) rows.push(['متكرر','🔁']);
    if (t.note) rows.push(['ملاحظة', t.note]);
  }
  const rowsHtml = rows.map(([k,v]) =>
    '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--outline)">' +
      '<span style="font-size:12.5px;color:var(--text-2)">' + esc(k) + '</span>' +
      '<span style="font-size:14px;font-weight:500;text-align:end">' + esc(v) + '</span></div>').join('');
  const canEdit = t.type !== 'adjustment';
  openSheet(
    '<div class="sheet-head"><button type="button" class="close" data-act="close-sheet">✕</button>' +
      '<h2>تفاصيل المعاملة</h2><div style="width:36px"></div></div>' +

      '<button type="button" class="btn danger" data-act="delete-from-details" data-id="' + t.id + '" style="margin-top:8px">🗑 حذف</button>' +

async function saveBene(id){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const name = (document.getElementById('beneName').value || '').trim();
  const country = document.getElementById('beneCountry').value || S.activeCountry;
  const cur = document.getElementById('beneCur').value;
  const note = (document.getElementById('beneNote').value || '').trim();
  if (!name){ toast('أدخل الاسم'); return; }
  let newBeneId = id;
  const result = await commitCriticalMutation(async () => {
    if (id){
      const b = Finance.getBeneficiary(id);
      if (b) Object.assign(b, {name, country, defaultCurrency:cur, note});
    } else {
      newBeneId = uid('bene');
      S.beneficiaries.push({id: newBeneId, name, country, defaultCurrency:cur, note,
        type:'person', archived:false, created: isoToday()});
    }
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  /* V8.8.4.3 FIX 5: restore transfer draft & select new beneficiary (only for add flow) */
  if (_benePreservedTransferForm && !id){
    const preserved = _benePreservedTransferForm;
    _benePreservedTransferForm = null;
    if (newBeneId){
      preserved.beneficiaryId = newBeneId;
      preserved._destType = 'external';
      const b = Finance.getBeneficiary(newBeneId);
      const fromW = Finance.getAccount(preserved.fromAccountId);
      if (b && fromW){
        preserved.fxRate = Finance.suggestRate(fromW.currency, b.defaultCurrency);
        preserved._destCountry = b.country;
      }
      S.form = preserved;
      closeSheet();
      setTimeout(() => renderTransferSheet(), 300);
      toast('تم حفظ الشخص — أكمل التحويل');
      return;
    }
  }
  closeSheet();
  toast(id ? 'تم التعديل' : 'تمت الإضافة');
}
async function delBene(id){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const hasTx = S.transactions.some(t => t.beneficiaryId === id);
  if (hasTx){
    const ok = await dialog({emoji:'📦', title:'أرشفة بدلاً من الحذف',

    const result = await commitCriticalMutation(async () => {
      const b = Finance.getBeneficiary(id);
      if (b) b.archived = true;
      return true;
    });
    if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
    closeSheet(); render(); toast('تم الأرشفة'); return;

  const result = await commitCriticalMutation(async () => {

  closeSheet(); render(); toast('تم الحذف');
}

function sameAccountSourceForMerge(a,b){
  if(!a||!b)return false;
  if(a.institutionId&&b.institutionId&&a.institutionId===b.institutionId)return true;
  const ai=a.institutionId?Finance.getInstitution(a.institutionId):null;
  const bi=b.institutionId?Finance.getInstitution(b.institutionId):null;
  if(!ai||!bi)return false;
  const ab=Finance.registeredBankId(ai),bb=Finance.registeredBankId(bi);
  if(ab&&bb)return ab===bb;
  const ap=Finance.registeredProviderId(ai),bp=Finance.registeredProviderId(bi);
  if(ap&&bp)return ap===bp;
  return false;
}
function accountMergeCandidates(sourceId){
  const source=Finance.getAccount(sourceId);
  if(!source||source.archived||!['bank','ewallet'].includes(source.type))return [];
  return S.accounts.filter(target=>{
    if(!target||target.id===source.id||target.archived)return false;
    if(target.type!==source.type||target.country!==source.country||target.currency!==source.currency)return false;
    if(!sameAccountSourceForMerge(source,target))return false;
    const direct=S.transactions.some(t=>t&&t.type==='transfer'&&(
      (t.fromAccountId===source.id&&t.toAccountId===target.id)||
      (t.fromAccountId===target.id&&t.toAccountId===source.id)
    ));
    return !direct;
  });
}
function accountIdentityLabel(account){
  const refs=accountBankRefsText(account);
  const inst=account&&account.institutionId?Finance.getInstitution(account.institutionId):null;
  return (inst?inst.name+' · ':'')+(account?account.name:'')+(refs?' · '+refs:'');
}
function openDuplicateAccountMerge(sourceId){
  const source=Finance.getAccount(sourceId),candidates=accountMergeCandidates(sourceId);
  if(!source||!candidates.length){toast('لا يوجد حساب مطابق آمن للدمج');return;}
  const options=candidates.map(x=>
    '<option value="'+esc(x.id)+'">'+esc(accountIdentityLabel(x)+' · '+amtFull(Finance.accountBalance(x.id),x.currency))+'</option>'
  ).join('');
  openSheet(
    '<div class="sheet-head"><button type="button" class="close" data-act="close-sheet">✕</button><h2>دمج حساب مكرر</h2><div style="width:36px"></div></div>'+
    '<div class="sheet-body">'+
      '<div class="help-box warn"><span class="hi">🧩</span><div class="ht"><b>اختر الحساب الصحيح الذي سيبقى</b>سينقل SANAD المعاملات والبطاقات والمراجع إلى الحساب المختار ويعيد الحساب. لن يجمع opening balances تلقائيًا حتى لا يضاعف الرصيد.</div></div>'+
      '<div class="field"><label>الحساب الحالي المراد دمجه</label><div style="padding:10px;border:1px solid var(--border);border-radius:12px"><b>'+esc(accountIdentityLabel(source))+'</b><div class="amt-val" style="margin-top:5px">'+amtFull(Finance.accountBalance(source.id),source.currency)+'</div></div></div>'+
      '<div class="field"><label>ادمجه داخل</label><select id="accountMergeTarget">'+options+'</select></div>'+
      '<button type="button" class="btn primary" data-act="confirm-merge-account" data-id="'+esc(source.id)+'">دمج وإعادة الحساب</button>'+
    '</div>',
    'account-merge'
  );
}
async function confirmDuplicateAccountMerge(sourceId){
  if(!canWrite()){toast('وضع القراءة فقط');return;}
  const targetEl=document.getElementById('accountMergeTarget'),targetId=targetEl?targetEl.value:'';
  if(!targetId||!accountMergeCandidates(sourceId).some(x=>x.id===targetId)){toast('اختر حسابًا صالحًا للدمج');return;}
  const source=Finance.getAccount(sourceId),target=Finance.getAccount(targetId);
  if(!source||!target)return;
  const ok=await dialog({
    emoji:'🧩',title:'تأكيد دمج الحساب',
    msg:'سيتم دمج '+source.name+' داخل '+target.name+'. المعاملات والبطاقات ستنتقل للحساب الصحيح، والنسخة المكررة ستُحذف.',
    okText:'دمج'
  });
  if(!ok)return;
  showFinancialRecalcOverlay('جاري دمج الحساب وإعادة الحساب');
  await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,20)));
  const result=await commitCriticalMutation(async()=>{
    const merged=BankIngestionCore.mergeDuplicateAccount(S,sourceId,targetId);
    if(!merged.ok)return false;
    Finance.ensureAllPrimaries();
    return true;
  });
  hideFinancialRecalcOverlay();
  if(!result.ok){render();toast('تعذر الدمج — لم يتم تغيير البيانات');return;}
  closeSheet();render();toast('تم دمج الحساب المكرر وإعادة الحساب');
}

function openAccountSheet(id, presetType, preserve){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const isEdit = !!id;
  const a = isEdit ? Finance.getAccount(id) : null;
  const type = presetType || (a ? a.type : 'bank');
  if (!isEdit && type === 'cash'){ toast('الكاش غير متاح حالياً'); return; }
  if (type === 'credit'){ toast('بطاقات الائتمان تُنشأ من قسم البطاقات'); return; }
  const typeDef = accountTypeInfo(type);
  const country = preserve && preserve.country ? preserve.country : (a ? a.country : S.activeCountry);
  const data = a ? {...a} : {
    id:null, institutionId:null, country, name:'', type,
    currency: countryInfo(country).defaultCur || 'AED',
    openingBalance:0, openingDebt:0, creditLimit:0,
    defaultRepaymentAccountId:null,
    icon: typeDef.icon, color:'#00695C', archived:false

  if (preserve){
    if (preserve.name != null) data.name = preserve.name;

    if (preserve.i) data.icon = preserve.i;
    if (preserve.c) data.color = preserve.c;

async function saveAccount(id){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const name = (document.getElementById('wName').value || '').trim();
  const typeEl = document.getElementById('wType');
  let type = typeEl.value;
  const curEl = document.getElementById('wCur');
  const cur = curEl.disabled ? (Finance.getAccount(id) || {}).currency : curEl.value;
  const country = document.getElementById('wCountry').value || S.activeCountry;
  const i = document.getElementById('wIco').value || '🏦';
  const c = document.getElementById('wCol').value || '#00695C';
  const bankRefs = parseBankRefsInput((document.getElementById('wBankRefs') || {}).value || '');
  if (!name){ toast('أدخل اسم الحساب'); return; }
  if (type === 'credit'){ toast('بطاقات الائتمان تُنشأ من قسم البطاقات'); return; }
  if (id && hasLinkedDebitCards(id)){
    type = 'bank';
  }
  const typeDef = accountTypeInfo(type);
  const isLiab = !typeDef.asset;
  const isDebt = type === 'debt';
  let openingBalance = 0, openingDebt = 0, creditor = '', dueDate = null;
  let cashFundingMode='existing', cashFundingSourceId=null;
  const balEl = document.getElementById('wBalance');
  if (balEl && !balEl.disabled) openingBalance = parseFloat(balEl.value) || 0;
  if(!id && type==='cash'){
    const fm=document.getElementById('cashFundingMode'), fs=document.getElementById('cashFundingSource');
    cashFundingMode=fm?fm.value:'existing'; cashFundingSourceId=fs?(fs.value||null):null;
    if(cashFundingMode==='transfer'){
      const src=Finance.getAccount(cashFundingSourceId);
      if(!src||src.archived||isLiabilityAccount(src)){toast('اختر حساب تمويل صالح');return;}
      if(src.currency!==cur){toast('تمويل الكاش الأول يجب أن يكون من حساب بنفس العملة');return;}
      if(openingBalance<=0){toast('أدخل مبلغ الكاش');return;}
      if(Finance.accountBalance(src.id)+0.001<openingBalance){toast('رصيد حساب التمويل غير كافٍ');return;}
    }
  }
  const debtEl = document.getElementById('wDebt');
  if (debtEl && !debtEl.disabled) openingDebt = parseFloat(debtEl.value) || 0;
  /* V8.8.4.11: negative opening balance is only forbidden for prepaid (stored-value).
     Bank/cash/ewallet/other keep their existing overdraft-free policy.
     Debt opening value must still be non-negative. */
  if (type === 'prepaid' && openingBalance < -0.01){
    toast('الرصيد الافتتاحي للمدفوع مقدمًا لا يمكن أن يكون سالبًا');
    return;
  }
  if (isDebt && openingDebt < -0.01){
    toast('قيمة الدين لا يمكن أن تكون سالبة');
    return;
  }
  const credEl = document.getElementById('wCreditor');
  if (credEl) creditor = (credEl.value || '').trim();
  const dueEl = document.getElementById('wDueDate');
  if (dueEl) dueDate = dueEl.value || null;
  const shouldBeDefault = !!S.form._accountDefaultToggle;
  const shouldBePrimary = !!S.form._accountPrimaryToggle;
  if (id){
    const a = Finance.getAccount(id);
    if (!a) return;
    const hasTx = hasAccountHistory(id);
    const hasDebit = hasLinkedDebitCards(id);
    if (hasTx && cur !== a.currency){ toast('لا يمكن تغيير العملة — بالحساب معاملات'); return; }
    if (hasTx && country !== a.country){ toast('لا يمكن تغيير البلد — بالحساب معاملات'); return; }
    if (hasTx && isLiabilityAccount(a) !== isLiab){ toast('لا يمكن تغيير نوع الحساب'); return; }
    if (hasDebit && type !== 'bank'){ toast('لا يمكن تغيير النوع — بالحساب بطاقة ديبت مرتبطة'); return; }
  }
  let savedId = id;
  const accountNeedsRecalc = !!(id && hasAccountHistory(id));
  if(accountNeedsRecalc){
    showFinancialRecalcOverlay('جاري تحديث الحساب وإعادة الحساب');
    await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,20)));
  }
  const result = await commitCriticalMutation(async () => {
    let institutionId = null;
    const instEl = document.getElementById('wInst');
    institutionId = instEl ? (instEl.value || null) : null;
    const officialEl = document.getElementById('wBankRegistry');
    const officialBankId = officialEl && country === 'UAE' && type !== 'ewallet' ? (officialEl.value || null) : null;
    const providerEl = document.getElementById('wProviderRegistry');
    const officialProviderId = providerEl && country === 'UAE' && type === 'ewallet' ? (providerEl.value || null) : null;
    const newInstName = ((document.getElementById('wInstName') || {}).value || '').trim();
    if (officialProviderId) institutionId = Finance.ensureRegisteredProvider(officialProviderId, country);
    else if (officialBankId) institutionId = Finance.ensureRegisteredBank(officialBankId, country);
    else if (newInstName) institutionId = Finance.ensureInstitution(newInstName, country, type === 'ewallet' ? 'wallet_provider' : 'bank');
    if (institutionId){
      const inst = Finance.getInstitution(institutionId);
      if (inst && inst.country !== country){ institutionId = null; }
    }
    if (id){
      const a = Finance.getAccount(id);
      const hasTx = hasAccountHistory(id);
      a.name = name; a.type = type;
      a.currency = hasTx ? a.currency : cur;
      a.country = country;
      const relinkInstitution=BankIngestionCore.rebindAccountInstitution(S,id,institutionId);
      if(!relinkInstitution.ok)return false;
      a.bankRefs = bankRefs.slice();
      if (bankRefs.length === 1) a.bankRef = bankRefs[0]; else delete a.bankRef;
      a.icon = i; a.color = c;
      FinanceCore.setOpeningBalance(a,openingBalance);
      if (isLiab) a.openingDebt = openingDebt;
      if (isDebt){ a.creditor = creditor; a.dueDate = dueDate; }
    } else {
      savedId = uid('a');
      S.accounts.push({
        id: savedId, institutionId, country, name, type, currency: cur,
        openingBalance: (type==='cash'&&cashFundingMode==='transfer') ? 0 : openingBalance, openingDebt, creditLimit: 0,
        defaultRepaymentAccountId: null,
        bankRefs: bankRefs.slice(),
        icon: i, color: c, archived: false,
        creditor: isDebt ? creditor : '',
        dueDate: isDebt ? dueDate : null,
        created: isoToday()
      });
      if(type==='cash'&&cashFundingMode==='transfer'&&cashFundingSourceId&&openingBalance>0){
        const src=Finance.getAccount(cashFundingSourceId);
        S.transactions.push({id:uid('t'),type:'transfer',fromAccountId:src.id,fromAmount:openingBalance,fromCurrency:src.currency,fromCountry:src.country,toAccountId:savedId,toAmount:openingBalance,toCurrency:cur,toCountry:country,fxRate:1,fee:0,note:'',tags:[],date:isoToday(),created:Date.now()});
      }
    }
    /* V8.8.4.3 FIX 12: Default and Primary managed independently */
    if (typeDef.asset && !isLiab){
      if (shouldBeDefault){
        S.settings.defaultAccountByCountry[country] = savedId;
      } else if (S.settings.defaultAccountByCountry[country] === savedId){
        delete S.settings.defaultAccountByCountry[country];
      }
      if (shouldBePrimary){
        S.settings.primaryAccountByCountry[country] = savedId;
      } else if (S.settings.primaryAccountByCountry[country] === savedId){
        delete S.settings.primaryAccountByCountry[country];
      }
    }
    Finance.ensureAllPrimaries();
    return true;
  });
  hideFinancialRecalcOverlay();
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast(accountNeedsRecalc ? 'تم التعديل وإعادة الحساب' : (id ? 'تم التعديل' : 'تمت الإضافة'));
}
async function archiveAccount(id){
  if (!canWrite()){ return; }
  const a = Finance.getAccount(id);
  if (!a) return;

  /* V8.8.4.9 FIX 2a: prepaid-owned accounts must be archived via their instrument */
  if (a.ownedByInstrumentId){
    const ownerInst = Finance.getInstrument(a.ownedByInstrumentId);
    await dialog({
      emoji:'ℹ️',
      title:'هذا الحساب مرتبط ببطاقة مدفوعة مقدمًا',
      msg: ownerInst
        ? 'لا يمكن أرشفته مباشرة. أرشِف البطاقة "' + ownerInst.name + '" من قسم البطاقات.'
        : 'لا يمكن أرشفته مباشرة. أرشِف البطاقة المرتبطة به.',
      okText:'حسناً', primary:true, hideCancel:true
    });
    return;
  }

  /* V8.8.4.10 FIX 4: guard against malformed/legacy liability states too. */
  const rawBal = Finance.accountBalance(a.id);
  if (isLiabilityAccount(a)){
    if (rawBal < -0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة الحساب',
        msg:'عليه مديونية ' + amtFull(-rawBal, a.currency) + '. سدّدها أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
    if (rawBal > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة الحساب',
        msg:'عليه رصيد موجب ' + amtFull(rawBal, a.currency) + '. سوِّ الحساب أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  } else {
    if (Math.abs(rawBal) > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة الحساب',
        msg:'باقي فيه ' + amtFull(Math.abs(rawBal), a.currency) + '. الأرشفة ستخفي هذا المبلغ من الحسابات النشطة.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }

  const ok = await dialog({emoji:'📦', title:'أرشفة الحساب', msg:'سيختفي من الإدخال الجديد، لكن معاملاته تبقى.', okText:'أرشفة', primary:true});
  if (!ok) return;
  const result = await commitCriticalMutation(async () => {
    a.archived = true;
    if (S.settings.defaultAccountByCountry[a.country] === id){
      delete S.settings.defaultAccountByCountry[a.country];
      const fallback = S.accounts.find(x => x.country === a.country && !x.archived && isAssetAccount(x) && !x.ownedByInstrumentId && x.id !== id);
      if (fallback) S.settings.defaultAccountByCountry[a.country] = fallback.id;
    }
    if (S.settings.primaryAccountByCountry[a.country] === id){
      const fallback = S.accounts.find(x => x.country === a.country && !x.archived && isAssetAccount(x) && !x.ownedByInstrumentId && x.id !== id);
      if (fallback) S.settings.primaryAccountByCountry[a.country] = fallback.id;
      else delete S.settings.primaryAccountByCountry[a.country];
    }
    S.paymentInstruments.forEach(inst => {
      if (inst.accountId !== id) return;
      if (inst.type === 'credit_card' || inst.type === 'prepaid_card'){
        inst.archived = true;
      }
      if (S.settings.defaultInstrumentByCountry[a.country] === inst.id){
        delete S.settings.defaultInstrumentByCountry[a.country];
      }
    });
    /* V8.8.4.9 FIX 3: pause recurring rules tied to this account OR any of its instruments */
    const linkedInstIds = S.paymentInstruments
      .filter(i => i.accountId === id)
      .map(i => i.id);
    S.recurring.forEach(r => {
      if (r.accountId === id){ r.active = false; return; }
      if (r.instrumentId && linkedInstIds.indexOf(r.instrumentId) !== -1){ r.active = false; }
    });
    if (S.repAccountId === id) S.repAccountId = null;
    Finance.ensureAllPrimaries();
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الأرشفة');
}
async function unarchiveAccount(id){
  if (!canWrite()){ return; }
  const a = Finance.getAccount(id);
  if (!a) return;
  const result = await commitCriticalMutation(async () => {
    a.archived = false;
    S.paymentInstruments.forEach(inst => {
      if (inst.accountId !== id) return;
      if (inst.type === 'credit_card' || inst.type === 'prepaid_card'){
        inst.archived = false;
      }
    });
    /* V8.8.4.8: invariant — active credit cards ⇒ backing account active. */
    if (a.type === 'credit'){
      const linked = S.paymentInstruments.filter(i => i.accountId === id && i.type === 'credit_card');
      const anyActive = linked.some(i => !i.archived);
      if (anyActive) a.archived = false;
    }
    Finance.ensurePrimary(a.country);
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الاسترجاع');
}
async function delAccount(id){
  if (!canWrite()){ return; }
  const a = Finance.getAccount(id);
  if (!a) return;
  const hasRefs = hasAccountHistory(id) || S.paymentInstruments.some(i => i.accountId === id);
  if (hasRefs){ toast('لا يمكن حذف حساب فيه بيانات — استخدم الأرشفة'); return; }

  /* V8.8.4.10 FIX 4: guard against malformed/legacy liability states too.
     Never delete any account with a non-zero raw balance. */
  const rawBal = Finance.accountBalance(a.id);
  if (isLiabilityAccount(a)){
    if (rawBal < -0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن حذف الحساب',
        msg:'عليه مديونية ' + amtFull(-rawBal, a.currency) + '. سدّدها أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
    if (rawBal > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن حذف الحساب',
        msg:'عليه رصيد موجب ' + amtFull(rawBal, a.currency) + '. سوِّ الحساب أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  } else {
    if (Math.abs(rawBal) > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن حذف الحساب',
        msg:'باقي فيه ' + amtFull(Math.abs(rawBal), a.currency) + '. لا يمكن حذف حساب فيه رصيد.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }

  const ok = await dialog({emoji:'🗑', title:'حذف الحساب', msg:'سيتم الحذف نهائياً', okText:'حذف'});
  if (!ok) return;
  const result = await commitCriticalMutation(async () => {
    S.accounts = S.accounts.filter(x => x.id !== id);
    if (S.settings.defaultAccountByCountry[a.country] === id){
      const fallback = S.accounts.find(x => x.country === a.country && !x.archived && isAssetAccount(x) && !x.ownedByInstrumentId);
      if (fallback){
        S.settings.defaultAccountByCountry[a.country] = fallback.id;
      } else {
        delete S.settings.defaultAccountByCountry[a.country];
      }
    }
    if (S.settings.primaryAccountByCountry[a.country] === id){
      const fallback = S.accounts.find(x => x.country === a.country && !x.archived && isAssetAccount(x) && !x.ownedByInstrumentId);
      if (fallback) S.settings.primaryAccountByCountry[a.country] = fallback.id;
      else delete S.settings.primaryAccountByCountry[a.country];
    }
    if (S.repAccountId === id) S.repAccountId = null;
    Finance.ensureAllPrimaries();
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الحذف');
}

function openPayLiability(walletId){
  if (!canWrite()){ return; }
  const target = Finance.getAccount(walletId);
  if (!target || !isLiabilityAccount(target)){ toast('حساب غير صالح'); return; }
  const sourceAccounts = S.accounts.filter(w => !w.archived && isAssetAccount(w) && !w.ownedByInstrumentId);
  if (!sourceAccounts.length){ toast('أضف حساباً أولاً للسداد'); return; }
  const debt = Finance.accountDebt(target.id);
  const targetCur = target.currency;
  let defaultFrom = null;
  if (target.defaultRepaymentAccountId){
    const def = sourceAccounts.find(x => x.id === target.defaultRepaymentAccountId && !x.archived);
    if (def) defaultFrom = def;
  }
  if (!defaultFrom){
    const defAccId = Finance.getDefaultAccountId(target.country);
    if (defAccId){
      const defAcc = sourceAccounts.find(x => x.id === defAccId);
      if (defAcc) defaultFrom = defAcc;
    }
  }
  if (!defaultFrom) defaultFrom = sourceAccounts.find(x => x.country === target.country);
  if (!defaultFrom) defaultFrom = sourceAccounts[0];
  S.form = S.form || {};
  S.form._sheet = 'pay';
  S.form._pay = {targetId:target.id, fromId:defaultFrom.id, sourceAmount:'', rate:0, fee:'', note:''};
  const pay = S.form._pay;
  const fromW = Finance.getAccount(pay.fromId);
  pay.rate = Finance.suggestRate(fromW.currency, targetCur);
  if (fromW.currency === targetCur) pay.sourceAmount = String(debt);
  else {
    const rate = pay.rate || 1;
    pay.sourceAmount = String(Math.round((debt / rate) * 100) / 100);
  }
  renderPaySheet();
}

async function savePayLiability(){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const pay = S.form._pay;
  if (!pay) return;
  const target = Finance.getAccount(pay.targetId);
  const fromW = Finance.getAccount(pay.fromId);
  if (!target || !fromW){ toast('بيانات ناقصة'); return; }
  const fromCur = fromW.currency;
  const targetCur = target.currency;
  const sameCur = fromCur === targetCur;
  const fromAmt = parseFloat(document.getElementById('payAmount').value);
  if (!fromAmt || fromAmt <= 0){ toast('أدخل مبلغاً'); return; }
  let rate = 1;
  let toAmount = fromAmt;
  if (!sameCur){
    const rateEl = document.getElementById('payRate');
    rate = rateEl ? parseFloat(rateEl.value) : 0;
    if (!rate || rate <= 0){ toast('أدخل سعر تحويل صحيح'); return; }
    toAmount = Math.round(fromAmt * rate * 100) / 100;
    // FX memory is persisted inside the critical mutation.
  }
  const debt = Finance.accountDebt(target.id);
  if (toAmount > debt + 0.01){
    await dialog({emoji:'⚠️', title:'المبلغ أكبر من المديونية',
      msg:'أقصى مبلغ للسداد هو ' + amtFull(debt, targetCur) + '.',
      okText:'حسناً', primary:true, hideCancel:true});
    return;
  }
  const feeEl = document.getElementById('payFee');
  const fee = feeEl ? Math.max(0, parseFloat(feeEl.value) || 0) : 0;
  const noteEl = document.getElementById('payNote');
  const note = noteEl ? noteEl.value : '';
  const newTransferId = uid('t');
  const today = isoToday();
  const result = await commitCriticalMutation(async () => {
    if (!sameCur) Finance.rememberRate(fromCur, targetCur, rate);
    S.transactions.push({
      id: newTransferId, type:'transfer',
      fromAccountId: fromW.id, fromAmount: fromAmt, fromCurrency: fromCur, fromCountry: fromW.country,
      toAccountId: target.id, toAmount, toCurrency: targetCur, toCountry: target.country,
      fxRate: rate, fee: 0,
      note: note || ('سداد ' + (target.type === 'credit' ? 'بطاقة' : 'دين')),
      tags: ['سداد'], date: today, created: Date.now()
    });
    syncLinkedRepaymentFee(newTransferId, fee, fromW, today);
    /* V8.8.4.9 FIX 4: prepaid source must not go negative. */
    if (fromW && fromW.type === 'prepaid'){
      try {
        const newBal = Finance.accountBalance(fromW.id);
        if (newBal < -0.01){
          _lastMutationError = 'prepaid-insufficient';
          return false;
        }
      } catch(_){
        _lastMutationError = 'prepaid-insufficient';
        return false;
      }
    }
    return true;
  });
  if (!result.ok){
    render();
    if (_lastMutationError === 'prepaid-insufficient'){
      _lastMutationError = null;
      toast('الرصيد غير كافٍ في البطاقة/الحساب المدفوع مقدمًا');
      return;
    }
    toast(result.reason === 'write-failed' || result.reason === 'verify-failed' ? 'فشل الحفظ — تم التراجع' : 'تعذر الحفظ');
    return;
  }
  /* V8.8.4.11: always reevaluate source country/month (harmless when fee = 0). */
  const newCtx = budgetContextForTransaction({type: 'transfer', fromAccountId: fromW.id, date: today});
  if (newCtx){
    const a = await runBudgetAlerts(newCtx.country, newCtx.month);
    if (a && a.length) S.activeBudgetAlerts = a;
  }
  S.form._pay = null;
  closeSheet(); render();
  toast('تم السداد');
  setTimeout(showBudgetAlertsIfAny, 400);
}

/* ---------- CARD SHEET ---------- */
function sameCardSourceForMerge(a,b){
  if(!a||!b)return false;
  const aa=Finance.getAccount(a.accountId),ba=Finance.getAccount(b.accountId);
  const ai=(a.institutionId||(aa&&aa.institutionId))?Finance.getInstitution(a.institutionId||(aa&&aa.institutionId)):null;
  const bi=(b.institutionId||(ba&&ba.institutionId))?Finance.getInstitution(b.institutionId||(ba&&ba.institutionId)):null;
  if(!ai||!bi)return false;
  if(ai.id===bi.id)return true;
  const ab=Finance.registeredBankId(ai),bb=Finance.registeredBankId(bi);
  if(ab&&bb)return ab===bb;
  const ap=Finance.registeredProviderId(ai),bp=Finance.registeredProviderId(bi);
  if(ap&&bp)return ap===bp;
  return false;
}
function cardIdentityOverlapForMerge(a,b){
  return !!(BankIngestionCore.cardIdentityCompatible&&BankIngestionCore.cardIdentityCompatible(a,b));
}
function duplicateCardMergeCandidates(sourceId){
  const source=Finance.getInstrument(sourceId);
  if(!source||source.archived)return [];
  const sourceAcc=Finance.getAccount(source.accountId);
  if(!sourceAcc)return [];
  return S.paymentInstruments.filter(target=>{
    if(!target||target.id===source.id||target.archived||target.type!==source.type||target.country!==source.country)return false;
    const targetAcc=Finance.getAccount(target.accountId);
    if(!targetAcc||targetAcc.archived||targetAcc.currency!==sourceAcc.currency)return false;
    if(['debit_card','wallet_card'].includes(source.type)&&targetAcc.id!==sourceAcc.id)return false;
    if(!sameCardSourceForMerge(source,target))return false;
    if(!cardIdentityOverlapForMerge(source,target))return false;
    if(source.network&&target.network&&source.network!=='other'&&target.network!=='other'&&source.network!==target.network)return false;
    return true;
  });
}
function openDuplicateCardMerge(sourceId){
  const source=Finance.getInstrument(sourceId);
  const candidates=duplicateCardMergeCandidates(sourceId);
  if(!source||!candidates.length){toast('لا توجد بطاقة مكررة مؤكدة يمكن دمجها');return;}
  const options=candidates.map(x=>{
    const acc=Finance.getAccount(x.accountId);
    const identity=maskedCardNumber(x)||('**** '+(x.last4||'—'));
    return '<option value="'+esc(x.id)+'">'+esc((x.network&&x.network!=='other'?x.network.toUpperCase()+' · ':'')+cardTypeShortLabel(x.type)+' · '+identity+(acc?' · '+acc.name:''))+'</option>';
  }).join('');
  openSheet(
    '<div class="sheet-head"><button type="button" class="close" data-act="close-sheet">✕</button><h2>دمج بطاقة مكررة</h2><div style="width:36px"></div></div>'+

      '<div class="field"><label>البطاقة الحالية المراد دمجها</label><div style="padding:10px;border:1px solid var(--border);border-radius:12px">'+cardNetworkLogoHtml(source.network)+' <b style="margin-inline-start:8px">'+esc(cardTypeShortLabel(source.type)+' · '+(maskedCardNumber(source)||source.name))+'</b></div></div>'+
      '<div class="field"><label>ادمجها داخل</label><select id="cardMergeTarget">'+options+'</select></div>'+
      '<button type="button" class="btn primary" data-act="confirm-merge-card" data-id="'+esc(source.id)+'">دمج وإعادة الحساب</button>'+

async function confirmDuplicateCardMerge(sourceId){
  if(!canWrite()){toast('وضع القراءة فقط');return;}
  const targetEl=document.getElementById('cardMergeTarget');
  const targetId=targetEl?targetEl.value:'';
  if(!targetId){toast('اختر البطاقة الصحيحة التي ستبقى');return;}
  if(!duplicateCardMergeCandidates(sourceId).some(x=>x.id===targetId)){toast('الدمج غير آمن أو لم يعد متاحًا');return;}
  const source=Finance.getInstrument(sourceId),target=Finance.getInstrument(targetId);
  if(!source||!target)return;
  const ok=await dialog({
    emoji:'🧩',
    title:'تأكيد دمج البطاقة',
    msg:'سيتم دمج '+(maskedCardNumber(source)||source.name)+' داخل '+(maskedCardNumber(target)||target.name)+' ونقل التاريخ المالي المرتبط بها. البطاقة الحالية المكررة ستُحذف.',
    okText:'دمج'
  });
  if(!ok)return;
  showFinancialRecalcOverlay('جاري دمج البطاقة وإعادة الحساب');
  await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,20)));
  const result=await commitCriticalMutation(async()=>{

  });
  hideFinancialRecalcOverlay();
  if(!result.ok){render();toast('تعذر الدمج — لم يتم تغيير البيانات');return;}
  closeSheet();render();toast('تم دمج البطاقة المكررة وإعادة الحساب');

function openPrepaidTopup(instId){
  const inst=Finance.getInstrument(instId);
  if(!inst||inst.type!=='prepaid_card') return;
  const target=Finance.getAccount(inst.accountId);
  if(!target) return;
  const candidates=getCountryMoneyAccounts(target.country).filter(a=>a.id!==target.id&&!isLiabilityAccount(a)&&a.type!=='prepaid');
  if(!candidates.length){ toast('أضف حسابًا يمكن الشحن منه أولاً'); return; }
  const preferred=inst.defaultTopupAccountId&&candidates.find(a=>a.id===inst.defaultTopupAccountId);
  const fromAcc=preferred||candidates[0];
  S.form={_sheet:'transfer',id:null,_sourceCountry:fromAcc.country,_destType:'own',_destCountry:target.country,fromAccountId:fromAcc.id,toAccountId:target.id,beneficiaryId:null,fromAmount:'',toAmount:'',receivedAmount:'',receivedCurrency:'',fee:'',fxRate:Finance.suggestRate(fromAcc.currency,target.currency),_transferMode:'received',note:'',tags:[],date:isoToday(),showAdvanced:false};
  renderTransferSheet();
}
async function saveCard(id, presetType){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const name = (document.getElementById('cardName').value || '').trim();
  if (!name){ toast('أدخل اسم البطاقة'); return; }
  const isCredit = presetType === 'credit_card';
  const isPrepaid = presetType === 'prepaid_card';
  const isDebit = presetType === 'debit_card';
  const isWalletCard = presetType === 'wallet_card';
  let linkedAccount = null;
  let country = '';
  let institutionId = null;
  let accountId = null;
  let cardCur = 'AED';
  let debt = 0, limit = 0, bal = 0, repayId = null, prepaidFundingMode = 'existing', prepaidFundingSourceId = null;
  if (isDebit || isWalletCard){
    const linkedEl = document.getElementById('cardLinked');
    const linked = linkedEl ? linkedEl.value : '';
    if (!linked){ toast(isWalletCard ? 'اختر المحفظة المرتبطة' : 'اختر الحساب البنكي المرتبط'); return; }
    linkedAccount = Finance.getAccount(linked);
    if (!linkedAccount){ toast('الحساب غير موجود'); return; }
    if (isDebit && linkedAccount.type !== 'bank'){ toast('بطاقة الديبت ترتبط بحساب بنكي فقط'); return; }
    if (isWalletCard && linkedAccount.type !== 'ewallet'){ toast('بطاقة المحفظة ترتبط بمحفظة إلكترونية فقط'); return; }
    country = linkedAccount.country;
    institutionId = linkedAccount.institutionId;
    cardCur = linkedAccount.currency;
    accountId = linkedAccount.id;
  } else {
    country = (document.getElementById('cardCountry') || {}).value || S.activeCountry;
    const curEl = document.getElementById('cardCur');
    cardCur = curEl ? curEl.value : 'AED';
    if (isCredit){
      const debtEl = document.getElementById('cardDebt');
      debt = debtEl ? (parseFloat(debtEl.value) || 0) : 0;
      const limEl = document.getElementById('cardLimit');
      limit = limEl ? (parseFloat(limEl.value) || 0) : 0;
      const repEl = document.getElementById('cardRepay');
      repayId = repEl ? (repEl.value || null) : null;
    } else if (isPrepaid){
      const balEl = document.getElementById('cardBal');
      bal = balEl ? (parseFloat(balEl.value) || 0) : 0;
      const fundingModeEl=document.getElementById('cardPrepaidFundingMode');
      prepaidFundingMode=fundingModeEl?fundingModeEl.value:'existing';
      const fundingSourceEl=document.getElementById('cardPrepaidSource');
      prepaidFundingSourceId=fundingSourceEl?(fundingSourceEl.value||null):null;
      if(!id&&prepaidFundingMode==='transfer'){
        const fundingAcc=Finance.getAccount(prepaidFundingSourceId);
        if(!fundingAcc||fundingAcc.archived||isLiabilityAccount(fundingAcc)){ toast('اختر حساب تمويل صالح'); return; }
        if(bal>0&&fundingAcc.currency!==cardCur){ toast('الشحن الأول يجب أن يكون من حساب بنفس عملة البطاقة'); return; }
        if(bal>0&&Finance.accountBalance(fundingAcc.id)+0.001<bal){ toast('رصيد حساب التمويل غير كافٍ'); return; }
      }
    }
    const instEl = document.getElementById('cardInst');
    institutionId = instEl ? (instEl.value || null) : null;
  }
  const first4El = document.getElementById('cardFirst4');
  const last4El = document.getElementById('cardLast4');
  const first4Raw = first4El && first4El.value ? first4El.value.trim() : '';
  const last4Raw = last4El && last4El.value ? last4El.value.trim() : '';
  if(first4Raw && !/^\d{4}$/.test(first4Raw)){toast('أول 4 أرقام يجب أن تكون 4 أرقام بالضبط');return;}
  if(last4Raw && !/^\d{4}$/.test(last4Raw)){toast('آخر 4 أرقام يجب أن تكون 4 أرقام بالضبط');return;}
  const first4 = first4Raw || null;
  const last4 = last4Raw || null;
  const networkEl=document.getElementById('cardNetwork');
  const network=networkEl&&['visa','mastercard','discover','other'].includes(networkEl.value)?networkEl.value:'other';
  const icon = (document.getElementById('cardIco') || {}).value || '💳';
  const color = (document.getElementById('cardCol') || {}).value || '#00695C';
  const shouldBeDefault = !!S.form._cardDefaultToggle;

  /* V8.8.4.10: reject invalid negative opening values / limits. */
  if (isCredit){
    if (debt < -0.01){ toast('المديونية الافتتاحية لا يمكن أن تكون سالبة'); return; }
    if (limit < -0.01){ toast('حد البطاقة لا يمكن أن يكون سالبًا'); return; }
  }
  if (isPrepaid && bal < -0.01){
    toast('الرصيد الافتتاحي للبطاقة المدفوعة لا يمكن أن يكون سالبًا');
    return;
  }
  if (id){
    const existing = Finance.getInstrument(id);
    if (existing){
      const hasTx = cardHasHistory(id);
      const existingAcc = Finance.getAccount(existing.accountId);
      if (hasTx && existingAcc){
        if (isCredit || isPrepaid){
          if (country !== existingAcc.country){ toast('البلد مقفل — البطاقة لها معاملات'); return; }
          if (cardCur !== existingAcc.currency){ toast('العملة مقفلة — البطاقة لها معاملات'); return; }
        }
      }
    }
  }
  /* V8.8.4.3 FIX 5: validate repayment account before assignment */
  if (isCredit && repayId){
    const repayAcc = Finance.getAccount(repayId);
    if (!repayAcc || repayAcc.archived || !isAssetAccount(repayAcc)) repayId = null;
  }
  let savedInstId = id;
  const existingBefore = id ? Finance.getInstrument(id) : null;
  const oldAccountId = existingBefore ? existingBefore.accountId : null;
  const relinkRequested = !!(id && (isDebit || isWalletCard) && oldAccountId && accountId && oldAccountId !== accountId);
  if(relinkRequested){
    const oldAcc=Finance.getAccount(oldAccountId),newAcc=Finance.getAccount(accountId);
    if(!oldAcc||!newAcc||oldAcc.country!==newAcc.country||oldAcc.currency!==newAcc.currency){
      toast('إعادة الربط تتطلب حسابًا بنفس البلد والعملة');
      return;
    }
  }
  const cardNeedsRecalc=!!(id&&cardHasHistory(id));
  if(relinkRequested||cardNeedsRecalc){
    showFinancialRecalcOverlay(relinkRequested?'جاري إعادة ربط البطاقة':'جاري تحديث البطاقة وإعادة الحساب');
    await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,20)));
  }
  const result = await commitCriticalMutation(async () => {
    if (isCredit && repayId && accountId && repayId === accountId) repayId = null;
    const instNameEl = document.getElementById('cardInstName');
    const newInstName = instNameEl && instNameEl.value ? (instNameEl.value || '').trim() : '';
    const officialEl = document.getElementById('cardBankRegistry');
    const officialBankId = officialEl && country === 'UAE' ? (officialEl.value || null) : null;
    if (officialBankId && !isDebit && !isWalletCard) institutionId = Finance.ensureRegisteredBank(officialBankId, country);
    else if (newInstName && !isDebit && !isWalletCard) institutionId = Finance.ensureInstitution(newInstName, country, 'bank');
    if (institutionId && !isDebit && !isWalletCard){
      const inst = Finance.getInstitution(institutionId);
      if (inst && inst.country !== country){ institutionId = null; }
    }
    if (isCredit){
      if (id){
        const inst = Finance.getInstrument(id);
        if (inst && inst.accountId){
          const acc = Finance.getAccount(inst.accountId);
          if (acc){
            const hasTx = cardHasHistory(id);
            acc.name = name;
            if (!hasTx){ acc.country = country; acc.currency = cardCur; }
            acc.openingDebt = debt;
            const relinkInstitution=BankIngestionCore.rebindAccountInstitution(S,acc.id,institutionId);
            if(!relinkInstitution.ok)return false;
            acc.creditLimit = limit;
            acc.defaultRepaymentAccountId = repayId;
            acc.icon = icon; acc.color = color;
            accountId = acc.id;
          }
        }
      } else {
        accountId = uid('a');
        S.accounts.push({
          id: accountId, institutionId, country, name, type:'credit', currency: cardCur,
          openingBalance: 0, openingDebt: debt, creditLimit: limit,
          defaultRepaymentAccountId: repayId, icon, color, archived: false, created: isoToday()
        });
      }
    } else if (isPrepaid){
      if (id){
        const inst = Finance.getInstrument(id);
        if (inst && inst.accountId){
          const acc = Finance.getAccount(inst.accountId);
          if (acc){
            const hasTx = cardHasHistory(id);
            acc.name = name;
            if (!hasTx){ acc.country = country; acc.currency = cardCur; FinanceCore.setOpeningBalance(acc,bal); }
            const relinkInstitution=BankIngestionCore.rebindAccountInstitution(S,acc.id,institutionId);
            if(!relinkInstitution.ok)return false;
            acc.icon = icon; acc.color = color;
            acc.ownedByInstrumentId = id;
            accountId = acc.id;
          }
        }
      } else {
        accountId = uid('a');
        S.accounts.push({
          id: accountId, institutionId, country, name, type:'prepaid', currency: cardCur,
          openingBalance: prepaidFundingMode==='transfer' ? 0 : bal, openingDebt: 0, creditLimit: 0,
          defaultRepaymentAccountId: null, icon, color, archived: false, created: isoToday(),
          ownedByInstrumentId: null
        });
      }
    }
    if (id){
      const inst = Finance.getInstrument(id);
      if (inst){
        if(relinkRequested){
          const moved=BankIngestionCore.rebindInstrumentAccount(S,id,accountId);
          if(!moved.ok)return false;
        }else{
          inst.accountId = accountId;
          inst.institutionId = (isDebit || isWalletCard) ? (linkedAccount ? linkedAccount.institutionId : null) : institutionId;
        }
        inst.name = name;
        inst.first4 = first4;
        inst.last4 = last4;
        inst.network = network;
        const finalAcc = Finance.getAccount(accountId);
        inst.country = finalAcc ? finalAcc.country : country;
        inst.icon = icon; inst.color = color;
        if (isPrepaid){ if(prepaidFundingSourceId) inst.defaultTopupAccountId=prepaidFundingSourceId; if(finalAcc) finalAcc.ownedByInstrumentId = inst.id; }
      }
    } else {
      const finalAcc = Finance.getAccount(accountId);
      if (!finalAcc){ return false; }
      if (finalAcc.country !== country && (isDebit || isWalletCard)){ return false; }
      savedInstId = uid('pi');
      S.paymentInstruments.push({
        id: savedInstId, accountId,
        institutionId: (isDebit || isWalletCard) ? (linkedAccount ? linkedAccount.institutionId : null) : institutionId,
        name, type: presetType, first4, last4, network, country: finalAcc.country,
        icon, color, archived: false, created: isoToday(),
        defaultTopupAccountId: isPrepaid ? prepaidFundingSourceId : null
      });
      if (isPrepaid){
        finalAcc.ownedByInstrumentId = savedInstId;
        if(prepaidFundingMode==='transfer'&&prepaidFundingSourceId&&bal>0){
          const sourceAcc=Finance.getAccount(prepaidFundingSourceId);
          if(!sourceAcc||sourceAcc.currency!==finalAcc.currency) return false;
          S.transactions.push({id:uid('t'),type:'transfer',fromAccountId:sourceAcc.id,fromAmount:bal,fromCurrency:sourceAcc.currency,fromCountry:sourceAcc.country,toAccountId:finalAcc.id,toAmount:bal,toCurrency:finalAcc.currency,toCountry:finalAcc.country,fxRate:1,fee:0,note:'',tags:[],date:isoToday(),created:Date.now()});
        }
      }
    }
    if (shouldBeDefault){
      S.settings.defaultInstrumentByCountry[country] = savedInstId;
    } else if (S.settings.defaultInstrumentByCountry[country] === savedInstId){
      delete S.settings.defaultInstrumentByCountry[country];
    }
    Finance.ensureAllPrimaries();
    return true;
  });
  hideFinancialRecalcOverlay();
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast(relinkRequested ? 'تمت إعادة ربط البطاقة وإعادة الحساب' : (cardNeedsRecalc ? 'تم تعديل البطاقة وإعادة الحساب' : (id ? 'تم التعديل' : 'تمت الإضافة')));
}
async function archiveInstrument(id){
  if (!canWrite()){ return; }
  const inst = Finance.getInstrument(id);
  if (!inst) return;
  const acc = inst.accountId ? Finance.getAccount(inst.accountId) : null;
  if (inst.type === 'credit_card' && acc){
    /* V8.8.4.11: only block when this is the LAST active card AND the account
       carries a non-zero raw balance. Sibling active cards keep the account
       accessible → archiving this one is allowed. */
    const siblingsActive = S.paymentInstruments.filter(i =>
      i && i.accountId === acc.id && i.type === 'credit_card' && !i.archived && i.id !== inst.id
    );
    const isLastActive = siblingsActive.length === 0;
    const rawBal = Finance.accountBalance(acc.id);
    if (isLastActive && Math.abs(rawBal) > 0.01){
      const debt = rawBal < 0 ? -rawBal : 0;
      const credit = rawBal > 0 ? rawBal : 0;
      const msg = debt > 0
        ? 'هذه آخر بطاقة نشطة على الحساب وعليه مديونية ' + amtFull(debt, acc.currency) + '. سدّدها أولاً.'
        : 'هذه آخر بطاقة نشطة على الحساب وبه رصيد موجب ' + amtFull(credit, acc.currency) + '. سوِّ الحساب أولاً.';
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة البطاقة', msg, okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }
  if (inst.type === 'prepaid_card' && acc){
    const bal = Math.abs(Finance.accountBalance(acc.id));
    if (bal > 0.01){
      await dialog({emoji:'⚠️', title:'لا يمكن أرشفة البطاقة',
        msg:'البطاقة فيها رصيد ' + amtFull(bal, acc.currency) + '. حوّل أو استخدم الرصيد أولاً.',
        okText:'حسناً', primary:true, hideCancel:true});
      return;
    }
  }
  const ok = await dialog({emoji:'📦', title:'أرشفة البطاقة', msg:'ستختفي من الإدخال الجديد.', okText:'أرشفة', primary:true});
  if (!ok) return;
  const result = await commitCriticalMutation(async () => {
    inst.archived = true;
    if (acc && inst.type === 'prepaid_card' && acc.ownedByInstrumentId === inst.id){
      acc.archived = true;
    }
    if (acc && inst.type === 'credit_card'){
  /* V8.8.4.8 invariant preserved: account archived only if ALL linked
     credit cards are archived. Siblings are NOT touched. */
  const linked = S.paymentInstruments.filter(i => i.accountId === acc.id && i.type === 'credit_card');
  const anyActive = linked.some(i => !i.archived);
  /* V8.8.4.10 FIX 4: do NOT archive the backing account if it still
     holds a non-zero raw balance (legacy/malformed state safety net). */
  const rawBal = Finance.accountBalance(acc.id);
  if (!anyActive && Math.abs(rawBal) <= 0.01){
    acc.archived = true;
  } else {
    acc.archived = false;
  }
}
    if (acc){
      if (S.settings.defaultInstrumentByCountry[acc.country] === id){
        delete S.settings.defaultInstrumentByCountry[acc.country];
      }
      if (S.settings.defaultAccountByCountry[acc.country] === acc.id){
        delete S.settings.defaultAccountByCountry[acc.country];
      }
    }
    /* V8.8.4.9 FIX 3: pause recurring tied to THIS instrument unconditionally */
    S.recurring.forEach(r => {
      if (r.instrumentId === id){ r.active = false; }
    });
    /* If the backing account also became archived, pause account-based recurring too.
       On shared imported credit accounts with sibling active cards, acc stays active
       and account-based recurring rules are intentionally NOT paused. */
    if (acc && acc.archived){
      S.recurring.forEach(r => {
        if (r.accountId === acc.id){ r.active = false; }
      });
    }
    Finance.ensureAllPrimaries();
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  closeSheet(); render();
  toast('تم الأرشفة');
}
async function unarchiveInstrument(id){

/* ---------- STORAGE ---------- */
async function retryStorage(){
  toast('جاري إعادة المحاولة...');
  Storage.resetConnection();
  const initResult = await Storage.init();
  if (initResult.mode === 'memory'){
    S.previewMode = true; S.storageStatus = 'ok'; S.storageError = null;
    if (!S.accounts.length){
      const def = DEFAULT_STATE(); def.settings.onboarded = true; def.settings.defaultCountry = 'UAE';
      loadStateInto(def);
      await Storage.writeState(snapshotState());
    }
    render(); toast('وضع تجربة'); return;
  }
  if (initResult.mode === 'error'){
    S.storageStatus = 'unavailable'; S.storageError = initResult.error; S.previewMode = false;
    render(); toast('ما زال التخزين غير متاح'); return;
  }
  const result = await Storage.readState();
  if (!result.ok){
    S.storageStatus = result.reason || 'corrupted';
    S.storageError = result.error;
    render(); toast('ما زال التخزين غير متاح');
    return;
  }

  /* V8.8.4.6 P0: the durable fallback is the RAW durable state read from
     IDB — NEVER snapshotState() in Recovery mode (it may be empty/stale). */
  const durableBefore = result.state ? deepClone(result.state) : null;

  if (durableBefore){
    /* V8.8.4.7 P0: readable durable state about to be replaced →
       safety snapshot is REQUIRED. */
    const snapRes = await writeRotatedPreCritSnapshot(durableBefore);
    if (!snapRes.ok){
      S.storageStatus = 'corrupted';
      S.storageError = new Error('retry: safety snapshot failed: ' + (snapRes.reason || 'unknown'));
      render();
      toast('تعذر إنشاء نسخة أمان — لا يزال وضع الحماية');
      return;
    }
    let migrated = null;
    try { migrated = Schema.migrate(durableBefore); }
    catch(e){
      S.storageStatus = 'corrupted';
      S.storageError = e;
      render();
      toast('فشل ترقية البيانات — لا يزال وضع الحماية');
      return;
    }
    if (!migrated){
      S.storageStatus = 'corrupted';
      S.storageError = new Error('migration returned null');
      render();
      toast('فشل ترقية البيانات — لا يزال وضع الحماية');
      return;
    }
    loadStateInto(migrated);
  } else {
    /* No durable state — fresh candidate, no rollback target, no snapshot to make. */
    loadStateInto(DEFAULT_STATE());
  }
  Finance.ensureAllPrimaries();
  const candidate = snapshotState();

  const vres = await verifiedWriteState(candidate, durableBefore);
  if (vres.ok){
    S.storageStatus = 'ok'; S.storageError = null; S.previewMode = false;
    await loadSnapshots();
    await recomputePendingRecurring();
    syncNativeNotifications();
    applyTheme(); render();
    toast('تم استرجاع التخزين');
    return;
  }
  /* Failure — do NOT announce success, do NOT write UI state.
     If rollback succeeded, durable storage still holds durableBefore (raw). */
  if (durableBefore){
    try { loadStateInto(durableBefore); } catch(_){}
  }
  /* vres.restored===false already entered Recovery via helper. */
  S.storageStatus = 'corrupted';
  if (!S.storageError) S.storageError = new Error(vres.reason || 'retry failed');
  render();
  toast('فشل التحقق من التخزين — لا يزال وضع الحماية');
}

async function importData(file){
  const r = new FileReader();
  r.onload = async () => {
    let parsed;
    try { parsed = BackupCore.parseJsonText(r.result); }
    catch(e){ toast('الملف ليس JSON صالح'); return; }
    const financeValidation = BackupCore.validateFinanceRestoreInput(parsed,{
      fingerprint:stateFingerprint,
      validateForImport:Schema.validateForImport
    });
    if (!financeValidation.ok){
      if (financeValidation.reason === 'fingerprint-mismatch'){
        await dialog({emoji:'❌', title:'النسخة الاحتياطية تالفة', msg:'بصمة سلامة الملف لا تطابق محتواه. لم يتم استيراد أي بيانات.', okText:'حسناً', primary:true, hideCancel:true});
        return;
      }
      const errors = financeValidation.reason === 'validation-error'
        ? financeValidation.errors.map(x=>'فشل التحقق: ' + x)
        : financeValidation.errors;
      if (errors.length){
        await dialog({emoji:'❌', title:'ملف غير صالح', msg: errors.slice(0,5).join('\n'), okText:'حسناً', primary:true, hideCancel:true});
      }
      return;
    }
    const ok = await dialog({emoji:'📥', title:'استيراد نسخة', msg:'سيتم استبدال البيانات الحالية.', okText:'استيراد', primary:true});
    if (!ok) return;

    /* V8.8.4.6 P0: distinguish healthy vs Recovery for the rollback source.
       Healthy  → snapshotState() IS the durable state (verified-write keeps them equal).
       Recovery → snapshotState() is UI-only; read the RAW durable bytes instead. */
    let durableBackup = null;
    let inRecovery = !S.previewMode && S.storageStatus !== 'ok';

    if (S.previewMode){
      durableBackup = snapshotState();
      try { await Storage.rotateSnapshot(durableBackup); } catch(_){}
    } else if (!inRecovery){
      durableBackup = snapshotState();
      const snapRes = await writeRotatedPreCritSnapshot(durableBackup);
      if (!snapRes.ok){
        render();
        toast('تعذر إنشاء نسخة أمان — لم يتم الاستيراد');
        return;
      }
      /* V8.8.4.8: user-visible snapshot too — verified rotation 1←2←3. */
      const userSnapRes = await writeRotatedUserSnapshot(durableBackup);
      if (!userSnapRes.ok){
        render();
        toast('تعذر إنشاء نسخة استرجاع — لم يتم الاستيراد');
        return;
      }
    } else {
      /* Recovery: raw durable read is the only trustworthy source. */
      let raw = { ok:false };
      try { raw = await Storage.readState(); } catch(_){ raw = { ok:false }; }
      if (raw.ok && raw.state){
        durableBackup = deepClone(raw.state);
        /* V8.8.4.7 P0: readable durable → safety snapshot REQUIRED. */
        const snapRes = await writeRotatedPreCritSnapshot(durableBackup);
        if (!snapRes.ok){
          render();
          toast('تعذر إنشاء نسخة أمان — لم يتم الاستيراد');
          return;
        }
        /* V8.8.4.8: user-visible restore point too. */
        const userSnapRes = await writeRotatedUserSnapshot(durableBackup);
        if (!userSnapRes.ok){
          render();
          toast('تعذر إنشاء نسخة استرجاع — لم يتم الاستيراد');
          return;
        }
      } else {
        /* Unreadable/corrupted durable → no readable state to preserve.
           Proceed with no fallback; verified-write failure stays Recovery. */
        durableBackup = null;
      }
    }

    let migrated = null;
    try {
      migrated = BackupCore.prepareFinanceRestore(parsed,{
        migrate:Schema.migrate,
        validateStateStrict:Schema.validateStateStrict
      });
    } catch(e){
      if (e && e.message === 'migration-failed'){
        const cause = e.cause;
        toast(cause ? 'فشل ترقية البيانات: ' + (cause.message || cause) : 'فشل ترقية البيانات');
        return;
      }
      if (e && e.message === 'schema-invalid'){
        const strictErrors = Array.isArray(e.validationErrors) ? e.validationErrors : [];
        await dialog({emoji:'❌', title:'النسخة تحتوي بيانات مالية غير صالحة', msg: strictErrors.slice(0,8).join('\n'), okText:'حسناً', primary:true, hideCancel:true});
        return;
      }
      throw e;
    }

    loadStateInto(migrated);
    Finance.ensureAllPrimaries();
    const candidate = snapshotState();

    const vres = await verifiedWriteState(candidate, durableBackup);
    if (vres.ok){
      if (!S.previewMode){ S.storageStatus = 'ok'; S.storageError = null; }
      await loadSnapshots();
      await recomputePendingRecurring();
      syncNativeNotifications();
      applyTheme(); render();
      toast('تم الاستيراد');
      return;
    }
    /* Failure — no extra unverified writes. */
    if (durableBackup) loadStateInto(durableBackup);
    render();
    if (vres.restored) toast('فشل الاستيراد — تم استرجاع الحالة السابقة');
    else toast('فشل الاستيراد — وضع الحماية');
  };
  r.readAsText(file);
}

async function restoreSnapshot(name){
  if (!canWrite()){ return; }
  const snap = await Storage.readSnapshot(name);
  if (!snap){ toast('النسخة غير متوفرة'); return; }
  const ok = await dialog({emoji:'💾', title:'استرجاع نسخة', msg:'سيتم استبدال البيانات الحالية بالنسخة المختارة.', okText:'استرجاع', primary:true});
  if (!ok) return;

  /* V8.8.4.5: ONE before, ONE candidate, ONE verified commit */
  const before = snapshotState();

  if (!S.previewMode){
    const snapRes = await writeRotatedPreCritSnapshot(before);
    if (!snapRes.ok){
      render();
      toast('تعذر إنشاء نسخة أمان — لم يتم الاسترجاع');
      return;
    }
    /* V8.8.4.8: verified user-visible restore point before restore. */
    const userSnapRes = await writeRotatedUserSnapshot(before);
    if (!userSnapRes.ok){
      render();
      toast('تعذر إنشاء نسخة استرجاع — لم يتم الاسترجاع');
      return;
    }
  } else {
    try { await Storage.rotateSnapshot(before); } catch(_){}
  }

  const migrated = Schema.migrate(snap);
  if (!migrated){ toast('النسخة غير صالحة'); return; }
  const strictErrors = Schema.validateStateStrict(migrated);
  if (strictErrors.length){
    await dialog({emoji:'❌', title:'النسخة غير صالحة', msg: strictErrors.slice(0,8).join('\n'), okText:'حسناً', primary:true, hideCancel:true});
    return;
  }

  loadStateInto(migrated);
  Finance.ensureAllPrimaries();
  const candidate = snapshotState();

  const vres = await verifiedWriteState(candidate, before);
  if (vres.ok){
    await loadSnapshots();
    await recomputePendingRecurring();
    syncNativeNotifications();
    applyTheme(); render();
    toast('تم الاسترجاع');
    return;
  }
  if (vres.restored){
    loadStateInto(before);
    render();
    toast('فشل الاسترجاع — تم استرجاع الحالة السابقة');
  } else {
    loadStateInto(before);
    render();
    toast('فشل الاسترجاع — وضع الحماية');
  }
}
async function loadSnapshots(){

async function toggleNotif(){

async function setDefaultCountry(code){

      const repAcc = Finance.getAccount(S.repAccountId);

  const fromEl = document.getElementById('fromAmtIn'); if (fromEl) S.form.fromAmount = fromEl.value;

  const rateEl = document.getElementById('rateIn'); if (rateEl && rateEl.value !== '') S.form.fxRate = parseFloat(rateEl.value) || S.form.fxRate;
  const noteEl = document.getElementById('noteIn'); if (noteEl) S.form.note = noteEl.value;

/* V8.8.4.8: single source of truth for transfer destination currency */
function resolveTransferDestCurrency(f){
  if (!f) return null;
  if (f._destType === 'external'){
    const b = f.beneficiaryId ? Finance.getBeneficiary(f.beneficiaryId) : null;
    return b ? b.defaultCurrency : null;
  }
  const toAcc = f.toAccountId ? Finance.getAccount(f.toAccountId) : null;
  return toAcc ? toAcc.currency : null;
}
function recomputeTransferFx(f){
  if (!f) return;
  const fromAcc = f.fromAccountId ? Finance.getAccount(f.fromAccountId) : null;
  const fromCur = fromAcc ? fromAcc.currency : null;
  const destCur = resolveTransferDestCurrency(f);
  if (!fromCur || !destCur){ f.fxRate = 0; return; }
  f.fxRate = Finance.suggestRate(fromCur, destCur);
}

      handleMenuAction(act.dataset.menuAct, txId);

    }

  const view = document.getElementById('view');
  if (view && view.contains(t)){
    const linkToAccounts = t.closest('[data-act="go-accounts"]');
    if (linkToAccounts){ e.stopPropagation(); go('accounts'); return; }
    const mv = t.closest('[data-mv]');

    const accEdit = t.closest('[data-account-edit]');
    if (accEdit){ openAccountEditorById(accEdit.dataset.accountEdit); return; }
    const instEdit = t.closest('[data-instrument-edit]');
    if (instEdit){ openInstrumentSheet(instEdit.dataset.instrumentEdit); return; }
    const txEl = t.closest('.tx-item[data-txid]');
    if (txEl){
      if (window._justSwiped){ window._justSwiped = false; return; }
      openTxDetails(txEl.dataset.txid);
      return;
    }
    const accOpen = t.closest('[data-account-open]');
    if (accOpen){ S.repAccountId = accOpen.dataset.accountOpen; S.tab = 'rep'; render(); return; }
    const per = t.closest('[data-period]');
    if (per){ S.repPeriod = per.dataset.period; render(); return; }
    const quick = t.closest('[data-quick]');
    if (quick){
      const val = quick.dataset.quick;
      if (val === '__all') openAddMenu();
      else openNewTx('expense', {catId: val});
      return;
    }
    const recOpen = t.closest('[data-rec-open]');
    if (recOpen){ openRecSheet(recOpen.dataset.recOpen); return; }
    const snapEl = t.closest('[data-snap]');
    if (snapEl){ restoreSnapshot(snapEl.dataset.snap); return; }
    const actEl = t.closest('[data-act]');
    if (actEl){ handleViewAction(actEl.dataset.act, actEl.dataset); return; }
  }
  const tb = document.getElementById('topBar');
  if (tb && tb.contains(t)){
    const mv = t.closest('[data-mv]');
    if (mv){ shiftMonth(parseInt(mv.dataset.mv)); return; }
    const actEl = t.closest('[data-act]');
    if (actEl){ handleViewAction(actEl.dataset.act, actEl.dataset); return; }
  }
});

const SWIPE = {el:null,wrap:null,startX:0,startY:0,dx:0,locked:false,longTimer:null,moved:false};
function bindTxTouch(){
  const view = document.getElementById('view');
  if (!view) return;
  view.addEventListener('touchstart', onTouchStart, {passive:true});
  view.addEventListener('touchmove', onTouchMove, {passive:false});
  view.addEventListener('touchend', onTouchEnd);
  view.addEventListener('touchcancel', onTouchEnd);
}
function onTouchStart(e){
  const item = e.target.closest('.tx-item');
  if (!item) return;
  const wrap = item.closest('.tx-item-wrap');
  if (!wrap) return;
  const txId = item.dataset.txid;
  const tx = S.transactions.find(x => x.id === txId);
  if (!tx || tx.type === 'adjustment') return;
  SWIPE.el = item; SWIPE.wrap = wrap;
  SWIPE.startX = e.touches[0].clientX;
  SWIPE.startY = e.touches[0].clientY;
  SWIPE.dx = 0; SWIPE.locked = false; SWIPE.moved = false;
  clearTimeout(SWIPE.longTimer);
  SWIPE.longTimer = setTimeout(() => {
    if (!SWIPE.locked && !SWIPE.moved && SWIPE.el){
      showActionMenu(SWIPE.el.dataset.txid, SWIPE.startX, SWIPE.startY);
      SWIPE.el = null; SWIPE.wrap = null;
    }
  }, 500);
}
function onTouchMove(e){
  if (!SWIPE.el) return;
  const dx = e.touches[0].clientX - SWIPE.startX;
  const dy = e.touches[0].clientY - SWIPE.startY;
  if (!SWIPE.locked){
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
      SWIPE.locked = true; SWIPE.moved = true;
      clearTimeout(SWIPE.longTimer);
      SWIPE.el.classList.add('swiping');
      SWIPE.wrap.classList.remove('edit','del');
    } else if (Math.abs(dy) > 10){
      SWIPE.moved = true; clearTimeout(SWIPE.longTimer);
      SWIPE.el = null; SWIPE.wrap = null; return;
    }
  }
  if (SWIPE.locked){
    e.preventDefault();
    SWIPE.dx = dx;
    const clamped = Math.max(-140, Math.min(140, dx));
    SWIPE.el.style.transform = 'translateX(' + clamped + 'px)';
    SWIPE.wrap.classList.toggle('edit', dx > 30);
    SWIPE.wrap.classList.toggle('del', dx < -30);
  }
}
function onTouchEnd(){
  clearTimeout(SWIPE.longTimer);
  if (!SWIPE.el){ SWIPE.locked = false; SWIPE.dx = 0; return; }
  const id = SWIPE.el.dataset.txid;
  const dx = SWIPE.dx;
  const wasLocked = SWIPE.locked;
  SWIPE.el.style.transform = '';
  SWIPE.el.classList.remove('swiping');
  SWIPE.wrap.classList.remove('edit','del');
  SWIPE.el = null; SWIPE.wrap = null; SWIPE.locked = false; SWIPE.dx = 0;
  if (wasLocked){
    if (dx > 60){ buzz(10); window._justSwiped = true; openEditTx(id); }
    else if (dx < -60){ buzz(15); window._justSwiped = true; delTxConfirm(id); }
  }
}

async function handleMenuAction(act, txId){
  if (act === 'edit') setTimeout(() => openEditTx(txId), 50);
  else if (act === 'delete') setTimeout(() => delTxConfirm(txId), 50);
  else if (act === 'duplicate'){
    if (!canWrite()){ return; }
    const t = S.transactions.find(x => x.id === txId);
    if (!t) return;
    /* V8.8.4.10: do not duplicate adjustment rows or linked repayment fee rows. */
    if (t.type === 'adjustment'){ toast('لا يمكن نسخ التسويات'); return; }
    if (t.linkedTransferId){ toast('لا يمكن نسخ رسوم مرتبطة بسداد'); return; }
    /* V8.8.4.10: validate source validity for each transaction kind. */
    const invalid = 'لا يمكن نسخ المعاملة — وسيلة الدفع لم تعد متاحة';
    if (t.type === 'expense' || t.type === 'income'){
      const acc = Finance.getAccount(t.accountId);
      if (!acc || acc.archived){ toast(invalid); return; }
      if (t.instrumentId){
        const inst = Finance.getInstrument(t.instrumentId);
        if (!inst || inst.archived || inst.accountId !== t.accountId){ toast(invalid); return; }
      }
    } else if (t.type === 'transfer'){
      const fa = Finance.getAccount(t.fromAccountId);
      const ta = Finance.getAccount(t.toAccountId);
      if (!fa || fa.archived){ toast(invalid); return; }
      if (!ta || ta.archived){ toast(invalid); return; }
      /* Repayment transfers must be edited via repayment editor, not duplicated. */
      if (isLiabilityAccount(ta)){ toast('لا يمكن نسخ السداد — عدّله من السداد'); return; }
    } else if (t.type === 'external_transfer'){
      const fa = Finance.getAccount(t.fromAccountId);
      if (!fa || fa.archived){ toast(invalid); return; }
      if (t.beneficiaryId){
        const b = Finance.getBeneficiary(t.beneficiaryId);
        if (!b || b.archived){ toast(invalid); return; }
      }
    } else {
      toast(invalid); return;
    }
    const copy = Object.assign({}, deepClone(t), {id: uid('t'), created: Date.now(), date: isoToday(), rec: null});
    const result = await commitCriticalMutation(async () => {
      S.transactions.push(copy);
      return true;
    });
    if (!result.ok){
      render();
      if (result.reason === 'prepaid-insufficient' || _lastMutationError === 'prepaid-insufficient'){
        _lastMutationError = null;
        toast('الرصيد غير كافٍ في البطاقة/الحساب المدفوع مقدمًا');
        return;
      }
      toast('تعذر الحفظ');
      return;
    }
    /* V8.8.4.11: reevaluate budget context for every budget-relevant duplicate. */
    const dupCtx = budgetContextForTransaction(copy);
    if (dupCtx){
      const a = await runBudgetAlerts(dupCtx.country, dupCtx.month);
      if (a && a.length) S.activeBudgetAlerts = a;
    }
    render(); toast('تم النسخ');
    setTimeout(showBudgetAlertsIfAny, 400);
  }
}
