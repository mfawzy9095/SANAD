/* V8.8.4.3 FIX 4 (correction): verify migration with full-content fingerprint */
async function boot(){
  applyTheme();
  setupPWA();
  const initResult = await Storage.init();
  if (initResult.mode === 'memory'){
    S.previewMode = true; S.storageStatus = 'ok'; S.storageError = null;
    const def = DEFAULT_STATE();
    def.settings.onboarded = true;
    def.settings.defaultCountry = 'UAE';
    loadStateInto(def);
    await Storage.writeState(snapshotState());
    await loadSnapshots();
    await recomputePendingRecurring();
    S.ready = true;
    startApp();
    return;
  }
  if (initResult.mode === 'error'){
    S.storageStatus = 'unavailable'; S.storageError = initResult.error;
    S.previewMode = false; S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  const result = await Storage.readState();
  if (!result.ok){
    S.storageStatus = result.reason || 'corrupted';
    S.storageError = result.error || null;
    S.previewMode = false; S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  if (!result.state){
    const def = DEFAULT_STATE();
    def.settings.defaultCountry = 'UAE';
    loadStateInto(def);
    const candidate = snapshotState();
    /* No prior state exists → no rollback target. Success = durable readback matches. */
    const vres = await verifiedWriteState(candidate, null);
    if (!vres.ok){
      S.storageStatus = 'unavailable';
      S.storageError = new Error('initial verified write failed: ' + (vres.reason || 'unknown'));
      S.ready = true;
      startApp();
      return;
    }
    S.ready = true;
    if (!S.settings.onboarded){ showOnboarding(); return; }
    startApp();
    return;
  }
  /* V8.8.4.6 P0: ONE atomic verified candidate for migration.
     rawBefore is the raw durable bytes; it is the ONLY valid rollback target. */
  const rawBefore = result.state;

  let migrated = null;
  try { migrated = Schema.migrate(rawBefore); }
  catch(e){
    S.storageStatus = 'corrupted';
    S.storageError = e;
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  if (!migrated){
    S.storageStatus = 'corrupted';
    S.storageError = new Error('migration returned null');
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }
  const strictErrors = Schema.validateStateStrict(migrated);
  if (strictErrors.length){
    S.storageStatus = 'corrupted';
    S.storageError = new Error('financial integrity check failed: ' + strictErrors.slice(0,5).join(' | '));
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }

  loadStateInto(migrated);
  Finance.ensureAllPrimaries();
  const candidate = snapshotState();

  /* V8.8.4.8: no-op launch optimization — if migration + finalization
     produced the exact same content, do NOT rotate snapshots or rewrite IDB.
     This prevents an unnecessary snapshot/write failure from pushing an
     unchanged healthy DB into Recovery. */
  const rawFp = stateFingerprint(rawBefore);
  const candFp = stateFingerprint(candidate);
  if (rawFp === candFp){
    /* No change to persist. Keep in-memory candidate and continue. */
    await loadSnapshots();
    await recomputePendingRecurring();
    S.ready = true;
    if (!S.settings.onboarded){ showOnboarding(); return; }
    startApp();
    return;
  }

  /* Real change → required safety snapshot + verified write. */
  const snapRes = await writeRotatedPreCritSnapshot(rawBefore);
  if (!snapRes.ok){
    S.storageStatus = 'corrupted';
    S.storageError = new Error('pre-migration safety snapshot failed: ' + (snapRes.reason || 'unknown'));
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }

  const vres = await verifiedWriteState(candidate, rawBefore);
  if (vres.ok){
    /* continue */
  } else if (vres.restored){
    try { loadStateInto(rawBefore); } catch(_){}
    S.storageStatus = 'corrupted';
    S.storageError = new Error('migration commit failed; raw state restored');
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  } else {
    try { loadStateInto(rawBefore); } catch(_){}
    S.ready = true; S.settings.onboarded = true;
    startApp();
    return;
  }

  await loadSnapshots();
  await recomputePendingRecurring();
  S.ready = true;
  if (!S.settings.onboarded){ showOnboarding(); return; }
  startApp();
}

const SanadI18n = Object.assign(I18nCore.createI18nCore(), {
  originalText:new WeakMap(), originalAttrs:new WeakMap(), _observer:null,
  apply(root){
    this.lang=I18nCore.normalizeLanguage(S.settings&&S.settings.language);
    document.documentElement.lang=this.lang; document.documentElement.dir=I18nCore.directionForLanguage(this.lang);
    document.body.classList.toggle('lang-en',this.lang==='en');
    root=root||document;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
      if(!n.nodeValue||!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p=n.parentElement; if(!p||['SCRIPT','STYLE','TEXTAREA'].includes(p.tagName)||p.closest('[data-no-i18n]')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      if(!this.originalText.has(n)||/[\u0600-\u06FF]/.test(n.nodeValue)) this.originalText.set(n,n.nodeValue);
      const src=this.originalText.get(n);
      n.nodeValue=this.lang==='en'?this.text(src):src;
    });
    root.querySelectorAll&&root.querySelectorAll('input[placeholder],textarea[placeholder],[aria-label],[title]').forEach(el=>{
      const prev=this.originalAttrs.get(el)||{placeholder:'',aria:'',title:''};
      const cur={placeholder:el.placeholder||'',aria:el.getAttribute('aria-label')||'',title:el.getAttribute('title')||''};
      if(!this.originalAttrs.has(el)||/[\u0600-\u06FF]/.test(cur.placeholder+cur.aria+cur.title)) this.originalAttrs.set(el,cur);
      const orig=this.originalAttrs.get(el)||prev;
      if('placeholder' in el) el.placeholder=this.lang==='en'?this.text(orig.placeholder||''):(orig.placeholder||'');
      if(el.hasAttribute('aria-label')||orig.aria) el.setAttribute('aria-label',this.lang==='en'?this.text(orig.aria||''):(orig.aria||''));
      if(el.hasAttribute('title')||orig.title) el.setAttribute('title',this.lang==='en'?this.text(orig.title||''):(orig.title||''));
    });
  },
  watch(){
    if(this._observer||!window.MutationObserver||!document.body)return;
    this._observer=new MutationObserver(mutations=>{
      if(this.lang!=='en')return;
      this._observer.disconnect();
      try{
        const roots=new Set();
        for(const m of mutations){
          if(m.type==='characterData'&&m.target&&m.target.parentElement){
            if(/[\u0600-\u06FF]/.test(m.target.nodeValue||'')) this.originalText.set(m.target,m.target.nodeValue);
            roots.add(m.target.parentElement);
          }else if(m.type==='attributes'&&m.target&&m.target.nodeType===1){
            roots.add(m.target);
          }else{
            for(const n of (m.addedNodes||[])){
              if(n.nodeType===1) roots.add(n);
              else if(n.nodeType===3&&n.parentElement) roots.add(n.parentElement);
            }
          }
        }
        roots.forEach(r=>this.apply(r));
      }finally{
        this._observer.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
      }
    });
    this._observer.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
  }
});

const SanadReceipts = {

  domain(){
    if(!this._domain)this._domain=ReceiptCore.createReceiptService({
      storage:SanadExtStorage,

  },
  ensureInput(){

    if(!input){ input=document.createElement('input');input.id='sanadReceiptInput';input.type='file';input.accept='image/*';input.setAttribute('capture','environment');input.hidden=true;document.body.appendChild(input);input.addEventListener('change',e=>this.handleFile(e.target.files&&e.target.files[0])); }
    return input;
  },
  async handleFile(file){
    if(SanadExtStorage.mode==='error'){
      this.ensureInput().value='';
      toast('تخزين المرفقات غير متاح — لم يتم إرفاق الفاتورة');
      return;
    }
    const check=ReceiptCore.validateFile(file);
    if(!check.ok){
      if(check.reason==='missing')return;
      if(check.reason==='type'){toast('اختر صورة فاتورة');return;}
      if(check.reason==='size'){toast('الصورة كبيرة جداً');return;}
      return;
    }
    try{
      const blob=await this.compress(file);
      this.pending={blob,meta:ReceiptCore.makeMeta(file,blob,Date.now())};
      this.refreshControls();
      toast('فاتورة مرفقة');
    }catch(e){console.error(e);toast('تعذر معالجة صورة الفاتورة');}
    this.ensureInput().value='';
  },
  async compress(file){
    const bmp=await createImageBitmap(file);

    const ctx=c.getContext('2d',{alpha:false});
    ctx.fillStyle='#fff';ctx.fillRect(0,0,dims.width,dims.height);ctx.drawImage(bmp,0,0,dims.width,dims.height);

const SanadSecurity = {
  cfg:{enabled:false,authMode:null,credentialId:null,recoveryHash:null,recoverySalt:null,recoveryKdf:null,recoveryIterations:0,storageUnavailable:false}, unlocked:true, pendingStart:false, markerKey:'sanad_security_enabled_v1', backgroundAt:0, relockAfterMs:30000, _autoPrompting:false,

  async authorize(reason){

  async init(){

    this.unlocked=prepared.unlocked;

  },
  ensureOverlay(){let el=document.getElementById('sanadLock');if(el)return el;el=document.createElement('div');el.id='sanadLock';el.className='sanad-lock';el.hidden=true;el.innerHTML='<div class="lock-card"><div class="lock-logo">س</div><h2>SANAD · سند</h2><p>التطبيق مقفول لحماية خصوصيتك.</p><button type="button" class="btn primary" data-sanad-act="unlock">🔐 فتح بالبصمة / قفل الجهاز</button><button type="button" class="btn text" data-sanad-act="recovery-unlock">استخدام رمز الاسترداد</button><div class="lock-note">لا يتم حفظ أو إرسال بيانات بصمتك إلى SANAD.</div></div>';document.body.appendChild(el);return el;},
  show(){

    const app=document.getElementById('app'),ob=document.getElementById('onboard');
    if(app)app.hidden=true;if(ob)ob.hidden=true;
    const el=this.ensureOverlay(),p=el.querySelector('.lock-card>p'),unlockBtn=el.querySelector('[data-sanad-act="unlock"]'),recoveryBtn=el.querySelector('[data-sanad-act="recovery-unlock"]');

  },
  finishUnlock(){this.unlocked=true;this._autoPrompting=false;const el=this.ensureOverlay();el.classList.remove('auto-auth');el.hidden=true;if(this.pendingStart){this.pendingStart=false;_sanadCoreStartApp();SanadV9.afterStart(true);}else{const app=document.getElementById('app');if(app)app.hidden=false;}},
  hide(){this.finishUnlock();},
  async enable(){
    if(!this.supported()){await dialog({emoji:'🔐',title:'القفل غير متاح',msg:'فعّل قفل شاشة آمن على الجهاز أولاً.',okText:'حسناً',hideCancel:true});return;}

      let authMode='webauthn',credentialId=null;

const SanadAmountPrivacy = {

    if(!S.settings.hideAmounts){sessionAmountsRevealed=false;render();return;}

    if(!SanadSecurity.supported()){toast('التحقق بالبصمة / قفل الجهاز غير متاح');return;}

    sessionAmountsRevealed=true;

    if(!sessionAmountsRevealed)return;

const SanadFullBackup = {
  async blobToDataURL(blob){
    return await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result);
      r.onerror=()=>reject(r.error);
      r.readAsDataURL(blob);
    });
  },
  dataURLToBlob(data){
    if(typeof data!=='string'||!/^data:image\/(?:jpeg|png|webp);base64,/i.test(data))throw new Error('invalid receipt data');
    const [h,b]=data.split(','),mime=(h.match(/data:([^;]+)/)||[])[1]||'';
    const bin=atob(b||'');
    if(bin.length>20*1024*1024)throw new Error('receipt too large');
    const a=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return new Blob([a],{type:mime});
  },
  async export(){
    if(SanadExtStorage.mode==='error'){
      toast('تعذر إنشاء نسخة كاملة — تخزين المرفقات غير متاح');
      return false;
    }
    const state=snapshotState(),errs=Schema.validateStateStrict(state);
    if(errs.length){toast('تم منع التصدير: بيانات غير صالحة');return;}
    const validIds=new Set(state.transactions.map(t=>t.id));
    const receipts=await SanadExtStorage.listReceipts(),packed=[];
    for(const r of receipts){
      if(!r||!r.blob||!validIds.has(r.txId))continue;
      packed.push({txId:r.txId,meta:r.meta||{},data:await this.blobToDataURL(r.blob)});
    }

  historicalDaysFromDate(value){
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));
    if(!m)return null;
    const start=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),0,0,0,0).getTime();
    if(!Number.isFinite(start)||start>Date.now()+86400000)return null;
    return Math.max(1,Math.ceil((Date.now()-start)/86400000)+1);
  },

  async importHistoricalSms(days=0,options={}){
    if(this.historicalImporting){
      this.cancelHistoricalImport('user');
      toast('سيتم إيقاف استيراد SMS بعد الدفعة الحالية');
      return null;
    }
    if(!this.historicalSupported()){toast('استيراد SMS القديمة غير متاح على هذه النسخة');return null;}
    if(!this.historicalPermission()){
      const ok=confirm('سيقرأ SANAD رسائل SMS الموجودة على جهازك محليًا لاستخراج المعاملات المالية فقط. لا يتم إرسال الرسائل إلى أي خادم. هل تريد المتابعة؟');
      if(!ok)return null;
      this._historicalPending=true;
      this._historicalPendingDays=Number(days)||0;
      this._historicalPendingOptions=Object.assign({},options);
      try{AndroidBridge.requestHistoricalSmsPermission();}
      catch(_){this._historicalPending=false;toast('تعذر طلب صلاحية قراءة الرسائل');}
      return null;
    }
    if(!canWrite()){toast('وضع القراءة فقط');return null;}

    this.historicalImporting=true;
    this.historicalCancelRequested=false;
    this.historicalCancelReason='';
    this._historicalReviewIds=new Set();
    const startTab=S.tab;
    const startedAt=Date.now();
    let afterDate=Math.max(0,Number(options.fromDate)||0),afterId=0,pages=0;
    const total={scanned:0,matchingRows:0,financialCandidates:0,parsed:0,added:0,observed:0,review:0,duplicates:0,ignored:0,discovered:0};
    let status='complete';
    this.historicalProgress=Object.assign({pages:0},total);
    if(S.tab==='settings'||S.tab==='home')render();

    try{
      while(pages<2000){
        if(this.historicalCancelRequested||S.tab!==startTab){status='cancelled';break;}
        await this.yieldUi(24);
        if(this.historicalCancelRequested||S.tab!==startTab){status='cancelled';break;}

        pages++;
        let page=null;
        try{
          page=await this.requestHistoricalPage(Number(days)||0,afterDate,afterId,20);
        }catch(_){
          page={ok:false,status:'query-failed'};
        }
        if(!page.ok){
          status=page.status||'query-failed';
          if(status==='cancelled')status='cancelled';
          break;
        }

        total.scanned+=Number(page.scanned||0);
        total.matchingRows=Math.max(total.matchingRows,Number(page.matchingRows||0));
        total.financialCandidates+=Number(page.financialCandidates||0);

        const batch=await this.sync({
          force:true,
          userInitiated:false,
          cooperative:true,
          historical:true,
          excludeIds:this._historicalReviewIds
        });
        for(const id of (batch.reviewIds||[]))this._historicalReviewIds.add(String(id));
        total.parsed+=Number(batch.parsed||0);
        total.added+=Number(batch.added||0);
        total.observed+=Number(batch.observed||0);
        total.review+=Number(batch.review||0);
        total.duplicates+=Number(batch.duplicates||0);
        total.ignored+=Number(batch.ignored||0);
        total.discovered+=Number(batch.discovered||0);

        this.historicalProgress=Object.assign({pages},total);
        if((S.tab==='settings'||S.tab==='home')&&(pages===1||pages%8===0))render();

        if(page.done)break;
        if(page.capacityReached&&Number(batch.added||0)+Number(batch.observed||0)+Number(batch.duplicates||0)+Number(batch.ignored||0)===0){status='review-capacity';break;}
        const nextDate=Number(page.nextAfterDate||0),nextId=Number(page.nextAfterId||0);
        if(nextDate===afterDate&&nextId===afterId){status='cursor-stalled';break;}
        afterDate=nextDate;afterId=nextId;
        await this.yieldUi(24);
      }
      if(pages>=2000&&status==='complete')status='page-limit';
    }finally{
      this.historicalImporting=false;
      this.historicalCancelRequested=false;
      this.historicalProgress=null;
    }

    this.lastHistoricalImport={at:Date.now(),startedAt,status,mode:options.mode||'historical',days:Number(days)||0,pages,total,nextAfterDate:afterDate,nextAfterId:afterId};
    await SanadExtStorage.set('bankImportLastHistorical',this.lastHistoricalImport);
    if(options.mode==='recent'){
      const previous=await SanadExtStorage.get('bankImportLastRecent',null);
      this.lastRecentImport=Object.assign({},this.lastHistoricalImport,{scannedThrough:status==='complete'?startedAt:Number(previous&&previous.scannedThrough)||0});
      await SanadExtStorage.set('bankImportLastRecent',this.lastRecentImport);
    }else if(status==='complete'){
      const previous=await SanadExtStorage.get('bankImportLastRecent',null);
      this.lastRecentImport=Object.assign({},this.lastHistoricalImport,{scannedThrough:Math.max(startedAt,Number(previous&&previous.scannedThrough)||0)});
      await SanadExtStorage.set('bankImportLastRecent',this.lastRecentImport);
    }
    if(S.tab==='settings'||S.tab==='home')render();

    if(status==='cancelled')toast('تم إيقاف استيراد SMS · فُحص '+total.scanned+' رسالة',4200);
    else if(status==='complete'&&total.scanned===0)toast('Android لم يُرجع أي SMS من صندوق الرسائل',5000);
    else if(status==='review-capacity')toast('توقف الفحص لحفظ الرسائل: صندوق المراجعة ممتلئ. راجع الرسائل المعلقة ثم أعد الفحص؛ الرسائل الأصلية لم تُحذف.',8000);
    else if(status==='complete')toast('تم فحص '+total.scanned+' SMS · مالية '+total.financialCandidates+' · parsed '+total.parsed+' · أضيف '+total.added+' · مراجعة '+total.review+' · مكرر '+total.duplicates,6500);
    else if(status==='permission-restricted')toast('Android منع صلاحية قراءة SMS لهذه النسخة أو طريقة التثبيت',5000);
    else if(status==='query-failed')toast('تعذر قراءة صندوق SMS من Android',5000);
    else if(status==='timeout')toast('قراءة SMS استغرقت وقتًا طويلًا وتم إيقافها بدون تجميد التطبيق',5200);
    else if(status==='worker-unavailable')toast('خدمة قراءة SMS غير متاحة الآن · أعد فتح التطبيق',5200);
    else toast('توقف استيراد SMS قبل الاكتمال · فُحص '+total.scanned+' رسالة',5000);
    return this.lastHistoricalImport;
  },
  async onHistoricalPermissionResult(granted){

  learnSourceAlias(item,route){
    if(!item||!item.parsed||item.parsed.bankId||item.parsed.providerId)return;
    const account=(route&&route.account)||(route&&route.fromAccount)||null;
    const inst=account&&account.institutionId?Finance.getInstitution(account.institutionId):null;
    if(!inst)return;
    const aliases=[item.native&&item.native.title,item.parsed.sourceHint].map(v=>String(v||'').trim()).filter(v=>v.length>=3&&v.length<=180);
    if(!aliases.length)return;
    if(!Array.isArray(inst.notificationAliases))inst.notificationAliases=[];
    for(const alias of aliases){
      const key=alias.toLowerCase().replace(/\s+/g,' ').trim();
      if(!inst.notificationAliases.some(x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim()===key))inst.notificationAliases.push(alias);
    }
    if(inst.notificationAliases.length>12)inst.notificationAliases=inst.notificationAliases.slice(-12);
  },
  async saveCorrection(id){
    const item=this.items.find(x=>String(x.native.id)===String(id));
    if(!item||!item.parsed||!item.parsed.recognized){toast('تعذر العثور على العملية');return;}
    const kind=((document.getElementById('bankFixKind')||{}).value||item.parsed.kind);
    const amount=Number((document.getElementById('bankFixAmount')||{}).value);
    const currency=((document.getElementById('bankFixCurrency')||{}).value||item.parsed.currency);
    const sourceRaw=((document.getElementById('bankFixSource')||{}).value||'');
    const targetId=((document.getElementById('bankFixTarget')||{}).value||'')||null;
    const party=((document.getElementById('bankFixParty')||{}).value||'').trim();
    const category=((document.getElementById('bankFixCategory')||{}).value||item.parsed.category||'other');
    if(!Number.isFinite(amount)||amount<=0){toast('أدخل مبلغًا صحيحًا');return;}
    if(!sourceRaw){toast('اختر الحساب أو الكارت الصحيح');return;}
    const parts=sourceRaw.split(':'),sourceType=parts.shift(),sourceId=parts.join(':');
    const country=item.parsed.country||BankMessageCore.countryForCurrency(currency)||'UAE';
    const corrected=Object.assign({},item.parsed,{kind,amount,currency,country,confidence:1});
    if(['purchase','bill_payment','mobile_recharge'].includes(kind)){
      corrected.direction='debit';corrected.merchant=party;corrected.category=category;
    }else if(['deposit','salary','refund','incoming_transfer'].includes(kind)){
      corrected.direction='credit';corrected.merchant=party;corrected.category=kind==='salary'?'salary':'other';
    }else if(kind==='outgoing_transfer'){
      corrected.direction='debit';corrected.beneficiaryName=party;corrected.category='externalTransfer';
    }else{
      corrected.direction='transfer';
    }
    const route=BankIngestionCore.routeFromManualChoice(corrected,S,{sourceType,sourceId,targetAccountId:targetId});
    if(!route||route.status!=='routed'){toast(this.reasonLabel((route&&route.reason)||'manual-route-invalid'));return;}
    const feeInput=String((document.getElementById('bankFixFee')||{}).value||'').trim();
    const buildOptions={uid};
    if(feeInput!=='')buildOptions.confirmedFee=Number(feeInput);
    const pairId=String((document.getElementById('bankFixPair')||{}).value||'');
    if(pairId&&kind!=='internal_transfer'){toast('اختر تحويل بين حساباتي للربط بالطرف المحفوظ');return;}
    const built=pairId?BankIngestionCore.pairOwnTransfer(item.parsed,S,{counterpartTransactionId:pairId,fromAccountId:route.fromAccount&&route.fromAccount.id,toAccountId:route.targetAccount&&route.targetAccount.id},buildOptions):BankMessageCore.buildTransaction(corrected,route,buildOptions);
    if(!built.ok){toast(built.reason==='fee-confirmation-required'?'أكد الرسوم الإضافية أولًا؛ صفر فقط إذا كانت بلا رسوم':built.reason==='invalid-confirmed-fee'?'أدخل رسومًا صحيحة غير سالبة':built.reason==='fee-direction-review-required'?'رسوم الاستلام تحتاج تأكيد صافي المبلغ من المصدر':'الربط غير صالح لهذه العملية');return;}
    if(BankIngestionCore.duplicateOf(corrected,S)){this.ack([item.native.id]);await this.open();toast('العملية مضافة بالفعل');return;}
    const result=await commitCriticalMutation(async()=>{
      if(built.replacesTransactionId){
        const index=S.transactions.findIndex(t=>t.id===built.replacesTransactionId);
        if(index<0||JSON.stringify(S.transactions[index])!==JSON.stringify(built.before))throw new Error('pair-source-changed');
        S.transactions[index]=built.transaction;
      }else{
        S.transactions.push(built.transaction);
        BankIngestionCore.learnFromApproval(S,corrected,route,{uid,kind});
      }
      this.learnSourceAlias(item,route);
      this.applyReconciliation(corrected,{transaction:built.transaction,observationAccountId:built.observationAccountId});
      return true;
    });
    if(!result.ok){render();toast('تعذر حفظ التصحيح');return;}
    this.ack([item.native.id]);
    await this.sync({force:false});
    render();
    await this.open();
    toast('تمت الإضافة · SANAD تعلّم الربط');
  },
  async open(){
    await this.sync({force:false});
    const enabled=this.accessEnabled();
    const rows=this.items.map(item=>{
      const n=item.native,p=item.parsed||{},r=BankMessageCore.resolveRoute(p,S),plan=item.plan||{};
      const bank=p.bankId?UaeBankRegistryCore.get(p.bankId):null;
      const provider=p.providerId&&UaeBankRegistryCore.getProvider?UaeBankRegistryCore.getProvider(p.providerId):null;
      const amount=p.recognized?amtFull(p.amount,p.currency):'—';
      const merchant=p.merchant?'<div style="font-size:12px;color:var(--text-2);margin-top:3px">'+esc(p.merchant)+'</div>':'';
      const source=this.routeLabel({native:n,parsed:p,route:r,plan});
      const canApprove=this.canManualApprove(item);
      return '<div class="card" style="padding:14px;margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;gap:10px"><div><b>' + esc(bank?bank.name:(provider?provider.name:(n.title||'إشعار مالي'))) + '</b>' +
        '<div style="font-size:12px;color:var(--text-2);margin-top:3px">' + esc(p.recognized?this.kindLabel(p.kind):'صيغة غير معروفة') + '</div></div>' +
        '<b class="amt-val">' + amount + '</b></div>' + merchant +
        '<div style="font-size:12px;margin-top:8px;color:'+(canApprove?'var(--success)':'var(--warn)')+'">' + source + '</div>' +
        '<div style="font-size:11px;color:var(--text-3);margin-top:8px;direction:auto;white-space:normal">' + esc(String(n.text||'').slice(0,260)) + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
          (canApprove?'<button type="button" class="btn primary" data-sanad-act="bank-approve" data-id="'+esc(n.id)+'" style="margin:0;flex:1;min-width:110px">اعتماد وإضافة</button>':'') +
          (p.recognized?'<button type="button" class="btn" data-sanad-act="bank-fix" data-id="'+esc(n.id)+'" style="margin:0;flex:1;min-width:110px">✏️ تعديل وربط</button>':'') +
          '<button type="button" class="btn" data-sanad-act="bank-dismiss" data-id="'+esc(n.id)+'" style="margin:0;flex:1;min-width:90px">تجاهل</button>' +
        '</div></div>';
    }).join('');
    const last=this.lastSummary||{};
    const autoNote=last.added?'<div class="help-box"><span class="hi">✅</span><div class="ht"><b>تمت المزامنة تلقائيًا</b>أضيف '+last.added+' عملية'+(last.discovered?' · واكتُشف '+last.discovered+' حساب/كارت جديد':'')+(last.reconcileWarnings?' · '+last.reconcileWarnings+' رصيد يحتاج مراجعة':'')+'</div></div>':'';
    openSheet('<div class="sheet-head"><button type="button" class="close" data-act="close-sheet">✕</button><h2>مراجعة العمليات</h2><button type="button" class="close" data-sanad-act="bank-refresh" title="تحديث">↻</button></div>' +
      '<div class="sheet-body">' +
      (!enabled?'<div class="help-box warn"><span class="hi">🔔</span><div class="ht"><b>الوصول غير مفعّل</b>فعّل Notification Access لكي يلتقط SANAD العمليات الجديدة.</div></div>':'') +
      autoNote +
      (rows||'<div class="empty"><div class="em">✅</div><p>لا توجد عمليات تحتاج مراجعة</p></div>') +
      '</div>','bank-inbox');
  },
  async approve(id){
    const item=this.items.find(x=>String(x.native.id)===String(id));
    if(!item){await this.open();return;}
    const parsed=item.parsed;
    let plan=BankIngestionCore.plan(parsed,S,{uid});
    if(plan.action==='duplicate'){this.ack([item.native.id]);await this.open();toast('العملية مضافة بالفعل');return;}
    if(plan.reason==='possible-own-transfer'){this.openCorrection(id);return;}
    if(['auto-save','observe'].includes(plan.action)){
      const saved=await this.commitPlan(parsed,plan);
      if(!saved.ok){render();toast('تعذر إضافة العملية — لم يتم تغيير البيانات');return;}
      this.ack([item.native.id]);await this.sync({force:false});render();await this.open();toast('تمت إضافة العملية');return;
    }
    const route=BankMessageCore.resolveRoute(parsed,S);
    const built=BankMessageCore.buildTransaction(parsed,route,{uid});
    if(!built.ok){toast('اربط الحساب أو الكارت أولاً');return;}
    if(BankIngestionCore.duplicateOf(parsed,S)){this.ack([item.native.id]);await this.open();toast('العملية مضافة بالفعل');return;}
    const result=await commitCriticalMutation(async()=>{
      S.transactions.push(built.transaction);
      BankIngestionCore.learnFromApproval(S,parsed,route,{uid});
      this.applyReconciliation(parsed,{transaction:built.transaction});
      return true;
    });
    if(!result.ok){render();toast('تعذر إضافة العملية — لم يتم تغيير البيانات');return;}
    this.ack([item.native.id]);await this.sync({force:false});render();await this.open();toast('تمت إضافة العملية');
  },
  async dismiss(id){this.ack([id]);this.items=this.items.filter(x=>String(x.native.id)!==String(id));await this.open();}
};
