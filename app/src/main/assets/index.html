  updateCorrectionFields(kindChanged=false){
    const el=id=>document.getElementById(id);
    const kind=el('bankFixKind')?.value||'purchase';
    const item=this.items.find(x=>String(x.native.id)===String(this._correctionItemId));
    const parsed=item?this.correctionDraft(item):{};
    if(kindChanged){
      const source=el('bankFixSource'),target=el('bankFixTarget');
      if(source){const previous=source.value;source.innerHTML=this.correctionSourceOptions({...parsed,kind},previous);if(Array.from(source.options).some(o=>o.value===previous))source.value=previous;}
      if(target){const previous=target.value;target.innerHTML=this.correctionTargetOptions({...parsed,kind},previous);if(Array.from(target.options).some(o=>o.value===previous))target.value=previous;}
    }
    const toggle=(name,show)=>{
      const row=document.querySelector('[data-bank-conditional="'+name+'"]');
      if(row)row.hidden=!show;
    };
    const needTarget=['internal_transfer','card_repayment','cash_withdrawal'].includes(kind);
    toggle('target',needTarget);
    toggle('external',kind==='outgoing_transfer');
    toggle('incoming',['deposit','incoming_transfer'].includes(kind));
    toggle('category',['purchase','bill_payment','mobile_recharge'].includes(kind));
    const date=el('bankFixDate')?.value||'';
    toggle('date-confirm',!!parsed.transactionDate&&(parsed.transactionDate!==date||['ambiguous-date','invalid-operation-date'].includes(parsed.reviewReason)));
    toggle('currency-confirm',!!parsed.currency&&parsed.currency!==el('bankFixCurrency')?.value);
    const sourceRaw=el('bankFixSource')?.value||'';
    const [sourceType,sourceId]=sourceRaw.split(':');
    const card=sourceType==='instrument'?Finance.getInstrument(sourceId):null;
    const account=sourceRaw?Finance.getAccount(card?card.accountId:sourceId):null;
    const institution=account?Finance.getInstitution(account.institutionId):null;
    const differentCountry=!!parsed.country&&!!account&&account.country!==parsed.country;
    toggle('issuer',differentCountry||parsed.reviewReason==='issuer-jurisdiction-unconfirmed');
    const hint=el('bankFixSourceHint');
    if(hint)hint.textContent=kind==='card_repayment'?'مصدر السداد: الحساب اللي اتخصم منه المبلغ، مش البطاقة المسددة.':kind==='incoming_transfer'?'الحساب اللي استقبل الفلوس.':'اختَر الحساب أو البطاقة من البنك اللي أرسل الرسالة.';
    const hintTarget=el('bankFixTargetHint');
    if(hintTarget)hintTarget.textContent=kind==='card_repayment'?'الوجهة: حساب البطاقة الائتمانية المنتهية '+(parsed.cardLast4||'????')+'.':kind==='cash_withdrawal'?'اختر حساب الكاش الذي استلم النقد.':'لازم يكون حسابًا مختلفًا تملكه.';
    const label=el('bankFixTargetLabel');
    if(label)label.innerHTML=(kind==='card_repayment'?'البطاقة التي تم سدادها':kind==='cash_withdrawal'?'حساب الكاش الذي استلمته':'حساب الوجهة')+'<span class="bank-required">*</span>';
    const warn=el('bankFixIssuerWarning');
    if(warn){
      const bank=parsed.bankId&&UaeBankRegistryCore.get(parsed.bankId);
      const provider=parsed.providerId&&UaeBankRegistryCore.getProvider?UaeBankRegistryCore.getProvider(parsed.providerId):null;
      const mismatch=!!institution&&((parsed.bankId&&institution.bankRegistryId&&institution.bankRegistryId!==parsed.bankId)||(parsed.providerId&&institution.providerRegistryId&&institution.providerRegistryId!==parsed.providerId));
      const noSource=!sourceRaw;
      warn.hidden=!(mismatch||noSource&&!!(parsed.bankId||parsed.providerId));
      const message=mismatch?'البنك المختار مختلف عن مصدر الرسالة. اختر الحساب الصحيح أو صحّح بنك الحساب.':'لا يوجد حساب مطابق للمؤسسة في رسالة البنك. راجع بنك الحساب أو الكارت أولاً، وبعدها ارجع للمراجعة.';
      warn.innerHTML=esc(message)+'<button type="button" class="btn" data-sanad-act="bank-edit-accounts" style="margin-top:8px;width:100%;font-size:13px">فتح الحسابات وتصحيح الربط</button>';
    }
    const issue=el('bankFixIssues');
    if(issue){issue.hidden=true;issue.textContent='';}
    document.querySelectorAll('.bank-field-invalid').forEach(x=>x.classList.remove('bank-field-invalid'));
  },
  correctionIssue(id,message){
    const field=document.getElementById(id),issue=document.getElementById('bankFixIssues');
    if(issue){issue.hidden=false;issue.textContent='مطلوب قبل الحفظ: '+message;}
    if(field){
      const advanced=field.closest('details');
      if(advanced)advanced.open=true;
      field.classList.add('bank-field-invalid');
      field.setAttribute('aria-invalid','true');
      field.scrollIntoView?.({block:'center',behavior:'smooth'});
      try{field.focus({preventScroll:true});}catch(_){}
    }
    toast(message,5300);
  },

  learnSourceAlias(item,route){
    if(!item||!item.parsed||item.parsed.bankId||item.parsed.providerId)return;
    const account=(route&&route.account)||(route&&route.fromAccount)||null;
    const inst=account&&account.institutionId?Finance.getInstitution(account.institutionId):null;
    if(!inst)return;
    const aliases=[item.native&&item.native.title,item.parsed.sourceHint].map(v=>String(v||'').trim()).filter(v=>v.length>=3&&v.length<=180);
    if(!aliases.length)return;
    if(!Array.isArray(inst.notificationAliases))inst.notificationAliases=[];
    for(const alias of aliases){
      const key=alias.toLowerCase().replace(/\s+/g,' ').trim();
      if(!inst.notificationAliases.some(x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim()===key))inst.notificationAliases.push(alias);
    }
    if(inst.notificationAliases.length>12)inst.notificationAliases=inst.notificationAliases.slice(-12);
  },

    const tx=S.transactions.find(t=>t.id===id&&t.settlementStatus==='pending');if(!tx)return;
    const account=Finance.getAccount(tx.accountId),instrument=Finance.getInstrument(tx.instrumentId);if(!account||!instrument)return;
    openSheet('<div class="sheet-head"><button class="close" data-act="close-sheet">×</button><h2>تأكيد مبلغ الخصم</h2></div><div class="sheet-body">'+
      '<div class="help-box"><div class="ht">الشراء الأصلي '+amtFull(tx.amount,tx.currency)+'<br>'+esc(account.name)+' · '+esc(instrument.name||'كارت')+' ••••'+esc(instrument.last4||'')+'<br>مبلغ الخصم بعملة الحساب يحتاج تأكيدًا.</div></div>'+
      '<div class="field"><label>مبلغ الخصم بدون الرسوم ('+esc(account.currency)+')</label><input id="pendingSettlementAmount" type="number" min="0" step="0.01" inputmode="decimal"></div>'+
      '<div class="field"><label>الرسوم شاملة الضريبة ('+esc(account.currency)+')</label><input id="pendingSettlementFee" type="number" min="0" step="0.01" inputmode="decimal"><div class="field-hint">أدخل صفرًا فقط إذا تأكدت من عدم وجود رسوم إضافية.</div></div>'+
      '<label><input id="pendingSettlementConfirmed" type="checkbox"> أؤكد أن المبلغ من كشف الحساب ولنفس الشراء والكارت</label>'+
      '<button class="btn primary" data-sanad-act="bank-settlement-save" data-id="'+esc(id)+'">حفظ التسوية لنفس الشراء</button></div>','pending-settlement');
  },
  async savePendingSettlement(id){
    if(!canWrite())return;
    const fee=String(document.getElementById('pendingSettlementFee')?.value||'').trim();
    if(!fee){toast('أكد الرسوم؛ أدخل صفرًا فقط عند التأكد');return;}
    const proposal=BankIngestionCore.settlePendingPurchase(S,{transactionId:id,amount:document.getElementById('pendingSettlementAmount')?.value,fee,confirmed:!!document.getElementById('pendingSettlementConfirmed')?.checked});
    if(!proposal.ok){toast('أكد مبلغ الخصم والرسوم ونفس الشراء');return;}
    const result=await commitCriticalMutation(async()=>{
      const index=S.transactions.findIndex(t=>t.id===id);
      if(index<0||JSON.stringify(S.transactions[index])!==JSON.stringify(proposal.before))throw Error('settlement-source-changed');
      S.transactions[index]=proposal.transaction;return true;
    });
    if(!result.ok){toast('تعذر حفظ التسوية؛ الشراء محفوظ للمراجعة');return;}
    closeSheet();render();toast('تم تأكيد الخصم لنفس الشراء');
  },
  async saveCorrection(id){
    const item=this.items.find(x=>String(x.native.id)===String(id));
    if(!item){toast('تعذر العثور على العملية');return;}
    const originalRecognized=!!(item.parsed&&item.parsed.recognized);
    const fromUntrustedFile=item.native?.importProvenance==='untrusted-sms-xml';
    if((!originalRecognized||fromUntrustedFile)&&!document.getElementById('bankFixManualProof')?.checked){this.correctionIssue('bankFixManualProof','أكد مراجعة الرسالة من مصدر مستقل أولًا');return;}
    const draft=this.correctionDraft(item);
    const manualLinkId=String((document.getElementById('bankFixManualLink')||{}).value||'');
    if(manualLinkId){
      if(!(document.getElementById('bankFixConfirmSame')||{}).checked){this.correctionIssue('bankFixConfirmSame','أكد أن الرسالة لنفس العملية الموجودة قبل الربط');return;}
      const linked=BankIngestionCore.linkManualConfirmation(item.parsed,S,{transactionId:manualLinkId,confirmedSameOperation:true});
      if(!linked.ok){toast('تغيرت العملية؛ أعد المراجعة');return;}
      const result=await commitCriticalMutation(async()=>{
        const index=S.transactions.findIndex(t=>t.id===linked.replacesTransactionId);
        if(index<0||JSON.stringify(S.transactions[index])!==JSON.stringify(linked.before))return false;
        S.transactions[index]=linked.transaction;
        BankIngestionCore.rememberEventDecision(S,String(item.native.id),'duplicate',Date.now(),linked.transaction.id,{decisionSource:'user-confirmation'});
        return true;
      });
      if(!result.ok){toast('تعذر حفظ الربط؛ الدليل ما زال للمراجعة');return;}
      await this.ack([item.native.id]);await this.open();toast('ارتبط الدليل بالعملية الموجودة دون إضافة مالية');return;
    }
    const manualCandidates=originalRecognized?BankIngestionCore.manualDuplicateCandidates(item.parsed,S):[];
    if(manualCandidates.length&&!(document.getElementById('bankFixDistinctOperation')||{}).checked){this.correctionIssue('bankFixManualLink','قد تكون هذه حركة مكررة؛ اربط الموجودة أو أكد أنها عملية مستقلة');return;}
    const kind=((document.getElementById('bankFixKind')||{}).value||draft.kind);
    const selectedDate=String(document.getElementById('bankFixDate')?.value||'');
    const selectedClock=String(document.getElementById('bankFixTime')?.value||'');
    const parsedDate=/^(\d{4})-(\d{2})-(\d{2})$/.exec(selectedDate);
    if(!parsedDate){this.correctionIssue('bankFixDate','اختر تاريخ العملية الصحيح');return;}
    const validDate=new Date(Date.UTC(Number(parsedDate[1]),Number(parsedDate[2])-1,Number(parsedDate[3])));
    if(!Number.isFinite(validDate.getTime())||validDate.toISOString().slice(0,10)!==selectedDate){this.correctionIssue('bankFixDate','تاريخ العملية غير صالح');return;}
    if(selectedClock&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(selectedClock)){this.correctionIssue('bankFixTime','الساعة غير صالحة؛ اتركها فارغة إن لم تعرفها');return;}
    const dateConfirmed=!!document.getElementById('bankFixConfirmDate')?.checked;
    const sourceDate=String(draft.transactionDate||'');
    const invalidSourceDate=!!sourceDate&&bankReviewDateInputValue(sourceDate,draft.postedAt)!==sourceDate;
    const correctedSourceDate=!!sourceDate&&selectedDate!==sourceDate;
    if(originalRecognized&&(['ambiguous-date','invalid-operation-date'].includes(draft.reviewReason)||invalidSourceDate||correctedSourceDate)&&!dateConfirmed){this.correctionIssue('bankFixConfirmDate','حدد مربع تأكيد التاريخ بعد مطابقته برسالة البنك أو كشف الحساب');return;}
    const amount=Number((document.getElementById('bankFixAmount')||{}).value);
    const currency=((document.getElementById('bankFixCurrency')||{}).value||draft.currency);
    const sourceRaw=((document.getElementById('bankFixSource')||{}).value||'');
    const targetId=((document.getElementById('bankFixTarget')||{}).value||'')||null;
    const party=((document.getElementById('bankFixParty')||{}).value||'').trim();
    const category=((document.getElementById('bankFixCategory')||{}).value||draft.category||'other');
    if(!Number.isFinite(amount)||amount<=0){this.correctionIssue('bankFixAmount','أدخل مبلغًا أكبر من صفر');return;}
    if(!sourceRaw){this.correctionIssue('bankFixSource','اختر حسابًا من البنك الذي أرسل الرسالة. لو مش موجود افتح الحسابات وصحح ربط البنك.');return;}
    if(['card_repayment','internal_transfer','cash_withdrawal'].includes(kind)&&!targetId){this.correctionIssue('bankFixTarget',kind==='card_repayment'?'حدد حساب البطاقة التي تم سدادها':kind==='cash_withdrawal'?'حدد حساب الكاش الذي استلم المبلغ':'حدد حساب الوجهة للتحويل');return;}
    const parts=sourceRaw.split(':'),sourceType=parts.shift(),sourceId=parts.join(':');
    const chosenInstrument=sourceType==='instrument'?Finance.getInstrument(sourceId):null;
    const chosenAccount=Finance.getAccount(chosenInstrument?chosenInstrument.accountId:sourceId);
    if(!chosenAccount||chosenAccount.archived){this.correctionIssue('bankFixSource','الحساب المحدد غير موجود أو مؤرشف؛ اختَر حسابًا نشطًا');return;}
    const chosenIssuer=Finance.getInstitution(chosenAccount.institutionId);
    // A merchant currency or locale is not sufficient evidence to change issuer.
    // Never attach a bank/provider's authenticated SMS to a different institution.
    const egyptNbdCorrection=originalRecognized&&draft.reviewReason==='issuer-jurisdiction-unconfirmed'&&draft.bankId==='emirates-nbd'&&chosenIssuer&&chosenIssuer.bankRegistryId==='emirates-nbd-egypt'&&!!document.getElementById('bankFixConfirmIssuer')?.checked;
    if(originalRecognized&&draft.bankId&&chosenIssuer&&chosenIssuer.bankRegistryId&&chosenIssuer.bankRegistryId!==draft.bankId&&!egyptNbdCorrection){this.correctionIssue('bankFixSource','رسالة البنك من مؤسسة مختلفة عن الحساب المختار. افتح الحسابات وصحح مؤسسة الحساب، أو اختر حسابًا مطابقًا.');return;}
    if(originalRecognized&&draft.providerId&&chosenIssuer&&chosenIssuer.providerRegistryId&&chosenIssuer.providerRegistryId!==draft.providerId){this.correctionIssue('bankFixSource','مصدر الرسالة محفظة أخرى؛ اختر المحفظة المطابقة');return;}
    if(originalRecognized&&draft.country&&chosenAccount.country!==draft.country&&!document.getElementById('bankFixConfirmIssuer')?.checked){this.correctionIssue('bankFixConfirmIssuer','أكد اختلاف بلد الحساب بعد مراجعة بياناته');return;}
    if(originalRecognized&&currency!==draft.currency&&!document.getElementById('bankFixConfirmCurrency')?.checked){this.correctionIssue('bankFixConfirmCurrency','أكد أنك صححت العملة بناءً على الرسالة');return;}
    const issuerVerified=!!document.getElementById('bankFixConfirmIssuer')?.checked;
    const corrected=Object.assign({},draft,{kind,amount,currency,country:chosenAccount.country,confidence:1,transactionDate:selectedDate,transactionTime:selectedClock||null});
    if(['ambiguous-date','invalid-operation-date'].includes(draft.reviewReason)&&dateConfirmed)corrected.reviewReason=null;
    if(egyptNbdCorrection)corrected.bankId='emirates-nbd-egypt';
    if(draft.reviewReason==='issuer-jurisdiction-unconfirmed'&&issuerVerified&&chosenIssuer&&chosenIssuer.bankRegistryId===corrected.bankId)corrected.reviewReason=null;
    if(['purchase','bill_payment','mobile_recharge'].includes(kind)){
      corrected.direction='debit';corrected.merchant=party;corrected.category=category;
    }else if(['deposit','salary','refund','incoming_transfer'].includes(kind)){
      corrected.direction='credit';corrected.merchant=party;corrected.category=kind==='salary'?'salary':'other';
    }else if(kind==='outgoing_transfer'){
      corrected.direction='debit';corrected.beneficiaryName=party;corrected.category='externalTransfer';
    }else{
      corrected.direction='transfer';
    }
    const route=BankIngestionCore.routeFromManualChoice(corrected,S,{sourceType,sourceId,targetAccountId:targetId});
    if(!route||route.status!=='routed'){
      const reason=route?.reason||'manual-route-invalid',isTarget=/repayment|transfer|cash-destination/.test(reason);
      const message=reason==='manual-repayment-card-mismatch'?'حساب السداد المختار لا يخص البطاقة '+(corrected.cardLast4||'')+'. اختر بطاقة الوجهة المطابقة.':reason==='manual-repayment-invalid'?'اختَر حساب الخصم ثم حساب البطاقة الائتمانية كوجهة؛ لازم يكونا حسابين مختلفين.':reason==='manual-transfer-invalid'?'اختَر حسابين مختلفين بنفس العملة للتحويل.':reason==='fx-review-required'?'العملية تحتاج تسوية عملة مؤكدة؛ لا تُخمن سعر الصرف.':'الحساب أو البطاقة غير مطابقين لنوع العملية أو العملة؛ راجع الاختيار.';
      this.correctionIssue(isTarget?'bankFixTarget':'bankFixSource',message);return;
    }
    const feeInput=String((document.getElementById('bankFixFee')||{}).value||'').trim();
    const buildOptions={uid,date:selectedDate};
    const settlementInput=String((document.getElementById('bankFixSettlement')||{}).value||'').trim();
    if(settlementInput)buildOptions.confirmedSettlementAmount=settlementInput;
    if(document.getElementById('bankFixRetainPending')?.checked)buildOptions.allowPendingSettlement=true;
    // Original source text remains attached. Currency changes require confirmation above.
    if(['deposit','incoming_transfer'].includes(kind)){
      if(!(document.getElementById('bankFixExternalIncome')||{}).checked){this.correctionIssue('bankFixExternalIncome','أكد إن المبلغ دخل من خارج حساباتك، وإلا اختَر تحويل بين حساباتك');return;}
      buildOptions.confirmedIncomingOrigin='external-income';
    }
    if(kind==='outgoing_transfer'){if(!document.getElementById('bankFixExternalDestination')?.checked){this.correctionIssue('bankFixExternalDestination','أكد إن الوجهة خارج حساباتك أو غيّر النوع لتحويل بين حساباتك');return;}buildOptions.confirmedOutgoingDestination='external';}
    if(feeInput!=='')buildOptions.confirmedFee=Number(feeInput);
    const pairId=String((document.getElementById('bankFixPair')||{}).value||'');
    if(pairId&&kind!=='internal_transfer'){this.correctionIssue('bankFixKind','ربط طرف محفوظ يحتاج نوع «تحويل بين حساباتي»');return;}
    const built=pairId?BankIngestionCore.pairOwnTransfer(item.parsed,S,{counterpartTransactionId:pairId,fromAccountId:route.fromAccount&&route.fromAccount.id,toAccountId:route.targetAccount&&route.targetAccount.id},buildOptions):BankMessageCore.buildTransaction(corrected,route,buildOptions);
    if(built.ok&&built.transaction.type==='expense'&&corrected.category!==draft.category)built.transaction.userCategoryConfirmed=true;
    if(built.ok&&egyptNbdCorrection)built.transaction.bankIssuerCorrection={from:draft.bankId,to:corrected.bankId,issuerCountry:chosenAccount.country,confirmedByUser:true,source:'manual-review',at:Date.now()};
    if(built.ok&&fromUntrustedFile)built.transaction.bankImportSource='sms-xml-user-confirmed';
    if(built.ok&&manualCandidates.length)built.transaction.manualImportResolution={decision:'distinct-operation',candidateIds:manualCandidates.map(t=>t.id).sort(),source:'user-confirmation',at:Date.now()};
    if(built.ok&&!built.replacesTransactionId){
      const original=draft;
      built.transaction.bankLinkedImportEvents=[{key:BankMessageCore.dedupeKey(original),eventId:original.eventId||null,bankId:original.bankId||null,providerId:original.providerId||null,currency:original.currency,amount:original.amount,ref:original.transactionRef||null,kind:original.kind,postedAt:Number(original.postedAt),text:original.raw||'',availableBalance:original.availableBalance}];
    }
    if(!built.ok){
      const issue=built.reason||'not-routed';
      const field=issue==='fee-confirmation-required'||issue==='invalid-confirmed-fee'?'bankFixFee':issue==='fx-review-required'?'bankFixSettlement':issue==='manual-repayment-card-mismatch'?'bankFixTarget':'bankFixSource';
      const message=issue==='fee-confirmation-required'?'البنك ذكر رسومًا؛ اكتب قيمتها المؤكدة. اكتب صفرًا فقط لو متأكد مفيش رسوم.':issue==='fx-review-required'?'أدخل مبلغ الخصم الفعلي بعملة الحساب من كشف البنك، أو اتركها للمراجعة.':issue==='manual-repayment-card-mismatch'?'اختَر حساب البطاقة المسددة المنتهية '+(corrected.cardLast4||'')+'.':this.reasonLabel(issue);
      this.correctionIssue(field,message||'العملية تحتاج مراجعة إضافية');return;
    }
    const repairHold=BankIngestionCore.reviewHold(S,String(item.native.id));
    if(repairHold&&repairHold.quarantinedTransactionId&&!built.replacesTransactionId){
      if(S.transactions.some(t=>t.id===repairHold.quarantinedTransactionId)){toast('هوية العملية المعزولة موجودة بالفعل؛ راجع الربط');return;}
      built.transaction.id=repairHold.quarantinedTransactionId;
      built.transaction.bankRepairAudit={source:'user-confirmation',reason:repairHold.reason,at:Date.now(),quarantinedTransactionId:repairHold.quarantinedTransactionId};
    }
    if(BankIngestionCore.duplicateOf(corrected,S)){await this.ack([item.native.id]);await this.open();toast('العملية مضافة بالفعل؛ لا تُضف حركة أخرى، راجع الرسالة المعزولة أو تجاهلها إن حُسمت');return;}
    const confirmIdentity=originalRecognized&&!!(document.getElementById('bankFixConfirmAccountIdentity')||{}).checked;
    const result=await commitCriticalMutation(async()=>{
      if(confirmIdentity&&!BankIngestionCore.confirmAccountIdentity(S,item.parsed,route.account&&route.account.id,{confirmed:true}).ok)throw new Error('account-identity-conflict');
      if(built.replacesTransactionId){
        const index=S.transactions.findIndex(t=>t.id===built.replacesTransactionId);
        if(index<0||JSON.stringify(S.transactions[index])!==JSON.stringify(built.before))throw new Error('pair-source-changed');
        S.transactions[index]=built.transaction;
      }else{
        S.transactions.push(built.transaction);
        if(originalRecognized&&!fromUntrustedFile&&!confirmIdentity&&built.transaction.settlementStatus!=='pending'&&currency===draft.currency&&chosenAccount.country===draft.country)BankIngestionCore.learnFromApproval(S,corrected,route,{uid,kind});
      }
      BankIngestionCore.rememberEventDecision(S,String(item.native.id),'saved',Date.now(),built.transaction.id,{decisionSource:'user-confirmation'});
      if(originalRecognized&&!fromUntrustedFile&&chosenAccount.country===draft.country)this.learnSourceAlias(item,route);
      if(!fromUntrustedFile&&built.transaction.settlementStatus!=='pending')this.applyReconciliation(corrected,{transaction:built.transaction,observationAccountId:built.observationAccountId});
      return true;
    });
    if(!result.ok){render();toast('تعذر حفظ التصحيح');return;}
    await this.ack([item.native.id]);
    await this.sync({force:false});
    render();
    await this.open();
    toast(built.transaction.settlementStatus==='pending'?'تم حفظ الشراء · مبلغ الخصم يحتاج تأكيدًا':'تم حفظ قرار هذه الحركة');
  },
  async open(page=0){
    await this.sync({force:false,viewReview:true});
    const enabled=this.accessEnabled();
    const pageSize=40,total=this.items.length,totalPages=Math.max(1,Math.ceil(total/pageSize));
    const pageIndex=Math.min(totalPages-1,Math.max(0,Number(page)||0));
    const rows=this.items.slice(pageIndex*pageSize,(pageIndex+1)*pageSize).map(item=>{
      const n=item.native,p=item.parsed||{},r=BankMessageCore.resolveRoute(p,S),plan=item.plan||{};
      const bank=p.bankId?UaeBankRegistryCore.get(p.bankId):null;
      const provider=p.providerId&&UaeBankRegistryCore.getProvider?UaeBankRegistryCore.getProvider(p.providerId):null;
      const amount=p.recognized?amtFull(p.amount,p.currency):'—';
      const merchant=p.merchant?'<div style="font-size:12px;color:var(--text-2);margin-top:3px">'+esc(p.merchant)+'</div>':'';
      const source=this.routeLabel({native:n,parsed:p,route:r,plan});
      const canApprove=this.canManualApprove(item);
      const postedAt=Number(n.postedAt);
      const receivedAt=Number.isFinite(postedAt)&&postedAt>0?new Date(postedAt).toLocaleString('ar-AE',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'التاريخ غير متاح';
      const bankTime=p.transactionDate?(' · وقت العملية: '+p.transactionDate+(p.transactionTime?' '+p.transactionTime:'')):'';
      return '<div class="card" style="padding:14px;margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;gap:10px"><div><b>' + esc(bank?bank.name:(provider?provider.name:(n.title||'إشعار مالي'))) + '</b>' +
        '<div style="font-size:12px;color:var(--text-2);margin-top:3px">' + esc(p.recognized?this.kindLabel(p.kind):'صيغة غير معروفة') + '</div></div>' +
        '<b class="amt-val">' + amount + '</b></div>' + merchant +
        '<div style="font-size:12px;margin-top:6px;color:var(--text-2)">استلام الرسالة: '+esc(receivedAt)+esc(bankTime)+'</div>' +
        '<div style="font-size:12px;margin-top:8px;color:'+(canApprove?'var(--success)':'var(--warn)')+'">' + source + '</div>' +
        '<details style="margin-top:8px;font-size:12px;color:var(--text-2)"><summary style="cursor:pointer">عرض نص الرسالة الأصلية</summary><p style="white-space:normal;direction:auto;overflow-wrap:anywhere">'+esc(String(n.text||'').slice(0,1000))+'</p></details>' +
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
          (canApprove?'<button type="button" class="btn primary" data-sanad-act="bank-approve" data-id="'+esc(n.id)+'" style="margin:0;flex:1;min-width:110px">اعتماد وإضافة</button>':'') +
          '<button type="button" class="btn" data-sanad-act="bank-fix" data-id="'+esc(n.id)+'" style="margin:0;flex:1;min-width:110px">'+this.icon('edit')+' '+(p.recognized?'تعديل وربط':'إدخال يدوي آمن')+'</button>' +
          '<button type="button" class="btn" data-sanad-act="bank-dismiss" data-id="'+esc(n.id)+'" style="margin:0;flex:1;min-width:90px">تجاهل</button>' +
        '</div></div>';
    }).join('');
    const last=this.lastSummary||{};
    const autoNote=last.added?'<div class="help-box"><span class="hi">✅</span><div class="ht"><b>تمت المزامنة تلقائيًا</b>أضيف '+last.added+' عملية'+(last.discovered?' · واكتُشف '+last.discovered+' حساب/كارت جديد':'')+(last.reconcileWarnings?' · '+last.reconcileWarnings+' رصيد يحتاج مراجعة':'')+'</div></div>':'';
    openSheet('<div class="sheet-head"><button type="button" class="close" data-act="close-sheet">✕</button><h2>مراجعة العمليات</h2><button type="button" class="close" data-sanad-act="bank-refresh" title="تحديث">↻</button></div>' +
      '<div class="sheet-body"><div class="field-hint">راجع المبلغ والتاريخ والحساب. افتح «تعديل وربط» لو المصدر غير واضح. العمليات المشكوك فيها لا تُعتمد تلقائيًا.</div>' +
      (!enabled?'<div class="help-box warn"><span class="hi">🔔</span><div class="ht"><b>الوصول غير مفعّل</b>فعّل Notification Access لكي يلتقط SANAD العمليات الجديدة.</div></div>':'') +
      autoNote +
      (total?'<div class="field-hint" role="status">عرض '+(pageIndex*pageSize+1)+'–'+Math.min(total,(pageIndex+1)*pageSize)+' من '+total+'</div>':'') +
      (rows||'<div class="empty"><div class="em">✅</div><p>لا توجد عمليات تحتاج مراجعة</p></div>') +
      (totalPages>1?'<nav aria-label="صفحات المراجعة" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0"><button class="btn" data-sanad-act="bank-review-page" data-page="'+(pageIndex-1)+'" '+(pageIndex===0?'disabled':'')+'>السابق</button><span>'+ (pageIndex+1)+' / '+totalPages+'</span><button class="btn" data-sanad-act="bank-review-page" data-page="'+(pageIndex+1)+'" '+(pageIndex+1>=totalPages?'disabled':'')+'>التالي</button></nav>':'') +
      '</div>','bank-inbox');
  },
  async approve(id){
    const item=this.items.find(x=>String(x.native.id)===String(id));
    if(!item){await this.open();return;}
    // Enforce file provenance at the write entrypoint, not just by hiding
    // the quick-approve button in the review UI.
    if(item.native?.importProvenance==='untrusted-sms-xml'){this.openCorrection(id);return;}
    const parsed=item.parsed;
    let plan=BankIngestionCore.plan(parsed,S,{uid});
    if(plan.action==='duplicate'){await this.ack([item.native.id]);await this.open();toast('العملية مضافة بالفعل');return;}
    if(['possible-own-transfer','possible-manual-duplicate','possible-duplicate','incoming-origin-unconfirmed','repair-destination-unconfirmed','repair-evidence-match-review'].includes(plan.reason)){this.openCorrection(id);return;}
    if(['auto-save','observe'].includes(plan.action)){
      const saved=await this.commitPlan(parsed,plan);
      if(!saved.ok){render();toast('تعذر إضافة العملية — لم يتم تغيير البيانات');return;}
      await this.ack([item.native.id]);await this.sync({force:false});render();await this.open();toast('تمت إضافة العملية');return;
    }
    const route=BankMessageCore.resolveRoute(parsed,S);
    const built=BankMessageCore.buildTransaction(parsed,route,{uid});
    if(!built.ok){toast('اربط الحساب أو الكارت أولاً');return;}
    if(BankIngestionCore.duplicateOf(parsed,S)){await this.ack([item.native.id]);await this.open();toast('العملية مضافة بالفعل');return;}
    const result=await commitCriticalMutation(async()=>{
      S.transactions.push(built.transaction);
      BankIngestionCore.rememberEventDecision(S,String(item.native.id),'saved',Date.now(),built.transaction.id,{decisionSource:'user-confirmation'});
      BankIngestionCore.learnFromApproval(S,parsed,route,{uid});
      this.applyReconciliation(parsed,{transaction:built.transaction});
      return true;
    });
    if(!result.ok){render();toast('تعذر إضافة العملية — لم يتم تغيير البيانات');return;}
    await this.ack([item.native.id]);await this.sync({force:false});render();await this.open();toast('تمت إضافة العملية');
  },
  async dismiss(id){
    const result=await commitCriticalMutation(async()=>BankIngestionCore.rememberEventDecision(S,String(id),'dismissed',Date.now()));
    if(!result.ok){toast('تعذر حفظ الاستبعاد؛ الرسالة ما زالت للمراجعة');return false;}
    await this.ack([id]);this.items=this.items.filter(x=>String(x.native.id)!==String(id));await this.open();return true;
  }
};
