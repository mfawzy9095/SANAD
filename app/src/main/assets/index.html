<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B62">
<title>SANAD — سند</title>
<style>
:root{
  --bg:#F7F4EF;--surface:#fff;--surface-2:#FBF9F5;--surface-3:#F1ECE4;
  --ink:#122A33;--ink-2:#5C6E77;--ink-3:#8B99A1;
  --line:#EDE7DD;--line-2:#E2DBD0;
  --teal:#0E6B62;--teal-2:#12857A;--teal-ink:#0A4F49;--teal-tint:#E1EFEC;--teal-tint-2:#F0F7F5;
  --green:#3E9A6D;--green-tint:#E5F3EC;--amber:#C0862C;--amber-tint:#FBF1DC;
  --red:#C2564C;--red-tint:#F9E9E7;
  --r-lg:20px;--r-md:16px;--r-sm:12px;
  --sh-1:0 1px 2px rgba(18,42,51,.05),0 2px 10px rgba(18,42,51,.04);
  --sh-2:0 12px 30px -14px rgba(14,107,98,.4);
  --sh-3:0 26px 60px -24px rgba(18,42,51,.5);
  --nav-h:66px;
}
.app[data-theme="dark"]{
  --bg:#0F181B;--surface:#162126;--surface-2:#1B282D;--surface-3:#223035;
  --ink:#E9F1F1;--ink-2:#A2B2B8;--ink-3:#78898F;--line:#243338;--line-2:#2C3D43;
  --teal:#2BA396;--teal-2:#39BCAC;--teal-ink:#8FE0D4;--teal-tint:#16302F;--teal-tint-2:#132827;
  --green:#5CB98A;--green-tint:#16301F;--amber:#D9A44D;--amber-tint:#31250E;
  --red:#D9776C;--red-tint:#331A18;--sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 12px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#E7E1D7;color:var(--ink);overscroll-behavior:none;
  font-family:'Cairo',Tahoma,Arial,'Segoe UI',sans-serif; font-optical-sizing:auto; text-rendering:optimizeLegibility}
.app,.app *:not(.rawbox){font-family:'Cairo',Tahoma,Arial,'Segoe UI',sans-serif!important}
button,input,textarea,select{font-family:'Cairo',Tahoma,Arial,'Segoe UI',sans-serif!important;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
::-webkit-scrollbar{width:0;height:0}
.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 620px at 50% -12%,#F4EFE7,#E4DED3 62%,#D9D2C5)}
.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){.stage{padding:26px}
 .app{height:min(900px,calc(100dvh - 52px));border-radius:36px;box-shadow:var(--sh-3),0 0 0 1px rgba(18,42,51,.08)}}
.view{position:relative;flex:1;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 30px}
.anim{animation:sIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes sIn{from{opacity:0;transform:translateX(var(--sl,14px))}to{opacity:1;transform:none}}
.app[dir="rtl"] .anim{--sl:-14px}
.frtl{display:inline-flex}
.app[dir="rtl"] .frtl{transform:scaleX(-1)}
.hdr{position:relative;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;flex:none}
.hrow{display:flex;align-items:center;gap:10px;min-height:44px}
.hdr h1{font-size:22px;font-weight:700;margin:0;flex:1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:12.5px;color:var(--ink-2);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--sh-1);position:relative;transition:transform .15s;flex:none}
.ib:active{transform:scale(.93)}
.ib.gh{background:none;border-color:transparent;box-shadow:none}
.av{width:44px;height:44px;border-radius:15px;background:linear-gradient(150deg,var(--teal-2),var(--teal-ink));
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;box-shadow:var(--sh-2);flex:none}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.cp{padding:16px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;
  background:linear-gradient(155deg,#12857A,#0E6B62 48%,#0A4F49);box-shadow:0 20px 42px -22px rgba(10,79,73,.75);
  animation:up .4s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero:after{content:"";position:absolute;right:-70px;bottom:-90px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.hero .lb{font-size:13px;opacity:.85;font-weight:600;display:flex;align-items:center;gap:6px;position:relative}
.hero .amt{font-size:34px;font-weight:700;letter-spacing:-.7px;margin-top:8px;line-height:1.15;position:relative}
.hgrid{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);position:relative}
.hcell{flex:1;min-width:0}
.hcell .k{font-size:11.5px;opacity:.82;font-weight:600}
.hcell .v{font-size:15.5px;font-weight:700;margin-top:3px}
.hsep{width:1px;background:rgba(255,255,255,.2)}
.track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .8s cubic-bezier(.22,1,.36,1)}
.track.warn>i{background:var(--amber)}
.track.over>i{background:var(--red)}
.money{display:inline-flex;align-items:baseline;font-variant-numeric:tabular-nums}
.money .cur{font-size:.66em;font-weight:700;opacity:.72;margin-inline-start:4px}
.sign{font-size:.78em;opacity:.75;margin-inline-end:2px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
.sec h2{font-size:15px;font-weight:700;margin:0}
.lnk{font-size:13px;font-weight:700;color:var(--teal);display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 4px}
.ainote{display:flex;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--teal-tint-2);
  border:1px solid var(--teal-tint);align-items:flex-start}
.ainote.warn{background:var(--amber-tint);border-color:transparent}
.aib{width:34px;height:34px;border-radius:12px;background:var(--teal-tint);color:var(--teal);display:grid;place-items:center;flex:none}
.ainote.warn .aib{background:var(--surface);color:var(--amber)}
.ainote .tt{font-size:12.5px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:5px}
.ainote.warn .tt{color:var(--amber)}
.ainote .bd{font-size:13.5px;line-height:1.7;color:var(--ink-2);margin-top:3px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:var(--sh-1);min-height:106px;
  justify-content:center;transition:transform .16s}
.qa button:active{transform:scale(.95)}
.qic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--teal-tint);color:var(--teal)}
.qic.b{background:var(--amber-tint);color:var(--amber)}
.qic.c{background:#E9EEF8;color:#4A63C0}
.app[data-theme="dark"] .qic.c{background:#1B2440;color:#8FA4EE}
.qlb{font-size:12px;font-weight:700;text-align:center;line-height:1.35}
.txlist{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1)}
.swbox{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swbox:last-child{border-bottom:0}
.swacts{position:absolute;top:0;bottom:0;right:0;display:flex}
.app[dir="rtl"] .swacts{right:auto;left:0}
.swacts button{width:52px;display:grid;place-items:center;color:#fff}
.swacts .e{background:#5C6E77}
.swacts .d{background:var(--red)}
.swrow{position:relative;background:var(--surface);z-index:1;will-change:transform;
  transition:transform .28s cubic-bezier(.22,1,.36,1);touch-action:pan-y}
.swrow.drag{transition:none}
.tx{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:66px}
.txic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.txm{flex:1;min-width:0}
.txm .a{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.txm .b{font-size:11.8px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.txa{font-size:14.5px;font-weight:700;white-space:nowrap}
.txa.inc{color:var(--green)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px;gap:8px}
.grp-h .d1{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.grp-h .d2{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:.18s}
.chip.sm{height:30px;padding:0 11px;font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:var(--sh-2)}
.btn{min-height:52px;border-radius:var(--r-md);font-weight:700;font-size:15px;display:flex;align-items:center;
  justify-content:center;gap:8px;padding:0 18px;width:100%;transition:transform .14s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn.p{background:var(--teal);color:#fff;box-shadow:var(--sh-2)}
.btn.g{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.s{background:var(--teal-tint);color:var(--teal)}
.btn.d{background:var(--red-tint);color:var(--red)}
.btn.sm{min-height:42px;font-size:13.5px;border-radius:var(--r-sm)}
.field{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:14px;
  font-size:15px;line-height:1.7;outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
textarea.field{min-height:112px;resize:none}
.field.big{font-size:17px;font-weight:600;min-height:120px}
.fl{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:0 14px;min-height:48px;box-shadow:var(--sh-1)}
.search input{flex:1;border:0;outline:none;background:none;font-size:14.5px;min-width:0}
.seg{display:flex;background:var(--surface-3);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--teal);box-shadow:var(--sh-1)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);
  min-height:58px;width:100%;text-align:start;background:var(--surface)}
.row:last-child{border-bottom:0}
.ric{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);
  color:var(--ink-2);flex:none}
.rb{flex:1;min-width:0}
.rt{font-size:14.5px;font-weight:600}
.rs{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.grp{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh-1);background:var(--surface)}
.gt{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:20px 4px 8px;letter-spacing:.4px;text-transform:uppercase}
.sw{width:48px;height:29px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-2);
  position:relative;flex:none;transition:background .25s}
.sw>i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.22,1,.36,1);display:block}
.sw.on{background:var(--teal);border-color:var(--teal)}
.sw.on>i{transform:translateX(19px)}
.app[dir="rtl"] .sw>i{left:auto;right:3px}
.app[dir="rtl"] .sw.on>i{transform:translateX(-19px)}
.exrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:60px}
.exrow:last-child{border-bottom:0}
.exk{font-size:12px;color:var(--ink-3);font-weight:700;min-width:66px}
.exv{flex:1;font-size:14.5px;font-weight:600;min-width:0;text-align:start}
.exv.mut{color:var(--ink-3);font-weight:500;font-style:italic}
.exrow.flag{background:var(--amber-tint)}
.exin{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:14.5px;
  background:var(--surface);outline:none;font-weight:600}
.exin:focus{border-color:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;
  font-size:11px;font-weight:700;white-space:nowrap}
.pill.w{background:var(--amber-tint);color:var(--amber)}
.pill.o{background:var(--green-tint);color:var(--green)}
.pill.t{background:var(--teal-tint);color:var(--teal)}
.pill.g{background:var(--surface-3);color:var(--ink-2)}
.pill.r{background:var(--red-tint);color:var(--red)}
.tabbar{position:relative;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);flex:none;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:var(--nav-h);color:var(--ink-3);font-size:10.5px;font-weight:700;transition:color .2s}
.tabbar button.on{color:var(--teal)}
.fabw{position:relative}
.fab{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:20px;
  display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--teal-2),var(--teal-ink));
  box-shadow:0 14px 26px -10px rgba(10,79,73,.6),0 0 0 5px var(--bg)}
.fab:active{transform:translateX(-50%) scale(.93)}
.bk{position:absolute;inset:0;background:rgba(18,42,51,.45);z-index:60;animation:fd .2s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:26px 26px 0 0;
  max-height:88%;display:flex;flex-direction:column;box-shadow:0 -20px 50px -20px rgba(18,42,51,.5);
  animation:su .3s cubic-bezier(.22,1,.36,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line-2);margin:9px auto 0;flex:none}
.shd{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex:none}
.shd h3{font-size:16.5px;font-weight:700;margin:0;flex:1}
.shb{overflow-y:auto;padding:4px 18px 20px;flex:1}
.shf{padding:10px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:var(--surface);display:flex;gap:10px}
.toasts{position:absolute;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:var(--r-md);background:var(--ink);
  color:#fff;box-shadow:var(--sh-3);font-size:13.5px;font-weight:700;animation:tin .28s cubic-bezier(.22,1,.36,1)}
.app[data-theme="dark"] .toast{background:#EAF1F1;color:#0F181B}
@keyframes tin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 22px;gap:4px}
.empty h4{margin:12px 0 0;font-size:17px;font-weight:700}
.empty p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.7;max-width:280px}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 37%,var(--surface-3) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:46px}
.wave i{width:5px;border-radius:99px;background:var(--teal);display:block;height:100%;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
.micb{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,var(--teal-2),var(--teal-ink));box-shadow:0 18px 38px -14px rgba(10,79,73,.6)}
.micb.rec{animation:pls 1.5s ease-in-out infinite}
@keyframes pls{0%,100%{box-shadow:0 18px 38px -14px rgba(10,79,73,.6),0 0 0 0 rgba(14,107,98,.3)}
 50%{box-shadow:0 18px 38px -14px rgba(10,79,73,.6),0 0 0 22px rgba(14,107,98,0)}}
.spin{animation:sp 1s linear infinite;display:inline-flex}
@keyframes sp{to{transform:rotate(360deg)}}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.catcell{border-radius:14px;padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:700;text-align:center;
  min-height:80px;justify-content:center}
.catcell.on{border-color:var(--teal);background:var(--teal-tint-2);color:var(--teal);box-shadow:0 0 0 2px var(--teal-tint)}
.currow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);min-height:56px;width:100%;text-align:start}
.currow.on{border-color:var(--teal);background:var(--teal-tint-2)}
.curc{width:46px;height:36px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;
  font-weight:800;font-size:11.5px;color:var(--ink-2);flex:none}
.currow.on .curc{background:var(--teal);color:#fff}
.onb{position:absolute;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column}
.dots{display:flex;gap:7px;justify-content:center;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line-2);transition:.3s}
.dots i.on{width:22px;background:var(--teal)}
.numin{font-size:26px;font-weight:700;background:none;border:0;outline:none;width:100%;
  font-variant-numeric:tabular-nums;padding:0}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.65}
.divider{height:1px;background:var(--line);margin:12px 0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obb{animation:obf .35s cubic-bezier(.22,1,.36,1)}
@keyframes obf{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;flex:1;min-width:0}
.boxin{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:16px;padding:12px 14px}
.bitem{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);
  padding:13px 14px;margin-bottom:10px;transition:opacity .2s}
.bitem.off{opacity:.5}

/* ─────────── selectors ─────────── */
function sel(){
  var b = base(), now = new Date(), i;
  var txs = S.transactions.slice().sort(function(a,c){ return new Date(c.date) - new Date(a.date); });
  function sumExp(arr){ var s = 0, q; for (q=0;q<arr.length;q++) if (arr[q].type === "expense") s += bAmt(arr[q]); return s; }
  var mStart = customMonthStart(now), mEnd = addMonths(mStart,1);
  var pMStart = addMonths(mStart,-1);
  var thisM = [], lastM = [];
  for (i=0;i<txs.length;i++){
    var d = new Date(txs[i].date);
    if (d >= mStart && d < mEnd) thisM.push(txs[i]);
    else if (d >= pMStart && d < mStart) lastM.push(txs[i]);
  }
  var spentM = sumExp(thisM), spentL = sumExp(lastM), incM = 0;
  for (i=0;i<thisM.length;i++) if (thisM[i].type === "income") incM += bAmt(thisM[i]);
  var budget = S.budgets.monthly || 0;
  var wStart = startOfWeek(now), wPrev = new Date(wStart.getTime() - 7*DAY);
  var week = 0, pweek = 0, dd;
  for (i=0;i<txs.length;i++){
    if (txs[i].type !== "expense") continue;
    dd = new Date(txs[i].date);
    if (dd >= wStart) week += bAmt(txs[i]);
    else if (dd >= wPrev) pweek += bAmt(txs[i]);
  }
  var delta = pweek > 0 ? ((week - pweek)/pweek)*100 : null;
  var cs = {}, cl = {}, mm = {}, wd = [0,0,0,0,0,0,0], tx, v, cid;
  for (i=0;i<thisM.length;i++){
    tx = thisM[i];
    if (tx.type !== "expense") continue;
    v = bAmt(tx); cid = tx.categoryId;
    cs[cid] = (cs[cid] || 0) + v;
    if (tx.merchant) mm[tx.merchant] = (mm[tx.merchant] || 0) + v;
    wd[new Date(tx.date).getDay()] += v;
  }
  for (i=0;i<lastM.length;i++){
    if (lastM[i].type !== "expense") continue;
    var c0 = lastM[i].categoryId;
    cl[c0] = (cl[c0] || 0) + bAmt(lastM[i]);
  }
  var topM = null, m;
  for (m in mm) if (mm.hasOwnProperty(m) && (!topM || mm[m] > topM[1])) topM = [m, mm[m]];
  var topD = 0;
  for (i=1;i<7;i++) if (wd[i] > wd[topD]) topD = i;
  var dim = Math.round((sod(mEnd) - sod(mStart))/DAY);
  var elapsed = Math.round((sod(now) - sod(mStart))/DAY) + 1;
  var avg = elapsed > 0 ? spentM/elapsed : 0;
  return {b:b, txs:txs, thisM:thisM, lastM:lastM, spentM:spentM, spentL:spentL, incM:incM, budget:budget,
    remaining:budget-spentM, week:week, pweek:pweek, delta:delta, cs:cs, cl:cl, topM:topM, topD:topD,
    topDV:wd[topD], dim:dim, elapsed:elapsed, avg:avg, proj:avg*dim,
    mStart:mStart, mEnd:mEnd, wStart:wStart, now:now};
}
function homeInsight(s){
  if (!s.txs.length) return null;
  if (s.delta !== null && s.pweek > 0){
    var p = Math.abs(Math.round(s.delta));
    return s.delta < 0 ? t("homeAI1",{p:p}) : t("homeAI2",{p:p});
  }
  if (s.topM) return t("homeAI3",{m:s.topM[0]});
  return t("homeAI4");
}
function forecast(s){
  var cbs = S.budgets.categories, k;
  var leftDays = s.dim - s.elapsed;
  for (k in cbs){
    if (!cbs.hasOwnProperty(k) || !cbs[k]) continue;
    var sp = s.cs[k] || 0, daily = sp / Math.max(1, s.elapsed);
    if (daily > 0){
      var left = (cbs[k] - sp) / daily;
      if (left < leftDays + 1){
        var c = cat(k);
        return t("fc1", {c: c ? c[LANG] : k});
      }
    }
  }
  if (s.budget > 0 && s.proj > s.budget) return t("fc2", {v:money(Math.round(s.proj - s.budget), base(), {code:false})});
  return s.txs.length ? t("fc3") : null;
}
function periodStats(txs, r){
  var spend=0, income=0, count=0, cs={}, mm={}, am={}, i, tx, k;
  for (i=0;i<txs.length;i++){
    tx = txs[i];
    var d = new Date(tx.date);
    if (d < r.start || d > r.end) continue;
    count++;
    var v = bAmt(tx);
    if (tx.type === "expense"){
      spend += v;
      cs[tx.categoryId] = (cs[tx.categoryId]||0) + v;
      if (tx.merchant) mm[tx.merchant] = (mm[tx.merchant]||0) + v;
      var a = tx.account || "main";
      am[a] = (am[a]||0) + v;
    } else income += v;
  }
  var topC=null, topM=null;
  for (k in cs) if (cs.hasOwnProperty(k) && (!topC || cs[k] > topC[1])) topC = [k, cs[k]];
  for (k in mm) if (mm.hasOwnProperty(k) && (!topM || mm[k] > topM[1])) topM = [k, mm[k]];
  var days = Math.max(1, Math.round((sod(r.end) - sod(r.start))/DAY) + 1);
  return {spend:spend, income:income, count:count, cs:cs, am:am, topC:topC, topM:topM, days:days, avg:spend/days};
}

function filterTx(s){
  var list = [], i;
  var r = UI.txRange === "all" ? null : periodRange(UI.txRange, s.now);
  for (i=0;i<s.txs.length;i++){
    var tx = s.txs[i], ok = true;
    if (r){ var d = new Date(tx.date); ok = d >= r.start && d <= r.end; }
    if (ok && UI.txCat) ok = tx.categoryId === UI.txCat;
    if (ok && UI.txAcc) ok = (tx.account || "main") === UI.txAcc;
    if (ok && UI.txq.trim()){
      var q = N(UI.txq);
      ok = N(tx.merchant || "").indexOf(q) > -1 || N(tx.note || "").indexOf(q) > -1 ||
           N(catName(tx.categoryId)).indexOf(q) > -1 || N(accountName(tx.account)).indexOf(q) > -1 ||
           String(tx.amount).indexOf(UI.txq) > -1;
    }
    if (ok) list.push(tx);
  }
  return list;
}

  return '<div class="swbox"><div class="swacts">'+

    (tx.currency !== base() ? ' · '+tx.currency : '')+'</span></span>'+

    '</div></div></div>';
}
function groupHtml(list){
  var g = {}, keys = [], i, j;
  for (i=0;i<list.length;i++){
    var k = localDateKey(list[i].date);
    if (!g[k]){ g[k] = []; keys.push(k); }
    g[k].push(list[i]);
  }
  var now = new Date(), out = "";
  for (i=0;i<keys.length;i++){
    var key = keys[i], items = g[key], d = new Date(key + "T12:00:00");
    var diff = Math.round((sod(now) - sod(d))/DAY), lb;
    if (diff === 0) lb = t("today");
    else if (diff === 1) lb = t("yesterday");
    else if (diff === 2) lb = t("dayBefore");
    else lb = fd(d,{weekday:"long",day:"numeric",month:"short"});
    var tot = 0, inc = 0;
    for (j=0;j<items.length;j++){ if (items[j].type === "expense") tot += bAmt(items[j]); else inc += bAmt(items[j]); }
    var right = "";
    if (tot > 0) right += money(tot, base(), {sign:"−", code:false});
    if (tot > 0 && inc > 0) right += " · ";
    if (inc > 0) right += '<span style="color:var(--green)">'+money(inc, base(), {sign:"+", code:false})+'</span>';
    var rows = "";
    for (j=0;j<items.length;j++) rows += txRowHtml(items[j]);
    out += '<div class="grp-h"><span class="d1">'+esc(lb)+'</span><span class="d2">'+right+'</span></div><div class="txlist">'+rows+'</div>';
  }
  return out;
}

      '<span class="trunc">'+esc(cc[LANG])+'</span><span>'+money(entries[i][1],b,{code:false})+'</span></div>'+bar(entries[i][1],maxCat)+'</div></div>';

function scrInsights(){

  h += '<div class="sec"><h2>'+esc(t("periodAnalysis"))+'</h2></div>';

  var segs = [], legend = "";

    var am = [], k2;

    am.sort(function(a,b2){ return b2[1]-a[1]; });
    for (i=0;i<am.length;i++){
      var pc = st.spend > 0 ? am[i][1]/st.spend*100 : 0;
      segs.push({color:accountColor(am[i][0]), pct:pc});
      legend += legendRow(accountColor(am[i][0]), accountName(am[i][0]), am[i][1], pc, i === am.length-1);
    }
    if (!legend) legend = '<p class="hint" style="padding:10px 0">'+esc(t("noDataB"))+'</p>';
  } else {
    var en = [], k3;

    en.sort(function(a,b2){ return b2[1]-a[1]; });
    var top = en.slice(0,5), restV = 0;
    for (i=5;i<en.length;i++) restV += en[i][1];
    for (i=0;i<top.length;i++){
      var cc = cat(top[i][0]);
      var pc2 = st.spend > 0 ? top[i][1]/st.spend*100 : 0;
      segs.push({color: cc ? cc.c : "#65757F", pct:pc2});
      legend += legendRow(cc ? cc.c : "#65757F", cc ? cc[LANG] : t("unspecified"), top[i][1], pc2, false);
    }
    if (restV > 0){
      var pc3 = st.spend > 0 ? restV/st.spend*100 : 0;
      segs.push({color:"#8B99A1", pct:pc3});
      legend += legendRow("#8B99A1", t("otherSeg"), restV, pc3, true);
    }
    if (!legend) legend = '<p class="hint" style="padding:10px 0">'+esc(t("noDataB"))+'</p>';
  }
  var pn = parts(st.spend, base());
  h += '<div class="card cp" style="margin-top:10px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'+
    '<span style="font-size:14px;font-weight:700">'+ic("pie",14)+' '+esc(t("donutTitle"))+' · '+esc(t(periodLabelKey(UI.period)))+
    ' <span style="color:var(--ink-3);font-weight:600;font-size:11px">('+fd(r.start,{day:"numeric",month:"short"})+' → '+fd(r.end,{day:"numeric",month:"short"})+')</span></span>'+
    '<div class="seg" style="width:150px"><button class="'+(UI.donutMode === "cat" ? "on" : "")+'" data-act="donutmode" data-v="cat">'+esc(t("donutCat"))+'</button>'+
    '<button class="'+(UI.donutMode === "acc" ? "on" : "")+'" data-act="donutmode" data-v="acc">'+esc(t("donutAcc"))+'</button></div></div>'+
    '<div class="ringwrap" style="width:190px;height:190px;margin:14px auto 6px">'+donutSVG(segs,190)+
    '<div class="c"><div style="font-size:21px;font-weight:700;letter-spacing:-.4px">'+pn.n+'</div>'+
    '<div style="font-size:10.5px;font-weight:700;color:var(--ink-3)">'+esc(pn.s)+'</div>'+
    '<div style="font-size:10.5px;color:var(--ink-3)">'+st.count+' '+esc(t("opsPeriod"))+'</div></div></div>'+
    '<div>'+legend+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:12px">'+
    '<div class="stat"><div class="rs">'+esc(t("incomePeriod"))+'</div><div style="font-size:14px;font-weight:700;margin-top:3px;color:var(--green)">'+money(st.income, s.b,{sign:"+"})+'</div></div>'+
    '<div class="stat"><div class="rs">'+esc(t("dailyAvg"))+'</div><div style="font-size:14px;font-weight:700;margin-top:3px">'+money(st.avg, s.b)+'</div></div>'+
    '</div></div>';

  var cards = [];
  if (pst.spend > 0){
    var p = Math.round(((st.spend - pst.spend)/pst.spend)*100);
    cards.push({ic: p > 0 ? "tu" : "td", tone: p > 0 ? "w" : "o", title:t("perTitle"),
      body: Math.abs(p) < 3 ? t("perSame") : (p > 0 ? t("perUp",{p:Math.abs(p)}) : t("perDown",{p:Math.abs(p)})),
      stat:(p > 0 ? "+" : "")+p+"%"});
  }
  if (st.topC){
    var share = st.spend > 0 ? Math.round(st.topC[1]/st.spend*100) : 0;
    cards.push({ic: (cat(st.topC[0]) || {}).ic || "tag", tone:"t", title:t("topCat"),
      body: catName(st.topC[0]) + " — " + money(st.topC[1], s.b) + " · " + t("shareOfSpend",{p:share})});
  }
  if (st.topM) cards.push({ic:"bld", tone:"t", title:t("topMerch"), merch:st.topM[0], amount:st.topM[1]});
  if (st.topC){
    var catTxs = [], q;
    for (q=0;q<s.txs.length;q++){
      var d0 = new Date(s.txs[q].date);
      if (s.txs[q].type === "expense" && s.txs[q].categoryId === st.topC[0] && d0 >= r.start && d0 <= r.end) catTxs.push(s.txs[q]);
    }
    if (catTxs.length >= 4){
      var avgO = st.topC[1]/catTxs.length;
      cards.push({ic:"spark", tone:"o", title:t("ins4"),
        body:t("ins4b").split("{c}").join(catName(st.topC[0])).split("{v}").join(money(Math.round(avgO*4.3), s.b, {code:false}))});
    }
  }
  if (UI.period === "month" && s.budget > 0 && s.proj > 0){
    var ov = s.proj > s.budget;
    cards.push({ic: ov ? "alert" : "check", tone: ov ? "w" : "o", title: ov ? t("ins5a") : t("ins5c"),
      body: ov ? t("ins5b").split("{d}").join(money(Math.round(s.avg), s.b, {code:false})).split("{p}").join(money(Math.round(s.proj), s.b, {code:false}))
               : t("ins5d").split("{d}").join(money(Math.round(s.avg), s.b, {code:false}))});
  }
  h += '<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">';
  for (i=0;i<cards.length;i++) h += insightCard(cards[i]);
  h += '</div>';

  h += '<div class="card cp" style="margin-top:16px"><div class="fl">'+esc(t("monthSummary"))+' · '+esc(t("chooseDay",{d:monthStartDay()}))+'</div>'+
    '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;gap:8px"><span style="color:var(--ink-2)">'+esc(t("expenseMonth"))+'</span><span>'+money(s.spentM,s.b,{sign:"−"})+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;gap:8px"><span style="color:var(--ink-2)">'+esc(t("incomeMonth"))+'</span><span style="color:var(--green);font-weight:700">'+money(s.incM,s.b,{sign:"+"})+'</span></div>'+
    '<div class="divider"></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:13.5px;gap:8px"><span style="color:var(--ink-2)">'+esc(t("lastMonthSpend"))+'</span><span style="font-weight:700">'+money(s.spentL,s.b)+'</span></div></div>';
  return h + '<p class="hint" style="margin:14px 4px 0;display:flex;gap:6px">'+ic("shield",13)+' '+esc(t("disclaimer"))+'</p></div>';
}

function v2daysLeft(){ var n=sod(new Date()),e=sod(addMonths(customMonthStart(new Date()),1));return Math.max(1,Math.round((e-n)/DAY)); }
function v2upcoming(){
  v2ensure(); var now=new Date(),out=[],i,day,next;
  for(i=0;i<S.recurring.length;i++){
    day=Math.max(1,Math.min(28,parseInt(S.recurring[i].day,10)||1));
    next=new Date(now.getFullYear(),now.getMonth(),day,12,0,0,0);
    if(next<sod(now)) next=new Date(now.getFullYear(),now.getMonth()+1,day,12,0,0,0);
    out.push({kind:"rec",name:S.recurring[i].name,amount:+S.recurring[i].amount||0,date:next,id:S.recurring[i].id});
  }
  for(i=0;i<S.debts.length;i++){
    day=Math.max(1,Math.min(28,parseInt(S.debts[i].dueDay,10)||1));
    next=new Date(now.getFullYear(),now.getMonth(),day,12,0,0,0);
    if(next<sod(now)) next=new Date(now.getFullYear(),now.getMonth()+1,day,12,0,0,0);
    out.push({kind:"debt",name:S.debts[i].name,amount:+S.debts[i].minPayment||0,date:next,id:S.debts[i].id});

function v2goalMonthly(g){

  var months=(due.getFullYear()-now.getFullYear())*12+(due.getMonth()-now.getMonth());

function v2liquidStatus(){

function ensureCardForTail(t4){
  if (!t4) return null;
  var i;
  for (i=0;i<S.accounts.length;i++) if (S.accounts[i].last4 === t4) return S.accounts[i].id;
  var id = "a"+uid();
  S.accounts.push({id:id, ar:"بطاقة ••••"+t4, en:"Card ••••"+t4, kind:"card", last4:t4, color:nextColor(), auto:true});
  return id;
}
function commitBank(){
  var items=UI.bankResults||[],i,n=0,existingKeys={},legacyRaw={},rk,sk,before=JSON.stringify(S),confirmedPending={};
  for(i=0;i<S.transactions.length;i++){ var ex=S.transactions[i]; if(!ex||ex.inputSource!=="bank_message") continue; if(ex.bankKey) existingKeys[String(ex.bankKey)]=1; else if(ex.rawInput) legacyRaw[bankRawKey(ex.rawInput)]=1; }
  for (i=0;i<items.length;i++){
    var it=items[i];
    if (!it.include || it.amount === null || isNaN(it.amount) || it.amount <= 0) continue;
    rk=bankRawKey(it.raw||""); sk=it.sourceKey?String(it.sourceKey):"";
    var pendingId=it.pendingNative?pendingReviewIdentity(it):"";
    if((sk&&existingKeys[sk]) || (!sk&&rk&&legacyRaw[rk])) { if(pendingId) confirmedPending[pendingId]=1; continue; }
    if(sk) existingKeys[sk]=1; else if(rk) legacyRaw[rk]=1;
    var rt = Cur.rate(it.currency, base());
    var accId = ensureCardForTail(it.tail) || "main";
    var tx = {id:uid(), type:it.type||"expense", amount:it.amount, currency:it.currency,
      originalAmount:it.amount, originalCurrency:it.currency,
      baseAmount:round(it.amount*rt, base()), baseCurrency:base(), exchangeRate:rt,
      merchant:it.merchant || null, categoryId:it.categoryId || null, date:it.date||new Date().toISOString(), note:it.note || null, rawInput:it.raw || null, bankKey:sk||null,
      account:accId, inputSource:"bank_message", aiConfidence:it.confidence || 0.9,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()};
    S.transactions.unshift(tx);
    if (S.settings.ai.autoLearn) learnFromTx(tx);
    if(pendingId) confirmedPending[pendingId]=1;
    n++;
  }
  if (!n && !Object.keys(confirmedPending).length){ toast(t("noInclude"), "err"); return; }
  if(Object.keys(confirmedPending).length && Array.isArray(S.pendingBankReviews))
    S.pendingBankReviews=S.pendingBankReviews.filter(function(x){return !confirmedPending[pendingReviewIdentity(x)];});
  if(!save()){
    try{ S=JSON.parse(before); normalizeLoaded(S); }catch(e){}
    toast(LANG==="ar"?"تعذر حفظ العمليات؛ لم يتم حذف أي شيء":"Could not save transactions; nothing was removed","err"); return;
  }
  UI.bankResults = null; UI.bankIgnored = 0; UI.addBank = "";
  toast(t("importedN",{n:n}));
  tab("transactions");
}
function commit(){
  var d = UI.draft, i;
  if (!d || d.amount === null || d.amount === undefined || isNaN(d.amount) || d.amount <= 0) return;
  var before=JSON.stringify(S), rt = Cur.rate(d.currency, base());
  var editing = !!d.id;
  var old = editing ? findTx(d.id) : null;
  var tx = {id: d.id || uid(), type:d.type||"expense", amount:d.amount, currency:d.currency,
    originalAmount:d.amount, originalCurrency:d.currency,
    baseAmount: round(d.amount*rt, base()), baseCurrency: base(), exchangeRate: rt,
    merchant:d.merchant || null, categoryId:d.categoryId || null, date:d.date, note:d.note || null, rawInput:d.rawInput || (old&&old.rawInput) || null,
    bankKey:d.bankKey || (old&&old.bankKey) || null,
    account:d.account || "main", inputSource:d.inputSource || "manual", aiConfidence:d.aiConfidence || 1,
    createdAt: old ? old.createdAt : new Date().toISOString(), updatedAt:new Date().toISOString()};
  if (editing){ for (i=0;i<S.transactions.length;i++) if (S.transactions[i].id === tx.id) S.transactions[i] = tx; }
  else S.transactions.unshift(tx);
  if (S.settings.ai.autoLearn) learnFromTx(tx);
  if(!save()){
    try{ S=JSON.parse(before); normalizeLoaded(S); }catch(e){}
    toast(LANG==="ar"?"تعذر حفظ العملية":"Could not save transaction","err"); return;
  }

function setBase(nb){
  if (!Cur.valid(nb) || nb === base()) return true;
  var before=stateSnapshot(), r = Cur.rate(base(), nb), i, k, cb = {};
  // Preserve each transaction's stored historical base amount/rate. Display conversion is handled by bAmt().
  for (k in S.budgets.categories) if (S.budgets.categories.hasOwnProperty(k)) cb[k] = round(S.budgets.categories[k]*r, nb);
  S.budgets = {monthly: round((S.budgets.monthly || 0)*r, nb), categories: cb};
  v2ensure();
  for(i=0;i<S.goals.length;i++){ S.goals[i].target=round((+S.goals[i].target||0)*r,nb); S.goals[i].saved=round((+S.goals[i].saved||0)*r,nb); }
  for(i=0;i<S.recurring.length;i++) S.recurring[i].amount=round((+S.recurring[i].amount||0)*r,nb);
  for(i=0;i<S.debts.length;i++){ S.debts[i].total=round((+S.debts[i].total||0)*r,nb); S.debts[i].remaining=round((+S.debts[i].remaining||0)*r,nb); S.debts[i].minPayment=round((+S.debts[i].minPayment||0)*r,nb); }
  for(i=0;i<S.accounts.length;i++) if(S.accounts[i].balanceSet) S.accounts[i].balance=round((+S.accounts[i].balance||0)*r,nb);
  S.v2.safetyBuffer=round((+S.v2.safetyBuffer||0)*r,nb);
  S.settings.baseCurrency = nb;
  return persistOrRollback(before,LANG==="ar"?"تعذر حفظ تغيير العملة":"Could not save currency change");
}
function exportJson(){
  try {
    var payload = JSON.stringify({app:"sanad", version:10, exportedAt:new Date().toISOString(), data:S}, null, 2);
    var A=nativeBridge();
    if(A && typeof A.exportBackup === "function"){ A.exportBackup(payload); return; }
    var blob = new Blob([payload], {type:"application/json"});
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "sanad-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500); toast(t("backupDone"));
  } catch(e){ toast(t("exportFail"), "err"); }
}
function applyBackupPayload(raw){
  var previous=null; try{previous=JSON.stringify(S);}catch(_e){}
  try{
    var wrap=typeof raw==="string"?JSON.parse(raw):raw;
    var data=(wrap&&wrap.app==="sanad"&&wrap.data)?wrap.data:wrap;
    if(!data || !data.settings || !Array.isArray(data.transactions)) throw new Error("invalid");
    if(!normalizeLoaded(data)) throw new Error("invalid");
    if(!save()) throw new Error("persist");
    try{ localStorage.removeItem(KEY); }catch(e){}
    LANG=S.settings.language||"ar"; UI.stack=[{r:"home",p:{}}]; render(false); toast(t("restoreDone"));
    return true;
  }catch(e){
    if(previous){ try{ normalizeLoaded(JSON.parse(previous)); }catch(_e){} }
    toast(t("restoreFail"),"err"); return false;
  }
}
window.sanadNativeRestore=function(raw){ return applyBackupPayload(raw); };
function restoreJson(){
  var A=nativeBridge();
  if(A && typeof A.importBackup==="function"){ try{ A.importBackup(); return; }catch(e){} }
  var inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json"; inp.style.display="none";
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f){inp.remove();return;} if(f.size>5000000){toast(t("restoreFail"),"err");inp.remove();return;} var r=new FileReader(); r.onload=function(){applyBackupPayload(String(r.result||""));inp.remove();}; r.onerror=function(){toast(t("restoreFail"),"err");inp.remove();}; r.readAsText(f); };
  document.body.appendChild(inp); inp.click();
}

  var st=document.getElementById("vstop"); if(st)st.style.display="inline-flex";
}
function chooseVoiceCandidate(list){
  var best="",score=-1,i;
  for(i=0;i<list.length;i++){
    var s=String(list[i]||"").trim(); if(!s)continue;
    var p=aiParse(s,{kw:S.keywordRules,cats:S.categories}),sc=0;
    if(p.amount!==null)sc+=5;if(p.currency)sc+=2;if(p.merchant)sc+=2;if(p.category)sc+=2;if(p.date)sc+=1;sc+=Math.min(2,s.length/40);
    if(sc>score){score=sc;best=s;}
  }
  return best;
}

  var lv=document.getElementById("vlive"); if(lv)lv.textContent=voiceChunks.concat(voicePartial?[voicePartial]:[]).join(" ").trim();
}

    try{A.stopVoice();return;}catch(e){voiceAwaitingResult=false;}
  }

/* ─────────── swipe ─────────── */
var lastSwipe = 0;
function curX(el){
  var m = /translateX\((-?[\d.]+)px\)/.exec(el.style.transform || "");
  return m ? parseFloat(m[1]) : 0;
}
function initSwipe(){
  var rows = $$(".swrow"), sign = LANG === "ar" ? 1 : -1, i;
  for (i=0;i<rows.length;i++) bindSwipe(rows[i], sign);
}
function bindSwipe(el, sign){
  var startX = 0, startY = 0, dragging = false, moved = false;
  var id = el.getAttribute("data-row");
  if (UI.openRow === id) el.style.transform = "translateX(" + (sign*104) + "px)";
  function end(){
    if (!dragging) return;
    dragging = false; el.classList.remove("drag");
    if (!moved) return;
    lastSwipe = Date.now();
    var v = curX(el);
    if (v*sign > 55){ UI.openRow = id; el.style.transform = "translateX(" + (sign*104) + "px)"; }
    else { UI.openRow = null; el.style.transform = "translateX(0px)"; }
  }
  el.addEventListener("pointerdown", function(e){ startX = e.clientX; startY = e.clientY; dragging = true; moved = false; });
  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved){
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)){ dragging = false; return; }
      moved = true; el.classList.add("drag");
    }
    var v = (UI.openRow === id ? sign*104 : 0) + dx;
    if (sign < 0) v = Math.min(0, Math.max(-120, v)); else v = Math.max(0, Math.min(120, v));
    el.style.transform = "translateX(" + v + "px)";
    if (e.cancelable) e.preventDefault();
  });
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", function(){
    dragging = false; el.classList.remove("drag");
    el.style.transform = "translateX(" + (UI.openRow === id ? sign*104 : 0) + "px)";
  });
}
function afterRender(top){
  initSwipe();
  if (top.r === "add" && UI.addMode === "text" && !UI.draft && !UI.busy && !UI.addText){
    var el = document.getElementById("ai-in");
    if (el){ try { el.focus(); } catch(e){} }
  }
}
