<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8FAF9" id="metaTheme">
<title>SANAD — سند | إدارة مالية شخصية</title>
<meta name="description" content="SANAD — سند، تطبيق لإدارة الحسابات والمصروفات والدخل والبطاقات والميزانيات.">
<meta name="application-name" content="SANAD — سند">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" id="manifestLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#F8FAF9;--surface:#FFF;--surface-2:#EEF2F0;--surface-3:#E4EAE7;
  --outline:#DCE4E0;--text:#1A1C1B;--text-2:#5F6368;--text-3:#8E9593;
  --primary:#00695C;--primary-2:#00897B;--primary-soft:#E0F2F1;
  --on-primary:#FFF;--success:#2E7D32;--success-soft:#E8F5E9;
  --error:#C62828;--error-soft:#FFEBEE;--warn:#E65100;--warn-soft:#FFF3E0;
  --info:#1565C0;--info-soft:#E3F2FD;--liability:#7B1FA2;--liability-soft:#F3E5F5;
  --amber:#F57C00;--amber-soft:#FFF8E1;
  --shadow-1:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.05);
  --shadow-2:0 3px 6px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
  --shadow-3:0 8px 16px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.06);
}
[data-theme="dark"]{
  --bg:#101413;--surface:#1A1F1D;--surface-2:#242B29;--surface-3:#2E3634;
  --outline:#3A423F;--text:#E3E6E4;--text-2:#9CA3A1;--text-3:#6E7775;
  --primary:#4DB6AC;--primary-2:#26A69A;--primary-soft:#0F2D2A;
  --on-primary:#003731;--success:#66BB6A;--success-soft:#1B3A1D;
  --error:#EF5350;--error-soft:#3A1A1A;--warn:#FFA726;--warn-soft:#3A2810;
  --info:#64B5F6;--info-soft:#0D2135;--liability:#CE93D8;--liability-soft:#2A1A2E;
  --amber:#FFB74D;--amber-soft:#3A2810;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Cairo",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
::-webkit-scrollbar{width:0;height:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:500px;margin:0 auto;background:var(--bg);position:relative}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:10px;flex-shrink:0;background:var(--bg)}
.top-bar h1{font-size:19px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar .tb-btn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.top-bar .tb-btn.primary{background:var(--primary);color:#fff}
.top-bar .month-picker{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:500}
.top-bar .month-picker .arrow{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--text-2)}
.country-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;flex-shrink:0}
.country-btn .flag{font-size:15px}
.country-btn .arr{font-size:10px;color:var(--text-2)}
main{flex:1;overflow-y:auto;padding:0 16px 120px;-webkit-overflow-scrolling:touch}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--outline);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:30}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;color:var(--text-3);border-radius:12px;margin:0 2px}
.bottom-nav button .ico{width:32px;height:22px;display:grid;place-items:center;font-size:18px;border-radius:12px}
.bottom-nav button span{font-size:10.5px;font-weight:500}
.bottom-nav button.on{color:var(--primary)}
.bottom-nav button.on .ico{background:var(--primary-soft)}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:300;box-shadow:0 4px 12px rgba(0,105,92,.35);z-index:31}
.fab:active{transform:translateX(-50%) scale(.92)}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-1)}
.card + .card{margin-top:10px}
.wallet-hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,105,92,.2);margin-bottom:10px;cursor:pointer}
.wallet-hero::after{content:"";position:absolute;top:-60px;inset-inline-start:-60px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.wallet-hero .wh-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:1}
.wallet-hero .wh-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:18px}
.wallet-hero .wh-name{flex:1;font-size:14px;font-weight:500}
.wallet-hero .wh-cur{font-size:11.5px;opacity:.85;margin-top:2px}
.wallet-hero .wh-bal{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.wallet-hero .wh-balance-row{display:flex;align-items:center;gap:10px;position:relative;z-index:3}
.wallet-hero .wh-balance-row .wh-bal{flex:0 1 auto}
.wallet-hero .amount-eye{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;font-size:17px;position:relative;z-index:4}
.wallet-hero .amount-eye:active{background:rgba(255,255,255,.24)}
.wallet-hero .wh-sub{font-size:11.5px;opacity:.85;margin-top:4px;position:relative;z-index:1}
.wallet-hero .wh-link{position:absolute;top:16px;inset-inline-end:16px;font-size:11.5px;opacity:.9;z-index:3;cursor:pointer;padding:4px 8px;border-radius:8px}
.wallet-hero.masked .wh-bal{filter:blur(9px);user-select:none}
.country-summary{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow-1);margin-bottom:10px}
.country-summary .cs-hdr{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:6px}
.country-summary .cs-sub{font-size:12px;color:var(--text-2);margin-top:6px;margin-bottom:2px}
.country-summary .cs-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13.5px}
.country-summary .cs-row .lbl{color:var(--text-2)}
.country-summary .cs-row .val{font-weight:600;font-variant-numeric:tabular-nums}
.country-summary .cs-row .val.pos{color:var(--success)}
.country-summary .cs-row .val.neg{color:var(--error)}
.country-summary .cs-row .val.info{color:var(--info)}
.debt-summary{background:linear-gradient(135deg,#7B1FA2 0%,#9C27B0 100%);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:10px;cursor:pointer;box-shadow:0 6px 20px rgba(123,31,162,.2);position:relative;overflow:hidden}
.debt-summary .ds-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;opacity:.95;margin-bottom:8px}
.debt-summary .ds-head b{font-size:14px;font-weight:500}
.debt-summary .ds-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.debt-summary .ds-row .cur{font-size:12px;opacity:.85;font-weight:400}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:500}
.sec .more{font-size:13px;color:var(--primary);font-weight:500;padding:4px 8px;border-radius:8px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll::after{content:"";flex-shrink:0;width:2px}
.tile{width:270px;min-height:145px;border-radius:20px;padding:16px;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow-2);transition:transform .15s;scroll-snap-align:start;flex-shrink:0}
.tile:active{transform:scale(.98)}
.tile .tile-grad{position:absolute;inset:0;z-index:0}
.tile > *:not(.tile-grad){position:relative;z-index:1}
.tile .tile-head{display:flex;align-items:center;gap:10px}
.tile .tile-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.tile .tile-name{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tile-sub{font-size:11.5px;opacity:.85;margin-top:2px}
.tile .tile-badges{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tile .badge-primary{font-size:10px;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:99px;font-weight:500}
.tile .tile-amount{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tile .tile-amount small{font-size:12px;opacity:.85;font-weight:500;margin-inline-start:4px}
.tile .tile-row{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .tile-foot{font-size:11.5px;opacity:.85;margin-top:6px}
.tile-add{width:120px;min-height:145px;border-radius:20px;border:2px dashed var(--outline);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-2);cursor:pointer;flex-shrink:0;scroll-snap-align:start}
.tile-add .plus{font-size:28px;font-weight:300}
.tile-add .lbl{font-size:12.5px;font-weight:500}
.tile-add:active{background:var(--surface-2)}
.arch-list{display:flex;flex-direction:column;gap:6px}
.arch-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-1)}
.arch-row .ar-ico{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.arch-row .ar-info{flex:1;min-width:0}
.arch-row .ar-info b{display:block;font-size:13.5px;font-weight:500}
.arch-row .ar-info span{font-size:11.5px;color:var(--text-2)}
.arch-row .ar-restore{padding:6px 12px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:500}
.quick-add{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.quick-add::-webkit-scrollbar{display:none}
.quick-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--outline);border-radius:99px;font-size:13px;font-weight:500}
.quick-chip .ci{font-size:16px}
.quick-chip.more{color:var(--primary);border-color:var(--primary);background:var(--primary-soft)}
.tx-list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-1)}
.tx-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);position:relative;cursor:pointer;will-change:transform}
.tx-item + .tx-item{border-top:1px solid var(--outline)}
.tx-item.swiping{transition:none}
.tx-item .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.tx-item .info{flex:1;min-width:0}
.tx-item .info b{display:block;font-size:14.5px;font-weight:500;margin-bottom:2px}
.tx-item .info span{display:block;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-item .info .tag{display:inline-block;font-size:10px;color:var(--primary);background:var(--primary-soft);padding:1px 6px;border-radius:6px;margin-inline-end:4px}
.tx-item .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tx-item .amt.pos{color:var(--success)}
.tx-item .amt.transfer{color:var(--info)}
.tx-item .amt.adjustment{color:var(--warn)}
.tx-item .amt.external{color:var(--error)}
.tx-item .amt .fx{font-size:10px;color:var(--text-3);font-weight:500}
.tx-item-wrap{position:relative;background:var(--surface)}
.tx-item-wrap.edit{background:var(--primary)}
.tx-item-wrap.del{background:var(--error)}
.tx-item-wrap .hint-icon{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:20px}
.tx-item-wrap.edit .hint-icon{inset-inline-start:24px}
.tx-item-wrap.del .hint-icon{inset-inline-end:24px}
.day-head{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:500;padding:14px 4px 8px}
.empty{text-align:center;padding:44px 20px;color:var(--text-2)}
.empty .em{font-size:44px;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px;line-height:1.6}
.empty .hint{font-size:12.5px;color:var(--text-3);margin-top:6px}
.filter-row{display:flex;gap:8px;margin-bottom:12px}
.filter-row .search-wrap{flex:1;position:relative}
.search-wrap .icon{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-3);pointer-events:none}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--outline);border-radius:99px;padding:12px 40px 12px 16px;font-size:14px}
.filter-btn{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--outline);display:grid;place-items:center;font-size:16px;color:var(--text-2);position:relative}
.filter-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.filter-btn .badge{position:absolute;top:2px;inset-inline-end:2px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--outline);font-size:13px;font-weight:500;color:var(--text-2)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tab-row::-webkit-scrollbar{display:none}
.tab-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--outline);font-size:13px;font-weight:500;cursor:pointer}
.tab-chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.help-box{display:flex;gap:10px;background:var(--info-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.help-box .hi{font-size:18px;flex-shrink:0}
.help-box .ht{flex:1;font-size:12.5px;line-height:1.6;color:var(--text)}
.help-box .ht b{display:block;font-size:13px;margin-bottom:2px;color:var(--info)}
.help-box.warn{background:var(--amber-soft)}
.help-box.warn .hi{color:var(--amber)}
.help-box.warn .ht b{color:var(--amber)}
.help-box.err{background:var(--error-soft)}
.help-box.err .hi{color:var(--error)}
.help-box.err .ht b{color:var(--error)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:99px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:0;padding:8px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.tabs button.on{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(0,105,92,.25)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat-card{background:var(--surface);border-radius:12px;padding:14px;box-shadow:var(--shadow-1)}
.stat-card .lbl{font-size:11.5px;color:var(--text-2);font-weight:500;margin-bottom:6px}
.stat-card .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.stat-card .v.pos{color:var(--success)}
.stat-card .v.neg{color:var(--error)}
.stat-card .sub{font-size:11px;color:var(--text-2);margin-top:4px}
.pie-wrap{display:flex;align-items:center;gap:14px}
.pie-wrap canvas{width:120px;height:120px;flex-shrink:0}
.pie-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;max-height:120px;overflow-y:auto}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-row .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-row .pct{color:var(--text-2);font-weight:500;font-size:11.5px}
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--outline)}
.cat-row:last-child{border-bottom:0}
.cat-row .icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.cat-row .body{flex:1;min-width:0}
.cat-row .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500;margin-bottom:6px;gap:8px}
.cat-row .top .amt{color:var(--text-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.cat-row .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cat-row .bar>i{display:block;height:100%;border-radius:99px;transition:width .6s}
.budget-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--outline)}
.budget-row:last-child{border-bottom:0}
.budget-row .icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.budget-row .body{flex:1;min-width:0}
.budget-row .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:6px;gap:8px}
.budget-row .top .amt{font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text-2)}
.budget-row .bar{height:8px;border-radius:99px;background:rgba(125,145,180,.15);overflow:hidden;margin-bottom:6px}
.budget-row .bar>i{display:block;height:100%;border-radius:99px;transition:width .6s}
.budget-row.normal .bar>i{background:var(--success)}
.budget-row.warn .bar>i{background:var(--amber)}
.budget-row.strong .bar>i{background:var(--warn)}
.budget-row.over .bar>i{background:var(--error)}
.budget-row .info{font-size:11.5px;font-weight:500}
.budget-row.normal .info{color:var(--success)}
.budget-row.warn .info{color:var(--amber)}
.budget-row.strong .info{color:var(--warn)}
.budget-row.over .info{color:var(--error)}
.trend-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:6px 0 0}
.trend-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend-chart .bar{width:100%;max-width:32px;border-radius:6px 6px 3px 3px;background:var(--primary);min-height:3px;transition:height .6s}
.trend-chart .bar.hi{background:var(--error)}
.trend-chart .lbl{font-size:10.5px;color:var(--text-2);font-weight:500}
.trend-chart .val{font-size:9.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-1)}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);cursor:pointer}
.list-item + .list-item{border-top:1px solid var(--outline)}
.list-item:active{background:var(--surface-2)}

   Visual-only layer. Finance/data logic intentionally preserved.
   ========================================================= */
:root{
  --bg:#F3F7F5;
  --surface:#FFFFFF;
  --surface-2:#F1F5F3;
  --surface-3:#E7EEEB;
  --outline:#E0E8E4;
  --text:#10231D;
  --text-2:#5E6D67;
  --text-3:#8A9892;
  --primary:#0C7564;
  --primary-2:#13A087;
  --primary-soft:#E4F5F0;
  --on-primary:#FFFFFF;
  --success:#1D8A57;
  --success-soft:#E7F6EE;
  --error:#C43D48;
  --error-soft:#FCEBED;
  --warn:#CF6C19;
  --warn-soft:#FFF1E5;
  --info:#2875B9;
  --info-soft:#EAF3FB;
  --liability:#7450A6;
  --liability-soft:#F0EAF8;
  --amber:#D79B27;
  --amber-soft:#FFF7E5;
  --glass:rgba(243,247,245,.88);
  --shadow-1:0 1px 2px rgba(18,52,43,.035),0 6px 18px rgba(18,52,43,.045);
  --shadow-2:0 10px 30px rgba(18,52,43,.09),0 2px 8px rgba(18,52,43,.05);
  --shadow-3:0 26px 70px rgba(7,32,25,.20),0 8px 22px rgba(7,32,25,.10);
}
[data-theme="dark"]{
  --bg:#0D1512;
  --surface:#14201C;
  --surface-2:#1B2A25;
  --surface-3:#243630;
  --outline:#2C4039;
  --text:#EAF3EF;
  --text-2:#A5B5AE;
  --text-3:#73877F;
  --primary:#54C9B2;
  --primary-2:#2CA88F;
  --primary-soft:#17372F;
  --on-primary:#06251E;
  --success:#64C88F;
  --success-soft:#173327;
  --error:#F17880;
  --error-soft:#3A2024;
  --warn:#F4A25E;
  --warn-soft:#3A2A1C;
  --info:#6FB4E8;
  --info-soft:#162D3F;
  --liability:#C0A0E5;
  --liability-soft:#2A2136;
  --amber:#EDBE60;
  --amber-soft:#352D1C;
  --glass:rgba(13,21,18,.88);
  --shadow-1:0 1px 2px rgba(0,0,0,.16),0 8px 20px rgba(0,0,0,.12);
  --shadow-2:0 12px 34px rgba(0,0,0,.22),0 3px 10px rgba(0,0,0,.14);
  --shadow-3:0 28px 80px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.22);
}
html{background:var(--bg);scroll-behavior:smooth}
body{
  font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 85% -10%,rgba(19,160,135,.09),transparent 32%),
    radial-gradient(circle at 5% 8%,rgba(40,117,185,.055),transparent 26%),
    var(--bg);
  font-weight:500;
  letter-spacing:-.08px;
}
button,input,select,textarea{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#app{background:transparent}
main{padding-inline:14px;padding-bottom:126px}
.top-bar{
  padding:12px 14px 10px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid color-mix(in srgb,var(--outline) 72%,transparent);
  position:relative;z-index:20;
}
.top-bar h1{font-size:19px;font-weight:800;letter-spacing:-.35px}
.top-bar .tb-btn,.country-btn,.top-bar .month-picker{
  background:var(--surface);border:1px solid var(--outline);box-shadow:0 3px 12px rgba(18,52,43,.05)
}
.top-bar .tb-btn{width:40px;height:40px;transition:transform .16s,background .16s}
.top-bar .tb-btn:active{transform:scale(.93)}
.top-bar .tb-btn.primary{background:linear-gradient(145deg,var(--primary),var(--primary-2));border-color:transparent;box-shadow:0 8px 18px rgba(12,117,100,.22)}
.country-btn{font-weight:700;padding:7px 12px}
.card,.country-summary,.stat-card,.sub-card,.list,.tx-list{
  border:1px solid color-mix(in srgb,var(--outline) 80%,transparent);
  box-shadow:var(--shadow-1);
}
.card{border-radius:20px;padding:17px}
.wallet-hero{
  border-radius:24px;padding:20px;
  background:linear-gradient(135deg,#0A6759 0%,#0E8E78 58%,#22A88F 100%);
  box-shadow:0 18px 38px rgba(12,117,100,.20);
  border:1px solid rgba(255,255,255,.10);
}
.wallet-hero::before{content:"";position:absolute;inset:-40% -30% auto auto;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 68%)}
.wallet-hero .wh-bal{font-size:28px;font-weight:800;letter-spacing:-1px}
.wallet-hero .wh-name{font-weight:700}
.debt-summary{border-radius:22px;box-shadow:0 14px 32px rgba(116,80,166,.18)}
.sec{margin:24px 3px 11px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.15px}
.sec .more{font-weight:700}
.hscroll{gap:11px;padding-bottom:10px}
.tile{border-radius:22px;box-shadow:0 14px 30px rgba(18,52,43,.11);border:1px solid rgba(255,255,255,.08)}
.tile .tile-name{font-weight:700}
.tile .tile-amount{font-weight:800}
.tile-add{border-radius:22px;border-width:1.5px;background:color-mix(in srgb,var(--surface) 72%,transparent)}
.tx-list{border-radius:20px;background:var(--surface)}
.tx-item{padding:14px 15px;transition:background .18s,transform .18s}
.tx-item:active{background:var(--surface-2);transform:scale(.995)}
.tx-item + .tx-item{border-top-color:color-mix(in srgb,var(--outline) 72%,transparent)}
.tx-item .ic{width:44px;height:44px;border-radius:14px}
.tx-item .info b{font-weight:700}
.tx-item .amt{font-weight:800}
.stat-grid{gap:11px}
.stat-card{border-radius:18px;padding:16px}
.stat-card .lbl{font-weight:700}
.stat-card .v{font-size:20px;font-weight:800}
.budget-row .bar{height:9px;background:var(--surface-3)}
.list{border-radius:20px;overflow:hidden;background:var(--surface)}
.list-item{min-height:58px}
.btn{min-height:48px;border-radius:15px;font-weight:700;transition:transform .16s,box-shadow .16s,filter .16s}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(145deg,var(--primary),var(--primary-2));box-shadow:0 10px 22px rgba(12,117,100,.18)}
.fab{
  width:58px;height:58px;border-radius:19px;
  background:linear-gradient(145deg,var(--primary),var(--primary-2));
  box-shadow:0 14px 30px rgba(12,117,100,.30),0 4px 10px rgba(12,117,100,.16);
  bottom:calc(92px + env(safe-area-inset-bottom));
  transition:transform .16s,filter .16s;
}
.fab:active{transform:translateX(-50%) scale(.92);filter:brightness(.96)}
.bottom-nav{
  left:50%;right:auto;transform:translateX(-50%);
  width:min(calc(100% - 16px),484px);
  bottom:8px;
  border:1px solid var(--outline);
  border-radius:22px;
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 14px 36px rgba(18,52,43,.13);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
}
.bottom-nav button{padding:7px 3px 5px;border-radius:14px;transition:transform .16s,color .16s,background .16s}
.bottom-nav button:active{transform:scale(.94)}
.bottom-nav button .ico{height:24px;border-radius:10px}
.bottom-nav button span{font-size:10px;font-weight:700}
.bottom-nav button.on .ico{background:var(--primary-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 12%,transparent)}
.backdrop{background:rgba(7,18,14,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet{
  border-radius:30px 30px 0 0;
  max-height:94dvh;
  border:1px solid var(--outline);border-bottom:0;
  box-shadow:var(--shadow-3);
  transition:transform .36s cubic-bezier(.22,.8,.22,1);
}
.sheet::before{width:38px;height:4px;margin-top:9px;background:var(--outline)}
.sheet-head{padding:12px 18px 7px}
.sheet-head h2{font-size:17px;font-weight:800}
.sheet-head .close,.sheet-head .danger{background:var(--surface-2);border:1px solid var(--outline)}
.sheet-body{padding:5px 18px 22px}
.field{margin-bottom:15px}
.field label{font-size:12px;font-weight:700;margin-bottom:7px}
.field input,.field select,.field textarea{
  min-height:50px;background:var(--surface-2);border:1px solid var(--outline);border-radius:14px;padding:13px 14px;font-weight:600;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
.native-amount-wrap{padding:8px 0 18px}
.amount-entry-row{
  width:min(100%,360px);margin:0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface-2);border:1.5px solid var(--outline);border-radius:20px;padding:6px 14px;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.amount-entry-row:focus-within{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 11%,transparent),0 10px 28px rgba(12,117,100,.08)}
.amount-symbol{font-size:21px;color:var(--text-2);font-weight:800;flex-shrink:0}
.native-amount-input{
  width:100%;min-width:0;height:64px;border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important;
  text-align:center;font-size:40px!important;line-height:1;font-weight:800!important;letter-spacing:-1.4px;color:var(--text);font-variant-numeric:tabular-nums;
  caret-color:var(--primary);
}
.native-amount-input::placeholder{color:var(--text-3);opacity:.62}
.amount-display .cur{margin-top:7px;font-size:11.5px;font-weight:700;color:var(--text-3)}
.sheet-footer{flex-shrink:0;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--outline);background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tx-footer .tx-save-btn{height:54px;border-radius:16px;font-size:15px}
.tx-save-icon{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.16);font-size:15px}
.cat-scroll{gap:7px;padding:2px 0 10px}
.cat-chip-s{border-radius:13px;padding:9px 12px;border:1px solid var(--outline);font-weight:700;transition:transform .16s,border-color .16s,background .16s}
.cat-chip-s:active{transform:scale(.96)}
.cat-chip-s.on{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 50%,var(--outline));box-shadow:0 5px 14px rgba(12,117,100,.08)}
.source-mode{border-radius:14px;border:1px solid var(--outline);padding:3px;background:var(--surface-2)}
.source-mode button{border-radius:11px;font-weight:700}
.src-chip{border:1px solid var(--outline);border-radius:16px;background:var(--surface);box-shadow:0 3px 12px rgba(18,52,43,.035)}
.src-chip.on{border-color:var(--primary);background:var(--primary-soft)}
.src-chip .src-lbl b{font-weight:800}
.chip,.date-chip,.country-opt{border:1px solid var(--outline)!important;font-weight:700}
.date-chip{border-radius:12px}
details.adv-details{border:1px solid var(--outline);border-radius:16px;background:var(--surface-2)}
details.adv-details summary{font-weight:700}
.dialog{border:1px solid var(--outline);border-radius:24px;box-shadow:var(--shadow-3)}
.dialog .title{font-weight:800}
.toast{border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,.22);font-weight:700}
.onboard{background:var(--bg)}
.ob-slide h2{font-weight:800}
.preview-banner,.recovery-banner,.missed-banner{border-radius:16px}

@keyframes v890FadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
main>.wallet-hero,main>.country-summary,main>.debt-summary,main>.card,main>.stat-grid,main>.tx-list,main>.list{animation:v890FadeUp .30s ease both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (max-width:370px){
  .native-amount-input{font-size:34px!important;height:58px}
  .sheet-body{padding-inline:14px}
  .sheet-footer{padding-inline:14px}
  main{padding-inline:12px}
}

/* ===== SANAD V9 product polish ===== */
body{font-family:"Cairo",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Tahoma,sans-serif;background:
  radial-gradient(circle at 15% -10%,color-mix(in srgb,var(--primary) 9%,transparent),transparent 32%),var(--bg)}
#app{background:transparent}

.card,.country-summary,.list,.saving-card{border:1px solid color-mix(in srgb,var(--outline) 76%,transparent)}

.btn:active,.quick-chip:active,.chip:active,.country-btn:active,.seg button:active{transform:scale(.98)}
.bottom-nav{backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);background:color-mix(in srgb,var(--surface) 92%,transparent)}
.feature-card{padding:0 14px;overflow:hidden}

.family-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.family-summary>div{background:var(--surface-2);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:4px}.family-summary span{font-size:11.5px;color:var(--text-2)}.family-summary b{font-size:20px;color:var(--primary)}
.family-member{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--outline)}.family-member:last-child{border-bottom:0}.fm-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-weight:800}.family-member>div{display:flex;flex-direction:column;min-width:0}.family-member b{font-size:13.5px}.family-member span{font-size:11.5px;color:var(--text-2);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis}

.tx-pay-block{margin-top:12px;padding:12px;border-radius:18px;background:var(--surface-2);border:1px solid var(--outline)}.tx-pay-block .amount-display{margin-bottom:10px}.tx-pay-block .source-mode{background:var(--surface)}.sanad-receipt-field.quick{margin:10px 0 0}.sanad-receipt-field.quick .sanad-receipt-box{background:var(--surface);padding:8px}.sanad-receipt-field.quick .receipt-btn{height:44px}.sanad-receipt-box{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed color-mix(in srgb,var(--primary) 45%,var(--outline));background:color-mix(in srgb,var(--primary-soft) 35%,var(--surface));border-radius:14px}.receipt-btn{margin:0}.receipt-state{font-size:11.5px;color:var(--text-2);text-align:center}.receipt-preview{width:100%;height:145px;object-fit:cover;border-radius:11px;border:1px solid var(--outline)}.receipt-full{width:100%;height:auto;max-height:70dvh;object-fit:contain;border-radius:14px;background:#fff}.receipt-detail-card{margin-top:12px!important}.receipt-detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.receipt-detail-img{width:100%;height:170px;object-fit:cover;border-radius:11px;margin-top:10px}

function hexToRgb(hex){
  hex = String(hex || '#00695C').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const n = parseInt(hex,16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function tintGradient(color){
  const {r,g,b} = hexToRgb(color);
  const clamp = v => Math.max(0,Math.min(255,Math.round(v)));
  const r1 = clamp(r*0.75),g1 = clamp(g*0.75),b1 = clamp(b*0.75);
  const r2 = clamp(r*1.05),g2 = clamp(g*1.05),b2 = clamp(b*1.05);
  return `linear-gradient(135deg, rgb(${r1},${g1},${b1}) 0%, rgb(${r2},${g2},${b2}) 100%)`;
}
function contrastTextColor(hex){
  if (!hex) return '#FFFFFF';
  const {r,g,b} = hexToRgb(hex);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? '#1A1C1B' : '#FFFFFF';
}

  }

  return false;
}

function canWrite(){ return S.previewMode || S.storageStatus === 'ok'; }

function snapshotState(){ return StateModel.snapshotState(S); }

async function persist(){
  if (!canWrite()) return false;
  /* Preview: memory adapter is durable for the session — simple write. */
  if (S.previewMode){
    try { return await Storage.writeState(snapshotState()); } catch(_){ return false; }
  }
  /* IDB: read durable first, verified write with durable rollback. */
  let read = { ok:false };
  try { read = await Storage.readState(); } catch(_){ read = { ok:false }; }
  if (!read.ok){
    await enterRecoveryMode('persist: durable read failed', read.error || new Error('read failed'));
    return false;
  }
  const durableBefore = read.state ? deepClone(read.state) : null;
  const candidate = snapshotState();
  const vres = await verifiedWriteState(candidate, durableBefore);
  return !!vres.ok;
}

/* ===== V8.8.4.4 — Verified persistence + recovery helpers ===== */

async function enterRecoveryMode(reason, err){
  const wasRecovery = (S.storageStatus && S.storageStatus !== 'ok');
  S.storageStatus = 'corrupted';
  S.storageError = err || new Error(reason || 'integrity failure');
  try { render(); } catch(_){}
  if (!wasRecovery){
    try { toast('وضع الحماية — تعذر التحقق من الكتابة'); } catch(_){}
  }
}

/* Rotate 3 pre-crit snapshots: pre-crit-3 ← pre-crit-2 ← pre-crit-1 ← state */
async function writeRotatedPreCritSnapshot(state){
  return PersistenceService.rotateVerifiedSnapshot(
    state,
    {one:'pre-crit-1',two:'pre-crit-2',three:'pre-crit-3'},
    'snap'
  );
}

/* V8.8.4.8: verified user-snapshot rotation (1←2←3) used before destructive ops.
   Unlike pre-crit snapshots, these ARE user-visible restore points. */
async function writeRotatedUserSnapshot(state){
  if (S.previewMode){
    try { await Storage.rotateSnapshot(state); return {ok:true}; }
    catch(e){ return {ok:false, reason:'preview-rotate-failed', error:e}; }
  }
  return PersistenceService.rotateVerifiedSnapshot(
    state,
    {one:'1',two:'2',three:'3'},
    'user-snap'
  );
}

/* Write previous state and verify it reads back with matching fingerprint */
async function tryRestoreVerified(prevState){
  return PersistenceService.tryRestoreVerified(prevState);
}

/* verifiedWriteState: write → read → fingerprint compare.
   On ANY failure: try to restore fallbackState with verification.
   If restore fails too: enter Recovery/read-only. */
async function verifiedWriteState(nextState, fallbackState){
  return PersistenceService.verifiedWriteState(nextState, fallbackState);
}

/* V8.8.4.9: transient flag for specific mutation-rejection reasons.
   Reset at the start of every commitCriticalMutation call. */
let _lastMutationError = null;

/* V8.8.4.10: centralized prepaid non-negative invariant.
   Returns null if OK, or 'prepaid-insufficient' if the candidate worsened a
   prepaid account balance. Legacy negative balances may be improved but not worsened. */
function checkPrepaidInvariant(prepaidBefore){
  return FinanceCore.checkPrepaidInvariant(prepaidBefore,S);
}

  verifiedWrite: verifiedWriteState,
  tryRestore: tryRestoreVerified,
  enterRecovery: enterRecoveryMode,
  setMutationError: v => { _lastMutationError = v; },
  logError: (...args) => console.error(...args)
});

async function _commitCriticalMutationImpl(mutateFn){
  return MutationService.run(mutateFn);
}

let _criticalMutationInFlight = false;
async function commitCriticalMutation(mutateFn){
  if (_criticalMutationInFlight){
    _lastMutationError = 'busy';
    return {ok:false, reason:'busy', restored:true};
  }
  _criticalMutationInFlight = true;
  try { return await _commitCriticalMutationImpl(mutateFn); }
  finally { _criticalMutationInFlight = false; }
}

/* ---------- FINANCE ENGINE ---------- */
const Finance = {
  curInfo(code){ return CURRENCIES[code] || CURRENCIES.EGP; },
  curSymbol(code){ const c=this.curInfo(code); return (S.settings&&S.settings.language==='en') ? (c.code||code) : c.symbol; },
  getAccount(id){ return S.accounts.find(a => a.id === id) || null; },
  getInstrument(id){ return S.paymentInstruments.find(i => i.id === id) || null; },
  getInstitution(id){ return S.institutions.find(i => i.id === id) || null; },
  getBeneficiary(id){ return S.beneficiaries.find(b => b.id === id) || null; },

  registeredBankId(inst){
    if (!inst) return null;
    if (inst.bankRegistryId && UaeBankRegistryCore.get(inst.bankRegistryId)) return inst.bankRegistryId;
    const hit = UaeBankRegistryCore.detect(inst.name || '');
    return hit ? hit.bank.id : null;
  },
  findRegisteredBank(bankId,country){
    if (!bankId) return null;
    const c = country || 'UAE';
    return S.institutions.find(i => i.country === c && this.registeredBankId(i) === bankId) || null;
  },
  ensureRegisteredBank(bankId,country){
    const bank = UaeBankRegistryCore.get(bankId);
    if (!bank) return null;
    const c = country || 'UAE';

/* V8.8.4.11: single source of truth for a transaction's budget context.
   Returns { country, month } or null if not budget-relevant. */
function budgetContextForTransaction(tx){
  if (!tx || !tx.date) return null;
  let acc = null;
  if (tx.type === 'expense' || tx.type === 'income'){
    acc = Finance.getAccount(tx.accountId);
  } else if (tx.type === 'external_transfer'){
    acc = Finance.getAccount(tx.fromAccountId);
  } else if (tx.type === 'transfer'){
    acc = Finance.getAccount(tx.fromAccountId);
  } else {
    /* adjustments don't affect budgets */
    return null;
  }
  if (!acc) return null;
  const month = String(tx.date).slice(0,7);
  if (!month) return null;
  return { country: acc.country, month };
}


async function runBudgetAlerts(country, month){
  /* V8.8.4.7 P0: metadata-only rollback.
     beforeMetadata is captured BEFORE evaluate, so it already reflects the
     financial transaction that was committed & verified by the caller. */
  const beforeMetadata = snapshotState();

  const alerts = Finance.evaluateBudgetAlerts({country, month});
  if (alerts.length) S.activeBudgetAlerts = alerts;

  if (S.previewMode){
    try { await Storage.writeState(snapshotState()); } catch(_){}
    return alerts;
  }
  if (S.storageStatus !== 'ok'){
    return alerts;
  }

  const afterMetadata = snapshotState();
  const vres = await verifiedWriteState(afterMetadata, beforeMetadata);
  if (vres.ok) return alerts;

  if (vres.restored){
    /* Rollback succeeded — keep the committed transaction, lose only the
       unsaved alert-flag changes. Do NOT enter Recovery. */
    loadStateInto(beforeMetadata);
    return alerts;
  }
  /* Rollback failed — verifiedWriteState already entered Recovery. */
  loadStateInto(beforeMetadata);
  return alerts;
}

/* ---------- Canonical helpers ---------- */
function hasAccountHistory(accountId){
  if (!accountId) return false;
  return S.transactions.some(t =>
    t.accountId === accountId || t.fromAccountId === accountId || t.toAccountId === accountId
  ) || S.recurring.some(r => r.accountId === accountId);
}
function cardHasHistory(cardId){
  const inst = Finance.getInstrument(cardId);
  if (!inst) return false;
  const directInstrumentHistory =
    S.transactions.some(t => t.instrumentId === cardId) ||
    S.recurring.some(r => r.instrumentId === cardId);
  if (inst.type === 'debit_card'){
    return directInstrumentHistory;
  }
  return directInstrumentHistory || hasAccountHistory(inst.accountId);
}
function hasLinkedDebitCards(accountId){
  if (!accountId) return false;
  return S.paymentInstruments.some(i => i.accountId === accountId && i.type === 'debit_card');
}
function isRecurringSourceValid(r){
  if (!r || !r.accountId) return false;
  const acc = Finance.getAccount(r.accountId);
  if (!acc || acc.archived) return false;
  if (r.instrumentId){
    const inst = Finance.getInstrument(r.instrumentId);
    if (!inst || inst.archived) return false;
    const linkedAcc = Finance.getAccount(inst.accountId);
    if (!linkedAcc || linkedAcc.archived) return false;
    if (inst.accountId !== r.accountId) return false;
  }
  return true;
}
function isRepaymentTransaction(tx){
  if (!tx || tx.type !== 'transfer') return false;
  const toAcc = Finance.getAccount(tx.toAccountId);
  return toAcc && isLiabilityAccount(toAcc);
}
function getLinkedRepaymentFees(transferId){
  if (!transferId) return [];
  return S.transactions.filter(x =>
    x && x.linkedTransferId === transferId && x.type === 'expense' && x.cat === 'debtInterest'
  );
}
function removeLinkedRepaymentFees(transferId){
  if (!transferId) return 0;
  const before = S.transactions.length;
  S.transactions = S.transactions.filter(x =>
    !(x && x.linkedTransferId === transferId && x.type === 'expense' && x.cat === 'debtInterest')
  );
  return before - S.transactions.length;
}
function syncLinkedRepaymentFee(transferId, fee, fromAcc, date){
  if (!transferId || !fromAcc) return;
  const existing = getLinkedRepaymentFees(transferId);
  const feeAmt = Number(fee) || 0;
  if (feeAmt <= 0){
    if (existing.length) removeLinkedRepaymentFees(transferId);
    return;
  }
  if (existing.length === 0){
    S.transactions.push({
      id: uid('lf'),
      type: 'expense',
      cat: 'debtInterest',
      amount: feeAmt,
      walletAmount: feeAmt,
      currency: fromAcc.currency,
      accountId: fromAcc.id,
      fxRate: 1,
      note: 'فوائد / رسوم سداد',
      tags: ['سداد'],
      date: date || isoToday(),
      linkedTransferId: transferId,
      created: Date.now()
    });
    return;
  }
  const keep = existing[0];
  keep.amount = feeAmt;
  keep.walletAmount = feeAmt;
  keep.currency = fromAcc.currency;
  keep.accountId = fromAcc.id;
  keep.fxRate = 1;
  keep.date = date || keep.date || isoToday();
  keep.cat = 'debtInterest';
  keep.type = 'expense';
  keep.linkedTransferId = transferId;
  if (existing.length > 1){
    const keepId = keep.id;
    S.transactions = S.transactions.filter(x =>
      !(x && x.linkedTransferId === transferId && x.cat === 'debtInterest' && x.id !== keepId)
    );
  }
}

function dialog(opts){
  return new Promise(resolve => {
    const bg = document.getElementById('dlg');
    document.getElementById('dlgEmoji').textContent = opts.emoji || '⚠️';
    document.getElementById('dlgTitle').textContent = opts.title || '';
    document.getElementById('dlgMsg').textContent = opts.msg || '';
    const okBtn = document.getElementById('dlgOk'), cancelBtn = document.getElementById('dlgCancel');
    okBtn.textContent = opts.okText || 'تأكيد';
    cancelBtn.textContent = opts.cancelText || 'إلغاء';
    okBtn.className = 'ok' + (opts.primary ? ' primary' : '');
    cancelBtn.style.display = opts.hideCancel ? 'none' : '';
    bg.classList.add('on');
    function cleanup(){ bg.classList.remove('on'); okBtn.removeEventListener('click',onOk); cancelBtn.removeEventListener('click',onCancel); bg.removeEventListener('click',onBg); }
    function onOk(){ cleanup(); resolve(true); }
    function onCancel(){ cleanup(); resolve(false); }
    function onBg(e){ if (e.target === bg){ cleanup(); resolve(false); } }
    okBtn.addEventListener('click',onOk);
    cancelBtn.addEventListener('click',onCancel);
    bg.addEventListener('click',onBg);
  });
}

  const label = c ? c.n : 'حد الإنفاق الشهري';
  let msg = '';
  if (first.level === 'warn') msg = 'استخدمت ' + Math.round(first.pct) + '% من ' + label + ' هذا الشهر.';
  else if (first.level === 'strong') msg = 'باقي ' + amtFull(first.limit - first.spent, first.currency) + ' فقط من ' + label + '.';
  else if (first.level === 'over') msg = 'تجاوزت ' + label + ' بـ ' + amtFull(first.spent - first.limit, first.currency) + '.';
  if (msg) toast(msg);
  if (alerts.length > 1) setTimeout(() => toast('+' + (alerts.length - 1) + ' تنبيه آخر'), 800);
}

function daysUntilNextOccurrence(r){
  return ReminderCore.daysUntilNextOccurrence(r,Date.now());
}
function getDueOccurrences(r, now){
  const out = [];
  const freq = r.frequency || 'monthly';
  const day = Math.min(28, Math.max(1, Number(r.day) || 1));
  const today = new Date(now); today.setHours(0,0,0,0);
  const thisY = today.getFullYear();
  const thisM = today.getMonth() + 1;
  if (freq === 'yearly'){
    const m = Math.min(11, Math.max(0, Number(r.month) || 0));
    const lastY = r.lastAppliedYear;
    let startY = lastY ? lastY + 1 : thisY;
    for (let y = startY; y <= thisY; y++){
      const occDate = new Date(y, m, day);
      if (occDate <= today) out.push({key:'y'+y, date:y+'-'+pad(m+1)+'-'+pad(day)});
    }
    return out;
  }
  let startY, startM;
  if (r.lastAppliedMonth){
    const parts = String(r.lastAppliedMonth).split('-').map(Number);
    startY = parts[0]; startM = parts[1] + 1;
    if (startM > 12){ startM = 1; startY++; }
  } else {
    startY = thisY; startM = thisM;
  }
  let y = startY, m = startM, safety = 0;
  while ((y < thisY || (y === thisY && m <= thisM)) && safety < 120){
    safety++;
    const occDate = new Date(y, m-1, day);
    if (occDate <= today) out.push({key:y+'-'+pad(m), date:y+'-'+pad(m)+'-'+pad(day)});
    m++;
    if (m > 12){ m = 1; y++; }
  }
  return out;
}
function computePendingRecurring(){
  const pending = [];
  const now = new Date();
  for (const r of S.recurring){
    if (!r.active) continue;
    if (!isRecurringSourceValid(r)) continue;
    const occurrences = getDueOccurrences(r, now);
    for (const occ of occurrences){
      const tag = r.id + ':' + occ.key;
      if (S.transactions.some(t => t.rec === tag)) continue;
      if (S.settings.dismissedReminders[tag]) continue;
      pending.push({r, occ, tag});
    }
  }
  return pending;
}
async function recomputePendingRecurring(){ S.pendingRecurring = computePendingRecurring(); }
async function applyPendingRecurring(){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  if (!S.pendingRecurring.length){ toast('لا يوجد فوات'); return; }
  const touchedPairs = new Set();
  let count = 0;
  let skippedInsufficient = 0;

  /* V8.8.4.10: apply sequentially so earlier accepted occurrences affect
     the running prepaid balance. Skip-and-continue on prepaid shortfall. */
  const result = await commitCriticalMutation(async () => {
    for (const p of S.pendingRecurring){
      const r = p.r;
      if (!isRecurringSourceValid(r)) continue;
      const acc = Finance.getAccount(r.accountId);
      if (!acc) continue;
      const accCur = acc.currency;
      const txCur = r.currency || accCur;
      let fxRate = 1, walletAmount = Number(r.amount) || 0;
      if (txCur !== accCur){
        fxRate = Finance.suggestRate(txCur, accCur);
        walletAmount = Math.round((Number(r.amount) || 0) * fxRate * 100) / 100;
      }
      /* V8.8.4.10: prepaid-aware check BEFORE pushing this occurrence */
      if (r.type === 'expense' && acc.type === 'prepaid'){
        const curBal = Finance.accountBalance(acc.id);
        if (curBal - walletAmount < -0.01){
          skippedInsufficient++;
          continue; /* leave occurrence pending — do NOT bump lastApplied* */
        }
      }
      S.transactions.push({
        id: uid('r'),
        type: r.type === 'income' ? 'income' : 'expense',
        amount: Number(r.amount) || 0,
        currency: txCur, accountId: r.accountId,
        instrumentId: r.instrumentId || null,
        walletAmount, fxRate,
        cat: r.category, note: r.name, tags: [],
        date: p.occ.date, rec: p.tag, created: Date.now()
      });
      if (r.frequency === 'yearly') r.lastAppliedYear = Number(p.occ.date.slice(0,4));
      else r.lastAppliedMonth = p.occ.date.slice(0,7);
      if (r.type === 'expense'){
        const ym = p.occ.date.slice(0,7);
        touchedPairs.add(acc.country + '|' + ym);
      }
      count++;
    }
    return true;
  });
  if (!result.ok){
    render();
    if (result.reason === 'prepaid-insufficient'){
      toast('تعذر تسجيل بعض المعاملات لعدم كفاية الرصيد');
    } else {
      toast('تعذر الحفظ');
    }
    return;
  }
  for (const pair of touchedPairs){
    const [c, ym] = pair.split('|');
    await runBudgetAlerts(c, ym);
  }
  await recomputePendingRecurring();
  render();
  if (skippedInsufficient > 0){
    toast('تم تسجيل ' + count + ' معاملة — تعذر تسجيل ' + skippedInsufficient + ' لعدم كفاية رصيد البطاقة المدفوعة مقدمًا');
  } else {
    toast(count + ' معاملة مسجلة');
  }
  setTimeout(showBudgetAlertsIfAny, 400);
}
async function dismissPendingRecurring(){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const result = await commitCriticalMutation(async () => {
    for (const p of S.pendingRecurring){ S.settings.dismissedReminders[p.tag] = Date.now(); }
    S.pendingRecurring = [];
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  render();
}
function getUpcomingRecurring(){
  const list = [];
  for (const r of S.recurring){
    if (!r.active) continue;
    if (!isRecurringSourceValid(r)) continue;
    const d = daysUntilNextOccurrence(r);
    if (d <= 7) list.push({r, days:d});
  }
  return list.sort((a,b) => a.days - b.days);
}

function txRowHtml(t, withSwipe){

    const acc = Finance.getAccount(t.accountId);
    const cur = t.currency || (acc ? acc.currency : 'EGP');
    const sign = (Number(t.walletAmount) || 0) >= 0 ? '+' : '−';
    const abs = Math.abs(Number(t.walletAmount) || 0);
    const inner = '<div class="ic" style="background:var(--warn-soft);color:var(--warn)">⚖️</div>' +
      '<div class="info"><b>تسوية</b><span>' + (acc ? esc(acc.name) : '—') + ' · ' + esc(t.note || '') + '</span></div>' +
      '<div class="amt adjustment amt-val">' + sign + amtText(abs) + ' ' + Finance.curSymbol(cur) + '</div>';

    return '<div class="tx-item" data-txid="' + t.id + '">' + inner + '</div>';
  }
  if (t.type === 'transfer'){
    const fromAcc = Finance.getAccount(t.fromAccountId);
    const toAcc = Finance.getAccount(t.toAccountId);
    const fromCur = t.fromCurrency || (fromAcc ? fromAcc.currency : 'EGP');
    const toCur = t.toCurrency || (toAcc ? toAcc.currency : 'EGP');
    const fee = Number(t.fee) || 0;
    const feeLine = fee > 0 ? '<span class="fx amt-val">+ رسوم ' + amtFull(fee, fromCur) + '</span>' : '';
    const isRepayment = toAcc && isLiabilityAccount(toAcc);
    const isCross = fromAcc && toAcc && fromAcc.country !== toAcc.country;
    let label;
    if (isRepayment) label = toAcc.type === 'credit' ? 'سداد بطاقة' : 'سداد دين';
    else if (isCross){
      if (fromAcc.country === S.activeCountry) label = 'تحويل إلى ' + countryInfo(toAcc.country).name;
      else if (toAcc.country === S.activeCountry) label = 'تحويل وارد من ' + countryInfo(fromAcc.country).name;
      else label = 'تحويل بين بلدين';
    } else label = 'تحويل بين حساباتي';
    const inner = '<div class="ic" style="background:var(--info-soft);color:var(--info)">🔄</div>' +
      '<div class="info"><b>' + label + '</b><span>' + (fromAcc ? esc(fromAcc.name) : '—') + ' → ' + (toAcc ? esc(toAcc.name) : '—') + '</span></div>' +
      '<div class="amt transfer amt-val">' + amtText(t.fromAmount) + ' ' + Finance.curSymbol(fromCur) +
        (fromCur !== toCur ? '<span class="fx amt-val">= ' + amtFull(t.toAmount, toCur) + '</span>' : '') + feeLine + '</div>';
    if (withSwipe) return '<div class="tx-item-wrap" data-wrap="' + t.id + '"><div class="hint-icon">✏️</div><div class="tx-item" data-txid="' + t.id + '">' + inner + '</div></div>';
    return '<div class="tx-item" data-txid="' + t.id + '">' + inner + '</div>';
  }
  if (t.type === 'external_transfer'){
    const fromAcc = Finance.getAccount(t.fromAccountId);
    const bene = Finance.getBeneficiary(t.beneficiaryId);
    const fromCur = t.fromCurrency || (fromAcc ? fromAcc.currency : 'EGP');
    const receivedCur = t.receivedCurrency || (bene ? bene.defaultCurrency : fromCur);
    const fee = Number(t.fee) || 0;
    const feeLine = fee > 0 ? '<span class="fx amt-val">+ رسوم ' + amtFull(fee, fromCur) + '</span>' : '';
    const inner = '<div class="ic" style="background:var(--error-soft);color:var(--error)">👤</div>' +
      '<div class="info"><b>تحويل إلى ' + (bene ? esc(bene.name) : '—') + '</b>' +
        '<span>' + (fromAcc ? esc(fromAcc.name) : '—') + (bene ? ' · ' + countryInfo(bene.country).name : '') + '</span></div>' +
      '<div class="amt external amt-val">−' + amtText(t.fromAmount) + ' ' + Finance.curSymbol(fromCur) +
        (fromCur !== receivedCur ? '<span class="fx amt-val">= ' + amtFull(t.receivedAmount, receivedCur) + '</span>' : '') + feeLine + '</div>';
    if (withSwipe) return '<div class="tx-item-wrap" data-wrap="' + t.id + '"><div class="hint-icon">✏️</div><div class="tx-item" data-txid="' + t.id + '">' + inner + '</div></div>';
    return '<div class="tx-item" data-txid="' + t.id + '">' + inner + '</div>';
  }
  const c = Finance.getCat(t.type, t.cat);
  const acc = Finance.getAccount(t.accountId);
  const inst = t.instrumentId ? Finance.getInstrument(t.instrumentId) : null;
  const sign = t.type === 'income' ? '+' : '−';
  const cls = t.type === 'income' ? 'pos' : '';
  const tags = (t.tags||[]).map(tag => '<span class="tag">#' + esc(tag) + '</span>').join('');
  const noteText = t.merchantName ? esc(t.merchantName) : (t.note ? esc(t.note) : esc(c.n));
  const sourceTxt = inst ? (inst.name + (inst.last4 ? ' ••' + inst.last4 : '')) : (acc ? acc.name : '');
  const origCur = t.currency || (acc ? acc.currency : 'EGP');
  const walletCur = acc ? acc.currency : 'EGP';
  const fxLine = (origCur !== walletCur && t.fxRate && t.fxRate !== 1)
    ? '<span class="fx amt-val">≈ ' + amtFull(t.walletAmount, walletCur) + '</span>' : '';
  const inner = '<div class="ic" style="background:' + c.c + '22;color:' + c.c + '">' + c.i + '</div>' +
    '<div class="info"><b>' + tags + esc(c.n) + (t.rec ? ' 🔁' : '') + '</b>' +
      '<span>' + noteText + (sourceTxt ? ' • ' + esc(sourceTxt) : '') + '</span></div>' +
    '<div class="amt ' + cls + ' amt-val">' + sign + amtText(t.amount) + ' ' + Finance.curSymbol(origCur) + fxLine + '</div>';
  if (withSwipe) return '<div class="tx-item-wrap" data-wrap="' + t.id + '"><div class="hint-icon">✏️</div><div class="tx-item" data-txid="' + t.id + '">' + inner + '</div></div>';
  return '<div class="tx-item" data-txid="' + t.id + '">' + inner + '</div>';
}

function hasActiveFilter(){ return !!(S.filter.type || S.filter.cat || S.filter.source); }
function filteredTx(){
  const countryIds = new Set(Finance.getCountryAccounts(S.activeCountry).map(a => a.id));
  let list = S.transactions.filter(t => t.date && t.date.slice(0,7) === S.month);
  list = list.filter(t => {
    if (t.accountId && countryIds.has(t.accountId)) return true;
    if (t.type === 'transfer'){
      if (t.fromAccountId && countryIds.has(t.fromAccountId)) return true;
      if (t.toAccountId && countryIds.has(t.toAccountId)) return true;
    }
    if (t.type === 'external_transfer'){
      if (t.fromAccountId && countryIds.has(t.fromAccountId)) return true;
    }
    return false;
  });
  if (S.filter.type) list = list.filter(t => t.type === S.filter.type);
  if (S.filter.cat) list = list.filter(t => t.cat === S.filter.cat);
  if (S.filter.source) list = list.filter(t =>
    t.accountId === S.filter.source || t.fromAccountId === S.filter.source ||
    t.toAccountId === S.filter.source || t.instrumentId === S.filter.source ||
    t.beneficiaryId === S.filter.source);
  if (S.filter.q){
    const q = S.filter.q.trim().toLowerCase();
    if (q) list = list.filter(t => {
      const c = Finance.getCat(t.type, t.cat);
      const acc = Finance.getAccount(t.accountId);
      const inst = t.instrumentId ? Finance.getInstrument(t.instrumentId) : null;
      const bene = t.beneficiaryId ? Finance.getBeneficiary(t.beneficiaryId) : null;
      return (t.note||'').toLowerCase().includes(q) ||
        (t.merchantName||'').toLowerCase().includes(q) ||
        (c.n||'').toLowerCase().includes(q) ||
        (acc ? acc.name.toLowerCase().includes(q) : false) ||
        (inst ? inst.name.toLowerCase().includes(q) : false) ||
        (bene ? bene.name.toLowerCase().includes(q) : false) ||
        String(t.amount || t.fromAmount || '').includes(q) ||
        (t.tags||[]).some(tag => tag.toLowerCase().includes(q));
    });
  }
  return list.sort(compareTxDesc);
}
function txListHtml(){
  const list = filteredTx();
  if (!list.length) return '<div class="empty"><div class="em">🔍</div><p>لا توجد نتائج</p></div>';
  const groups = {};
  list.forEach(t => { (groups[t.date] = groups[t.date]||[]).push(t); });
  let html = '';
  Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(day => {
    const items = groups[day];
    html += '<div class="day-head"><span>' + esc(dayLabel(day)) + '</span><span>' + items.length + ' معاملة</span></div>' +
      '<div class="tx-list" style="margin-bottom:12px">' + items.map(t => txRowHtml(t, true)).join('') + '</div>';
  });
  return html;
}

function drawPie(animate){
  const canvas = document.getElementById('pieCanvas');
  if (!canvas) return;
  const country = S.activeCountry;
  const p = S.repPeriod;
  const activeCur = S.repCurrency;
  if (!activeCur) return;
  const ds = Finance.buildReportDataset({country, period:p, accountId: S.repAccountId || null, currency: activeCur, month: S.month});
  const buckets = ReportCore.categoryPieBuckets(ds.categoryByCur[activeCur] || {});
  if (!buckets.length) return;
  const data = buckets.map(bucket => ({
    v:bucket.value,
    c:bucket.other ? '#94a3b8' : Finance.getCat('expense', bucket.id).c
  }));
  const total = data.reduce((s,d) => s + d.v, 0);
  if (!total) return;
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth || 120;
  canvas.width = size * dpr; canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#fff';
  const cx = size/2, cy = size/2, r = size/2 - 3;
  function draw(progress){
    ctx.clearRect(0,0,size,size);
    let a = -Math.PI/2;
    data.forEach(d => {
      const ang = (d.v/total) * Math.PI*2 * progress;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,a,a+ang); ctx.closePath();
      ctx.fillStyle = d.c; ctx.fill();
      a += ang;
    });
    ctx.beginPath(); ctx.arc(cx,cy,r*0.6,0,Math.PI*2); ctx.fillStyle = bg; ctx.fill();
  }
  if (!animate){ draw(1); return; }
  const start = performance.now();
  const dur = 500;
  function tick(now){
    const t = Math.min(1, (now-start)/dur);
    const e = 1 - Math.pow(1-t, 3);
    draw(e);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function openRecSheet(id, presetType){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const isEdit = !!id;
  const r = isEdit ? S.recurring.find(x => x.id === id) : null;
  const country = S.activeCountry;
  const cards = getCountryCards(country);
  const accounts = getCountryMoneyAccounts(country);
  if (!accounts.length && !cards.length){ toast('أضف حساباً أو بطاقة أولاً'); return; }
  const kind = r ? r.type : (presetType || 'expense');
  const isIncome = kind === 'income';
  let accountId = null, instrumentId = null, sourceMode = 'accounts';
  if (r){
    accountId = r.accountId;
    instrumentId = r.instrumentId;
    sourceMode = r.instrumentId ? 'cards' : 'accounts';
  } else {
    const defInstId = Finance.getDefaultInstrumentId(country);
    if (!isIncome && defInstId){
      const defInst = Finance.getInstrument(defInstId);
      if (defInst){
        accountId = defInst.accountId;
        instrumentId = defInst.id;
        sourceMode = 'cards';
      }
    }
    if (!accountId){
      const defAccId = Finance.getDefaultAccountId(country);
      if (defAccId){
        accountId = defAccId;
        instrumentId = null;
        sourceMode = 'accounts';
      } else if (!isIncome && cards.length){
        accountId = cards[0].accountId;
        instrumentId = cards[0].id;
        sourceMode = 'cards';
      } else if (accounts.length){
        accountId = accounts[0].id;
        instrumentId = null;
        sourceMode = 'accounts';
      }
    }
  }
  const acc = Finance.getAccount(accountId);
  S.form = {
    _sheet: 'recurring',
    id: id || null,
    type: kind,
    name: r ? r.name : '',
    amount: r ? String(r.amount || '') : '',
    currency: r ? (r.currency || (acc ? acc.currency : 'AED')) : (acc ? acc.currency : 'AED'),
    accountId,
    instrumentId,
    sourceMode,
    category: r ? r.category : (isIncome ? 'salary' : 'subs'),
    frequency: r ? (r.frequency || 'monthly') : 'monthly',
    day: r ? (Number(r.day) || 1) : 1,
    month: r && r.month != null ? r.month : new Date().getMonth(),
    reminderDays: r && r.reminderDays != null ? r.reminderDays : 3,
    active: r ? (r.active !== false) : true
  };
  renderRecSheet();
}

function syncRecurringFormFromDom(){

  if (nameEl) S.form.name = nameEl.value;
  const amountEl = document.getElementById('recAmount');
  if (amountEl) S.form.amount = amountEl.value;
  const curEl = document.getElementById('recCur');
  if (curEl) S.form.currency = curEl.value;
  const catEl = document.getElementById('recCat');
  if (catEl) S.form.category = catEl.value;
  const freqEl = document.getElementById('recFreq');
  if (freqEl) S.form.frequency = freqEl.value;
  const monthEl = document.getElementById('recMonth');
  if (monthEl) S.form.month = parseInt(monthEl.value) || 0;
  const dayEl = document.getElementById('recDay');
  if (dayEl) S.form.day = Math.min(28, Math.max(1, parseInt(dayEl.value) || 1));
  const remEl = document.getElementById('recRem');
  if (remEl){ const v = parseInt(remEl.value); S.form.reminderDays = isFinite(v) ? Math.max(0, Math.min(30, v)) : 3; }

function setRecSourceMode(mode){

function setRecSource(kind, id){
  if (!S.form || S.form._sheet !== 'recurring') return;
  syncRecurringFormFromDom();

    const inst = Finance.getInstrument(id);

async function saveRec(id){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  syncRecurringFormFromDom();
  const f = S.form;
  if (!f || f._sheet !== 'recurring') return;
  const name = (f.name || '').trim();
  const amount = parseFloat(f.amount) || 0;
  if (!name){ toast('أدخل الاسم'); return; }
  if (!amount || amount <= 0){ toast('أدخل مبلغاً صحيحاً'); return; }
  if (!f.accountId){ toast('اختر وسيلة دفع'); return; }
  const isEdit = !!f.id;
  const result = await commitCriticalMutation(async () => {
    if (isEdit){
      const r = S.recurring.find(x => x.id === f.id);
      if (r) Object.assign(r, {name, amount, currency: f.currency, accountId: f.accountId,
        instrumentId: f.instrumentId || null, category: f.category, type: f.type,
        frequency: f.frequency, day: f.day, month: f.month,
        reminderDays: f.reminderDays, active: f.active});
    } else {
      S.recurring.push({
        id: uid('rec'), name, amount, currency: f.currency, accountId: f.accountId,
        instrumentId: f.instrumentId || null,
        category: f.category, type: f.type, frequency: f.frequency,
        day: f.day, month: f.month, reminderDays: f.reminderDays,
        icon: f.type === 'income' ? '💰' : '📺', active: f.active,
        isSubscription: false, lastAppliedMonth: null, lastAppliedYear: null
      });
    }
    return true;
  });
  if (!result.ok){ render(); toast('تعذر الحفظ'); return; }
  S.form = null;
  closeSheet();
  await recomputePendingRecurring();
  syncNativeNotifications();
  render();
  toast(isEdit ? 'تم التعديل' : 'تمت الإضافة');
}
async function delRec(id){

function openNewTx(kind, opts){
  opts = opts || {};
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const startCountry = opts.country || S.activeCountry;
  const isIncome = kind === 'income';
  const cards = getCountryCards(startCountry);
  const accounts = getCountryMoneyAccounts(startCountry);
  let defaultSource = null;
  let sourceMode = 'cards';
  if (isIncome){
    const defAccId = Finance.getDefaultAccountId(startCountry);
    const defAcc = defAccId ? Finance.getAccount(defAccId) : null;
    if (defAcc){ defaultSource = {type:'account', id:defAcc.id, accountId:defAcc.id}; }
    else if (accounts[0]){ defaultSource = {type:'account', id:accounts[0].id, accountId:accounts[0].id}; }
    sourceMode = 'accounts';
  } else {
    const defInstId = Finance.getDefaultInstrumentId(startCountry);
    const defInst = defInstId ? Finance.getInstrument(defInstId) : null;
    if (defInst){
      defaultSource = {type:'instrument', id:defInst.id, accountId:defInst.accountId};
      sourceMode = 'cards';
    }
    if (!defaultSource){
      const defAccId = Finance.getDefaultAccountId(startCountry);
      const defAcc = defAccId ? Finance.getAccount(defAccId) : null;
      if (defAcc){
        defaultSource = {type:'account', id:defAcc.id, accountId:defAcc.id};
        sourceMode = 'accounts';
      }
    }
    if (!defaultSource){
      const lastKey = S.settings.lastExpenseSourceByCountry[startCountry];
      if (lastKey && lastKey.sourceType && lastKey.id){
        if (lastKey.sourceType === 'instrument'){
          const inst = Finance.getInstrument(lastKey.id);
          if (inst && !inst.archived && cards.some(c => c.id === inst.id)){
            defaultSource = {type:'instrument', id:inst.id, accountId:inst.accountId};
            sourceMode = 'cards';
          }
        } else if (lastKey.sourceType === 'account'){
          const acc = Finance.getAccount(lastKey.id);
          if (acc && !acc.archived && isAssetAccount(acc) && acc.country === startCountry){
            defaultSource = {type:'account', id:acc.id, accountId:acc.id};
            sourceMode = 'accounts';
          }
        }
      }
    }
    if (!defaultSource){
      if (cards.length){
        defaultSource = {type:'instrument', id:cards[0].id, accountId:cards[0].accountId};
        sourceMode = 'cards';
      } else if (accounts.length){
        defaultSource = {type:'account', id:accounts[0].id, accountId:accounts[0].id};
        sourceMode = 'accounts';
      }
    }
  }
  if (!defaultSource){
    toast('أضف حساباً أو بطاقة في ' + countryInfo(startCountry).name);
    openAccountTypePicker();
    return;
  }
  const acc = Finance.getAccount(defaultSource.accountId);
  S.form = {
    _sheet: 'tx', id: null, kind: kind,
    country: startCountry, sourceMode,
    amount: '', currency: acc ? acc.currency : 'EGP',
    cat: opts.catId || (isIncome ? 'salary' : 'food'),
    source: defaultSource,
    merchantName: opts.merchantName || '',
    note: '', tags: [], date: isoToday(),
    recurring: false,
    recFreq: 'monthly', recDay: 1, recMonth: new Date().getMonth(), recRem: 3,
    showAdvanced: false
  };
  renderTxSheet();
}
function openEditTx(id){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const t = S.transactions.find(x => x.id === id);
  if (!t) return;
  if (t.type === 'adjustment'){ toast('لا يمكن تعديل التسويات'); return; }
  if (t.type === 'transfer'){

function pickDefaultSourceForCountry(country, kind, preferredMode){
  const isIncome = kind === 'income';
  const cards = getCountryCards(country);
  const accounts = getCountryMoneyAccounts(country);
  let mode = preferredMode || (isIncome ? 'accounts' : (cards.length ? 'cards' : 'accounts'));
  let source = null;
  if (isIncome){
    const defAccId = Finance.getDefaultAccountId(country);
    if (defAccId){ source = {type:'account', id:defAccId, accountId:defAccId}; mode = 'accounts'; }
  } else {
    const defInstId = Finance.getDefaultInstrumentId(country);
    if (defInstId){
      const inst = Finance.getInstrument(defInstId);
      if (inst){ source = {type:'instrument', id:inst.id, accountId:inst.accountId}; mode = 'cards'; }
    }
    if (!source){
      const defAccId = Finance.getDefaultAccountId(country);
      if (defAccId){ source = {type:'account', id:defAccId, accountId:defAccId}; mode = 'accounts'; }
    }
  }
  if (!source && !isIncome){
    const lastKey = S.settings.lastExpenseSourceByCountry[country];
    if (lastKey && lastKey.sourceType && lastKey.id){
      if (lastKey.sourceType === 'instrument' && mode === 'cards'){
        const inst = Finance.getInstrument(lastKey.id);
        if (inst && !inst.archived && cards.some(c => c.id === inst.id)){
          source = {type:'instrument', id:inst.id, accountId:inst.accountId};
        }
      } else if (lastKey.sourceType === 'account' && mode === 'accounts'){
        const acc = Finance.getAccount(lastKey.id);
        if (acc && !acc.archived && isAssetAccount(acc) && acc.country === country){
          source = {type:'account', id:acc.id, accountId:acc.id};
        }
      }
    }
  }
  if (!source){
    if (isIncome || mode === 'accounts'){
      const pick = accounts[0];
      if (pick) source = {type:'account', id:pick.id, accountId:pick.id};
      mode = 'accounts';
    } else if (mode === 'cards'){
      if (cards.length) source = {type:'instrument', id:cards[0].id, accountId:cards[0].accountId};
      else {
        const pick = accounts[0];
        if (pick) source = {type:'account', id:pick.id, accountId:pick.id};
        mode = 'accounts';
      }
    }
  }
  return {source, mode};
}

async function saveTx(){
  if (!canWrite()){ toast('وضع القراءة فقط'); return; }
  const f = S.form;
  if (!f || f._sheet !== 'tx') return;
  const amt = parseFloat(f.amount);
  if (!amt || amt <= 0){ toast('أدخل مبلغاً صحيحاً'); return; }
  if (!f.source || !f.source.accountId){ toast('اختر وسيلة دفع'); return; }
  const acc = Finance.getAccount(f.source.accountId);
  if (!acc){ toast('اختر حساباً'); return; }
  const accCur = acc.currency;
  const txCur = f.currency || accCur;
  let fxRate = 1, walletAmount = amt;
  if (txCur !== accCur){
    const rateIn = document.getElementById('fxRateIn');
    const uiRate = rateIn ? parseFloat(rateIn.value) : NaN;
    fxRate = (!isNaN(uiRate) && uiRate > 0) ? uiRate : (Number(f.fxRate) || Finance.suggestRate(txCur, accCur));
    if (!fxRate || fxRate <= 0){ toast('أدخل سعر تحويل صحيح'); return; }
    walletAmount = Math.round(amt * fxRate * 100) / 100;
    // FX memory is persisted inside the critical mutation.
  }
  const wasEdit = !!f.id;
  const isExpense = f.kind === 'expense';
  const origCreated = f._originalCreated || Date.now();
  const origRec = f._originalRec;
  const willCreateRec = !f.id && f.recurring && f.recDay && f.recFreq;
  let recName = null, recFreq = null, recDay = null, recMonth = null, recRem = null, recIcon = null;
  if (willCreateRec){
    recFreq = f.recFreq;
    recDay = Math.min(28, Math.max(1, parseInt(f.recDay) || 1));
    const remEl = document.getElementById('recRem');
    const remRaw = remEl ? parseInt(remEl.value) : NaN;
    recRem = isFinite(remRaw) ? Math.max(0, Math.min(30, remRaw)) : 3;
    const monthEl = document.getElementById('recMonth');
    recMonth = recFreq === 'yearly' && monthEl ? Math.min(11, Math.max(0, parseInt(monthEl.value) || 0)) : 0;
    const cat = Finance.getCat(f.kind, f.cat);
    recName = (f.note || '').trim() || cat.n;
    recIcon = cat.i;
  }
  /* V8.8.4.11: capture OLD transaction snapshot for context reevaluation. */
  let oldTxSnapshot = null;
  if (wasEdit && f.id){
    const existing = S.transactions.find(x => x.id === f.id);
    if (existing) oldTxSnapshot = deepClone(existing);
  }
  const newId = wasEdit ? f.id : uid('t');
  const result = await commitCriticalMutation(async () => {
    if (txCur !== accCur) Finance.rememberRate(txCur, accCur, fxRate);
    const data = {
      id: newId,
      type: f.kind, amount: amt, currency: txCur,
      accountId: f.source.accountId,
      instrumentId: f.source.type === 'instrument' ? f.source.id : null,
      walletAmount, fxRate, cat: f.cat,
      merchantName: (f.merchantName || '').trim(),
      note: (f.note || '').trim(),
      tags: (f.tags || []).slice(),
      date: f.date,
      created: origCreated
    };
    if (origRec) data.rec = origRec;
    if (wasEdit){
      const idx = S.transactions.findIndex(x => x.id === f.id);
      if (idx < 0) return false;
      S.transactions[idx] = data;
    } else {
      if (isExpense){
        S.settings.lastExpenseSourceByCountry[acc.country] = {sourceType: f.source.type, id: f.source.id};
      }
      if (willCreateRec){
        const txDate = new Date(data.date);
        const txY = txDate.getFullYear();
        const txM = txDate.getMonth();
        const txD = txDate.getDate();
        let lastAppliedMonth = null;
        if (recFreq === 'monthly'){
          if (txD >= recDay){ lastAppliedMonth = txY + '-' + pad(txM+1); }
        }
        let lastAppliedYear = null;
        if (recFreq === 'yearly'){
          if (txM > recMonth || (txM === recMonth && txD >= recDay)){ lastAppliedYear = txY; }
        }
        S.recurring.push({
          id: uid('rec'), name: recName, amount: amt, currency: txCur,
          accountId: f.source.accountId,
          instrumentId: f.source.type === 'instrument' ? f.source.id : null,
          category: f.cat, type: f.kind,
          frequency: recFreq, day: recDay, month: recMonth,
          reminderDays: recRem, icon: recIcon, active: true, isSubscription: false,
          lastAppliedMonth: lastAppliedMonth,
          lastAppliedYear: lastAppliedYear
        });
      }
      S.transactions.push(data);
    }
    /* V8.8.4.9 FIX 4: prepaid/stored-value account must never go negative.
       Checked AFTER candidate write so edits are handled correctly. */
    if (isExpense){
      const srcAcc = Finance.getAccount(f.source.accountId);
      if (srcAcc && srcAcc.type === 'prepaid'){
        try {
          const newBal = Finance.accountBalance(srcAcc.id);
          if (newBal < -0.01){
            _lastMutationError = 'prepaid-insufficient';
            return false;
          }
        } catch(_){
          _lastMutationError = 'prepaid-insufficient';
          return false;
        }
      }
    }
    return true;
  });
  if (!result.ok){
    render();
    if (_lastMutationError === 'prepaid-insufficient'){
      _lastMutationError = null;
      toast('الرصيد غير كافٍ في البطاقة/الحساب المدفوع مقدمًا');
      return;
    }
    toast(result.reason === 'invalid-state' ? 'تم رفض الحفظ لحماية سلامة البيانات' : (result.reason === 'write-failed' || result.reason === 'verify-failed' ? 'فشل الحفظ — تم التراجع' : 'تعذر الحفظ'));
    return;
  }
  /* V8.8.4.11: reevaluate BOTH old and new budget contexts (deduped).
     Runs regardless of income/expense so moving an expense to another
     month/country re-arms the old month's flags. */
  const ctxSet = new Set();
  if (oldTxSnapshot){
    const oldCtx = budgetContextForTransaction(oldTxSnapshot);
    if (oldCtx) ctxSet.add(oldCtx.country + '|' + oldCtx.month);
  }
  const newCtx = budgetContextForTransaction({type: f.kind, accountId: acc.id, date: f.date});
  if (newCtx) ctxSet.add(newCtx.country + '|' + newCtx.month);
  let collectedAlerts = [];
  for (const pair of ctxSet){
    const parts = pair.split('|');
    const a = await runBudgetAlerts(parts[0], parts[1]);
    if (a && a.length) collectedAlerts = collectedAlerts.concat(a);
  }
  if (collectedAlerts.length) S.activeBudgetAlerts = collectedAlerts;
  closeSheet(); render(); buzz(20);
  toast(wasEdit ? 'تم التعديل' : (f.kind === 'income' ? 'تم تسجيل الدخل' : 'تمت الإضافة'));
  setTimeout(showBudgetAlertsIfAny, 400);
  return true;
}

    const accounts = getCountryMoneyAccounts(country);
    const defAccId = Finance.getDefaultAccountId(country);
    const defAcc = defAccId ? Finance.getAccount(defAccId) : null;
    const pick = (defAcc && accounts.some(a => a.id === defAcc.id)) ? defAcc : accounts[0];
    f.fromAccountId = pick ? pick.id : null;
    if (f.toAccountId){
      const toAcc = Finance.getAccount(f.toAccountId);
      if (!toAcc || toAcc.id === f.fromAccountId || (f._destType === 'own' && toAcc.country !== f._destCountry)){
        const candidates = S.accounts.filter(a => !a.archived && a.id !== f.fromAccountId && a.country === f._destCountry);
        f.toAccountId = candidates[0] ? candidates[0].id : null;
      }

    /* V8.8.4.4 P0: for external transfers, destination currency comes from beneficiary */
    let destCur4Rate = null;

      destCur4Rate = beneNow ? beneNow.defaultCurrency : null;
    } else {
      const toW = f.toAccountId ? Finance.getAccount(f.toAccountId) : null;
      destCur4Rate = toW ? toW.currency : null;

    const newFromCur = w ? w.currency : null;
    f.fxRate = (w && destCur4Rate) ? Finance.suggestRate(w.currency, destCur4Rate) : 0;

    if (f._destCountry === country) return;

    f._destCountry = country;

      f.toAccountId = candidates[0] ? candidates[0].id : null;

async function saveTransfer(){
