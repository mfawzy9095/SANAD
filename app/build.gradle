plugins { id 'com.android.application' }

android {
    namespace 'com.sanad.full'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.sanad.full'
        minSdk 26
        targetSdk 35
        versionCode 36
        versionName '3.6-critical-stabilization'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                // V3.6: native Whisper/ggml must stay optimized even when the APK variant is Debug.
                arguments '-DCMAKE_BUILD_TYPE=Release',
                          '-DSANAD_FORCE_NATIVE_OPTIMIZED=ON',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                cFlags '-O3'
                cppFlags '-O3'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    androidResources { noCompress 'bin' }
}
