plugins { id 'com.android.application' }

android {
    namespace 'com.sanad.full'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.sanad.full'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '2.9-mic-fix'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-O3' }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    androidResources { noCompress 'bin' }
}
