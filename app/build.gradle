plugins {
    id 'com.android.application'
}


android {
    namespace 'com.sanad.v9test'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sanad.v9test'
        minSdk 26
        targetSdk 35
        versionCode 92009
        versionName '9.2.9-financial-qa'
    }

    signingConfigs {
        qaStable {
            def qaPath = System.getenv('SANAD_QA_KEYSTORE')
            if (qaPath) {
                storeFile file(qaPath)
                storePassword System.getenv('SANAD_QA_STORE_PASSWORD')
                keyAlias System.getenv('SANAD_QA_KEY_ALIAS')
                keyPassword System.getenv('SANAD_QA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        forensicQa {
            initWith debug
            signingConfig System.getenv('SANAD_QA_KEYSTORE') ? signingConfigs.qaStable : null
            applicationIdSuffix '.forensicqa.stable'
            versionNameSuffix '-forensic-qa'
            resValue 'string', 'app_name', 'SANAD QA — سند'
            matchingFallbacks = ['debug']
        }
        forensicQaCi {
            initWith debug
            applicationIdSuffix '.forensicqa.ci'
            versionNameSuffix '-ci-harness'
            resValue 'string', 'app_name', 'SANAD CI — سند'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.15.0'
}



// QA update continuity is a release gate; a fresh ephemeral debug key is forbidden.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('forensicqa') && !it.name.toLowerCase().contains('forensicqaci') } && System.getenv('SANAD_QA_UNSIGNED_ONLY') != '1') {
        def qa = android.signingConfigs.qaStable
        if (!qa.storeFile || !qa.storeFile.exists() || !qa.storePassword || !qa.keyAlias || !qa.keyPassword) {
            throw new GradleException('Stable QA signing key unavailable: forensic QA build blocked; no key substitution allowed.')
        }
    }
}
