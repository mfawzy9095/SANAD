plugins {
    id 'com.android.application'
}


android {
    namespace 'com.sanad.v9test'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sanad.v9test'
        minSdk 26
        targetSdk 35
        versionCode 92003
        versionName '9.2.3-local-rc'
    }

    buildTypes {
        debug {
            debuggable true
        }
        forensicQa {
            initWith debug
            applicationIdSuffix '.forensicqa.stable'
            versionNameSuffix '-forensic-qa'
            resValue 'string', 'app_name', 'SANAD QA — سند'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.15.0'
}


